      if(k==='count') return g.refs.length;
      if(k==='detail') return g.detail;
      if(k==='refs') return g.refs.join(', ');
      return '';
    }, lossMeta);
    else sorted=sorted.sort((a,b)=>b.refs.length-a.refs.length);
    const shown=sorted.slice(0,200);
    const rows=shown.map(g=>{
      const extra=g.refs.length-3;
      const refs=g.refs.slice(0,3).map(r=>String(r==null?'':r)).join(', ')+(extra>0?'… +'+extra:'');
      return `<tr><td><span class="pill">${esc(tr('kt.kind.'+g.kind))}</span></td><td>${esc(g.refs.length)}</td><td>${esc(g.detail)}</td><td>${esc(refs)}</td></tr>`;
    }).join('');
    const rest=sorted.length-shown.length;
    const more=rest?`<p class="hint">${esc(tr('kt.groups.more'))} ${esc(rest)}</p>`:'';
    const lossCols=[{id:'kind',label:'',on:1},{id:'count',label:'kt.col.count',on:1},{id:'detail',label:'kt.col.detail',on:1},{id:'refs',label:'kt.col.refs',on:1}];
    lossesEl.innerHTML=`<div class="row wrap" style="margin:10px 0">${pills}</div><div class="tw"><table><thead><tr>${sortableHead('', KT_LOSS_SORT, lossCols, lossMeta)}</tr></thead><tbody>${rows}</tbody></table></div>${more}`;
    bindSort(lossesEl, KT_LOSS_SORT, ()=>paintResult(r, purged));
  };
  let timer=0, reading=false;
  const stopPoll=()=>{if(timer){clearInterval(timer); timer=0}};
  const setRunBusy=locked=>{['kt-run','kt-purge'].forEach(id=>{const el=q('#'+id); if(el) el.disabled=!!locked})};
  const revealImport=()=>{const imp=q('#kt-import'); if(imp) imp.hidden=false};
  const progressLine=job=>{
    const done=Number(job&&job.done)||0, total=Number(job&&job.total)||0;
    return tr('kt.stage.'+String(job&&job.stage||''))+(total>0?' '+done+' / '+total:(done>0?' '+done:''));
  };
  const paintProgress=job=>{
    const card=q('#kt-progress'); if(card) card.hidden=false;
    const line=q('#kt-progress-line'); if(line) line.textContent=progressLine(job);
    const bar=q('#kt-bar');
    if(bar){
      const done=Number(job&&job.done)||0, total=Number(job&&job.total)||0;
      if(total>0){bar.max=total; bar.value=done>total?total:done}
      else bar.removeAttribute('value');
    }
    setRunBusy(true);
  };
  const hideProgress=()=>{
    const card=q('#kt-progress'); if(card) card.hidden=true;
    setRunBusy(false);
  };
  const showJobErr=msg=>{
    const err=q('#kt-job-err'); if(!err) return;
    err.hidden=!msg; err.textContent=msg||'';
  };
  const showFinished=(job, announce)=>{
    hideProgress();
    if(announce) dropCatalog();
    paintResult({counts:job&&job.counts, losses:job&&job.losses}, false);
    const msg=job&&job.error?String(job.error):'';
    showJobErr(msg);
    if(announce&&msg) toast(msg, true);
  };
  const pollJob=async()=>{
    if(!live()){stopPoll(); dropCatalog(); return}
    if(reading) return;
    reading=true;
    let job=null;
    try{job=await get('/api/keitaro/job', null)}
    finally{reading=false}
    if(!live()){stopPoll(); dropCatalog(); return}
    if(!job) return;
    if(job.running&&!job.sync_running){paintProgress(job); return}
    stopPoll();
    showFinished(job, true);
  };
  const startPoll=()=>{
    if(timer) return;
    setRunBusy(true);
    const card=q('#kt-progress'); if(card) card.hidden=false;
    timer=setInterval(pollJob, 2000);
    pollJob();
    ktDockKick();
  };
  const job0=await get('/api/keitaro/job',{running:false,stage:'idle'});
  if(!live()) return;
  if(job0&&job0.running&&!job0.sync_running){
    revealImport();
    paintProgress(job0);
    startPoll();
  }else if(job0&&(job0.stage==='done'||job0.stage==='failed')){
    revealImport();
    showFinished(job0, false);
  }
  let savedBase=conn.base_url||'';
  const paintSource=c=>{
    const src=q('#kt-src'); if(!src) return;
    const h=c&&c.host?' · '+c.host:'';
    src.textContent=tr('kt.src.'+((c&&c.source)||'none'))+h;
  };
  paintSource(conn);
  const unsaved=()=>((q('#kt-key')||{}).value||'')!==''||(((q('#kt-base')||{}).value||'').trim()!==savedBase);
  const showCheckErr=msg=>{
    const err=q('#kt-check-err'); if(!err) return;
    err.hidden=!msg; err.textContent=msg||'';
  };
  /** saveConn sends the address and the token; an empty token keeps the stored one, and the token field is cleared either way. */
  const saveConn=async()=>{
    const keyEl=q('#kt-key');
    const r=await call('PUT','/api/keitaro/settings',{base_url:((q('#kt-base')||{}).value||'').trim(), api_key:keyEl?keyEl.value:''});
    if(!live()) return r;
    savedBase=(r&&r.base_url)||'';
    const baseEl=q('#kt-base'); if(baseEl) baseEl.value=savedBase;
    if(keyEl){keyEl.value=''; keyEl.placeholder=(r&&r.has_key)?tr('kt.key.saved'):''}
    paintSource(r);
    const line=q('#kt-status'); if(line) line.hidden=true;
    const imp=q('#kt-import'); if(imp) imp.hidden=true;
    showCheckErr('');
    return r;
  };
  q('#kt-save').onclick=()=>{
    busy(q('#kt-save'), async()=>{
      try{
        await saveConn();
        if(live()) toast(tr('Saved'));
      }catch(e){
        if(!live()) return;
        toast(e.message,true);
        showCheckErr(errText(e));
      }
    });
  };
  q('#kt-check').onclick=()=>{
    const btn=q('#kt-check');
    busy(btn, async()=>{
      try{
        if(unsaved()) await saveConn();
        const r=await call('POST','/api/keitaro/check',{});
        if(!live()) return;
        const line=q('#kt-status');
        if(line){line.hidden=false; line.textContent=tr('kt.ok')+' '+((r&&r.campaigns!=null)?r.campaigns:'')}
        showCheckErr('');
        const imp=q('#kt-import'); if(imp) imp.hidden=false;
      }catch(e){
        if(!live()) return;
        toast(e.message,true);
        showCheckErr(errText(e));
      }
    });
  };
  q('#kt-run').onclick=async()=>{
    const btn=q('#kt-run');
    if(btn&&btn.disabled) return;
    setRunBusy(true);
    try{
      await call('POST','/api/keitaro/import', payload());
      S2S_LIST=null;
      if(!live()) return;
      startPoll();
    }catch(e){
      if(!live()) return;
      if(e&&e.status===409){
        toast(tr('kt.busy'), true);
        startPoll();
        return;
      }
      setRunBusy(false);
      toast(e.message,true);
    }
  };
  q('#kt-purge').onclick=()=>{
    if(!confirm(tr('kt.purge.confirm'))) return;
    const btn=q('#kt-purge');
    busy(btn, async()=>{
      try{
        const r=await call('POST','/api/keitaro/purge',{});
        if(!live()) return;
        dropCatalog();
        paintResult(r, true);
      }catch(e){
        if(!live()) return;
        toast(e.message,true);
      }
    });
  };
}
const PAGES={dashboard,flows,logs,conversions,report,keywords,lists,tools,networks,sources,offers,landings,domains,automation,settings:profile,keitaro:integrations,integrations};
pageTitle();
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{
  closeMenu();
  const box=q('#range-fields'), per=q('#period');
  if(box&&!box.hidden&&!box.contains(e.target)&&!(per&&per.contains(e.target))) closeRange();
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(anyDirty())saveAll();return}
  if(e.key==='Escape'){
    if(FORM) return;
    if(MENU){closeMenu();return}
    const box=q('#range-fields');
    if(box&&!box.hidden){closeRange();return}
    if(DRAWER) closeDrawer();
  }
});
let resizeT; window.addEventListener('resize',()=>{drawWires();fitNav();placeRange();clearTimeout(resizeT);resizeT=setTimeout(()=>{if(q('#chart'))drawChart(q('#chart'),CH.pts);fitNav();placeRange();if(q('#flowsum'))syncFlowWidths()},120)});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.getAttribute('data-theme'))themeChanged()});
// Last line of defence against losing edits by closing the tab.
window.addEventListener('beforeunload',e=>{if(anyDirty()){e.preventDefault();e.returnValue=''}});
boot();
</script>
