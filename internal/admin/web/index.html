let ACE_LOAD=null;
const CODE_EDITORS=new Set();

/** loadScript appends one script tag and resolves when it loads.
 * @param {string} src script URL
 * @returns {Promise<void>}
 */
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const el=document.createElement('script');
    el.src=src;
    el.onload=()=>resolve();
    el.onerror=()=>reject(new Error('load '+src));
    document.head.appendChild(el);
  });
}

/** ensureAce loads Ace and language_tools once. On failure ACE_LOAD is cleared so a retry can run.
 * @returns {Promise<object>} the global ace object
 */
function ensureAce(){
  if(typeof ace!=='undefined'&&ace.edit) return Promise.resolve(ace);
  if(ACE_LOAD) return ACE_LOAD;
  ACE_LOAD=(async()=>{
    await loadScript('/assets/ace/ace.js');
    await loadScript('/assets/ace/ext-language_tools.js');
    ace.config.set('basePath','/assets/ace');
    ace.require('ace/ext/language_tools');
    return ace;
  })();
  ACE_LOAD.catch(()=>{ACE_LOAD=null});
  return ACE_LOAD;
}

/** codeEditor replaces a textarea with Ace or keeps plain text when Ace fails to load.
 * @param {HTMLTextAreaElement} textarea host field
 * @param {string} path file name used for syntax mode
 * @returns {Promise<{value:string, focus:Function, destroy:Function, popupOpen:Function, setTheme:Function}>} editor facade
 */
async function codeEditor(textarea, path){
  const mode=codeMode(path);
  let editor=null, host=null, statusEl=null;
  const plain=()=>({
    get value(){return textarea?textarea.value:''},
    set value(v){if(textarea) textarea.value=v==null?'':String(v)},
    focus(){if(textarea) textarea.focus()},
    destroy(){},
    popupOpen(){return false},
    setTheme(){}
  });
  if(!textarea) return plain();
  try{await ensureAce()}catch(e){toast(tr('ed.noace'),true); return plain()}
  textarea.hidden=true;
  host=document.createElement('div');
  host.className='ace-host';
  statusEl=document.createElement('p');
  statusEl.className='hint ed-status';
  textarea.insertAdjacentElement('afterend',host);
  host.insertAdjacentElement('afterend',statusEl);
  const aceMode=mode==='text'?'ace/mode/text':'ace/mode/'+mode;
  editor=ace.edit(host,{
    mode:aceMode,
    theme:isDark()?'ace/theme/cloud_editor_dark':'ace/theme/cloud_editor',
    tabSize:2,
    useSoftTabs:true,
    showPrintMargin:false,
    enableBasicAutocompletion:true,
    enableLiveAutocompletion:true,
    fontSize:'12.5px'
  });
  editor.setValue(textarea.value,-1);
  const paintStatus=()=>{
    if(!statusEl) return;
    if(mode==='text'){statusEl.textContent=''; statusEl.classList.remove('bad'); return}
    const n=(editor.session.getAnnotations()||[]).filter(a=>a&&a.type==='error').length;
    if(!n){statusEl.textContent=tr('ed.clean'); statusEl.classList.remove('bad')}
    else{statusEl.textContent=tr('ed.errors').replace('{n}',String(n)); statusEl.classList.add('bad')}
  };
  editor.session.on('changeAnnotation',paintStatus);
  paintStatus();
  const wrap={
    get value(){return editor.getValue()},
    set value(v){editor.setValue(v==null?'':String(v),-1); paintStatus()},
    focus(){editor.focus()},
    destroy(){
      CODE_EDITORS.delete(wrap);
      if(editor){editor.destroy(); editor=null}
      if(host){host.remove(); host=null}
      if(statusEl){statusEl.remove(); statusEl=null}
      if(textarea){textarea.hidden=false}
    },
    popupOpen(){return !!(editor&&editor.completer&&editor.completer.popup&&editor.completer.popup.isOpen)},
    setTheme(){if(editor) editor.setTheme(isDark()?'ace/theme/cloud_editor_dark':'ace/theme/cloud_editor')}
  };
  CODE_EDITORS.add(wrap);
  return wrap;
}

// openStreamPage edits the HTML file named by an @page: output. The stream field keeps the reference.
// name is the file name. Returns nothing.
// A missing file (HTTP 404) stays editable so saving creates it; any other load error is toasted and saving stays off.
async function openStreamPage(name){
  const sc=$('<div class="scrim" style="z-index:74"></div>');
  const m=$(`<div class="modal" role="dialog" style="width:min(1100px,96vw);max-height:min(92vh,980px);overflow:auto"><h3>${esc(name)}</h3>
    <p class="hint" id="pg-miss" hidden>${esc(tr('page.missing'))}</p>
    <textarea id="pg-body" class="code" spellcheck="false" style="min-height:60vh"></textarea>
    <div class="row"><div class="spacer"></div><button type="button" data-no>${tr('Cancel')}</button><button type="button" class="primary" data-yes disabled>${tr('Save')}</button></div></div>`);
  let ed=null;
  const close=()=>{if(ed) ed.destroy(); sc.remove();m.remove();document.removeEventListener('keydown',key,true)};
  const key=(e)=>{
    if(!m.isConnected) return;
    if(e.key==='Escape'){if(ed&&ed.popupOpen()) return; e.stopPropagation();e.preventDefault();close()}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.stopPropagation();e.preventDefault();const b=q('[data-yes]',m); if(b&&!b.disabled) b.click()}
  };
  sc.onclick=close;
  q('[data-no]',m).onclick=close;
  q('[data-yes]',m).onclick=async()=>{
    const save=q('[data-yes]',m);
    if(!save||save.disabled) return;
    save.disabled=true;
    try{
      await call('PUT','/api/pages/'+encodeURIComponent(name),{content:ed?ed.value:(q('#pg-body',m)||{}).value});
      toast(tr('Saved'));
      close();
    }catch(err){save.disabled=false; toast(err.message,true)}
  };
  document.addEventListener('keydown',key,true);

/** shareSumText is the line under a share list: the sum, and what to do when it is not 100.
 * @param {number} sum sum of the list in percent
 * @param {number} rows how many rows the list has
 * @returns {string} text, or '' for an empty list
 */
function shareSumText(sum, rows){
  if(!rows) return '';
  const t=trFill('share.sum',{n:sum});
  if(sum>100) return t+' — '+tr('share.over');
  return sum<100?t+' — '+tr('share.under'):t;
}
/** paintShareSums writes the sum under each share list of the drawer and marks the fields red while a list is over 100.
 * @param {Element} body drawer body
 * @returns {void}
 */
function paintShareSums(body){
  [['offer-rows','data-oshare','offer','data-oid'],['landing-rows','data-lshare','landing','data-lid']].forEach(([boxId, attr, kind, selAttr])=>{
    const box=q('#'+boxId, body);
    if(!box) return;
    // A row with no catalog entry chosen is not saved, so it does not count.
    const inputs=[...qa('['+attr+']', box)].filter(el=>{
      const row=el.closest('.share-row'), sel=row&&q('['+selAttr+']', row);
      return !!(sel&&sel.value);
    });
    qa('['+attr+']', box).forEach(el=>{if(!inputs.includes(el)) el.classList.remove('over')});
    const sum=shareSum(inputs.map(el=>el.value));
    inputs.forEach(el=>el.classList.toggle('over', sum>100));
    const note=q('[data-sharesum="'+kind+'"]', body);
    if(!note) return;
    note.className='share-sum'+(sum>100?' over':'');
    note.textContent=shareSumText(sum, inputs.length);
  });
}
/** bindShareBox wires one share list: typing and removing a row refresh the sum; a catalog choice repaints the stream.
 * Shares are typed by hand and never adjusted to reach 100.
 * @param {Element} body drawer body
 * @param {string} boxId rows container id
 * @param {string} attr share input attribute
 * @param {string} selAttr catalog select attribute
 * @returns {void}
 */
function bindShareBox(body, boxId, attr, selAttr){
  const box=q('#'+boxId, body);
  if(!box) return;
  qa('['+attr+']', box).forEach(inp=>{inp.oninput=()=>paintShareSums(body)});
  qa('[data-delshare]', box).forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const row=btn.closest('.share-row');
      if(row) row.remove();
      paintShareSums(body);
      changed(box);
    };
  });
  qa('['+selAttr+']', box).forEach(sel=>{sel.onchange=()=>{collectStream();paintStream()}});
  paintShareSums(body);
}

function collectStream(){
  const d=q('#sdrawer'); if(!d||!CUR||EDIT<0)return;
  const s=(CUR.streams||[])[EDIT]; if(!s)return;
  const v=id=>q('#'+id,d), has=k=>!!q(`.crow[data-cond="${k}"]`,d), val=id=>{const e=v(id);return e?e.value:''}, on=id=>{const e=v(id);return !!(e&&e.checked)};
  s.name=val('s_name').trim();
  s.status=on('s_status');
  s.comment=val('s_comment').trim();
  s.filter_or=v('s_filter_or')?val('s_filter_or')==='1':!!s.filter_or;
  if(!s.filter_or) delete s.filter_or;
  const red=val('s_redirect'), prev=s.out||{};
  const outBox=v('s_outv');
  const outVal=red==='landing'?'':red==='group'?(v('s_group')?val('s_group'):(prev.redirect==='group'?prev.out:'')):(outBox?readVariants(outBox):(prev.redirect==='group'?'':prev.out||''));
  const shares=outBox?readShares(outBox):(Array.isArray(prev.out_shares)?prev.out_shares:[]);
  // A field that is not on screen (the type does not use it) keeps its value.
  const readShare=(row, attr, selAttr)=>{
    const share=q('['+attr+']',row), sel=q('['+selAttr+']',row);
    return {id:sel?sel.value:'', share:share?shareInt(share.value):100};
  };
  s.out={redirect:red,out:outVal,out_shares:shares,
    chance:+val('s_chance')||0,distribution:v('s_dist')?val('s_dist'):(prev.distribution||'random'),header:val('s_header'),
    offers:q('#offer-rows',d)?[...qa('.offer-row',d)].map(row=>readShare(row,'data-oshare','data-oid')).filter(r=>r.id):[],
    landings:q('#landing-rows',d)?[...qa('.land-row',d)].map(row=>readShare(row,'data-lshare','data-lid')).filter(r=>r.id):[]};
  s.separation={enabled:on('sep_en'),file:val('sep_file').trim()};
  // Keys the editor does not own (a rule from a newer server or an import) are kept as they are.
  const r=ruleExtras(s.rules, ruleKeys());
  COND.filter(c=>c.kind==='list').forEach(c=>{r[c.k]=has(c.k)?readLF(c):{flag:0,values:[],raw:''}});
  const sids=has('sub_ids')?readSubIDs(d):{};
  if(Object.keys(sids).length) r.sub_ids=sids;
  if(has('ip_list')) applyIPList(r,d,(s.rules&&s.rules.ip_list)||{});
  else r.ip_list={flag:0,file:''};
  if(has('device')){r.computer=on('d_computer')?0:1;r.phone=on('d_phone')?0:1;r.tablet=on('d_tablet')?0:1}
  else{r.computer=0;r.phone=0;r.tablet=0}
  COND.filter(c=>c.kind==='tri').forEach(c=>{r[c.k]=has(c.k)?+val('r_'+c.k):0});
  const ops={}; if(has('operators'))qa('#ops .oprow',d).forEach(row=>{const n=q('.op-n',row).value.trim();if(n)ops[n]=+q('.op-f',row).value});
  r.operators=ops;
  const days=[false,false,false,false,false,false,false]; if(has('schedule'))qa('.schd',d).forEach(c=>days[+c.dataset.d]=c.checked);
  r.schedule={enabled:has('schedule'),days};
  r.limit=has('limit')?{enabled:true,type:+val('lim_type'),count:+val('lim_count')||0,seconds:+val('lim_sec')||0}:{enabled:false,type:1,count:0,seconds:0};
  s.rules=r;
  const bots={}, pb=s.bots||{};
  BOTCHK.forEach(([id])=>bots[id]=on('b_'+id));
  bots.save_ip=on('b_save_ip'); bots.redirect=val('b_redirect')||'skip';
  bots.header=v('b_header')?val('b_header'):(pb.header||'text/html');
  bots.out=v('b_outv')?readVariants(v('b_outv')):(pb.out||'');
  s.bots=bots;
  s.curl=v('s_rw')?readRewrite(v('s_rw')):(s.curl||''); s.b_curl=v('b_rw')?readRewrite(v('b_rw')):(s.b_curl||'');
  s.remote={enabled:on('rm_en'),url:val('rm_url'),regexp:val('rm_re'),reserved:val('rm_res'),cache:+val('rm_cache')||0};
  s.api_mac={enabled:on('am_en'),code:val('am_code'),prob:+val('am_prob')||0};
  return CUR;
}

function collectFlow(){
  const d=q('#gdrawer'), g=CUR; if(!d||!g)return;
  const v=id=>q('#'+id,d), val=id=>{const e=v(id);return e?e.value:''}, on=id=>{const e=v(id);return !!(e&&e.checked)};
  const was=g.id;
  g.id=val('g_id').trim(); g.name=val('g_name').trim();
  if(v('g_folder')){const f=groupInputValue(v('g_folder')); const same=f&&campaignFolders().find(x=>x.toLowerCase()===f.toLowerCase()); if(f) g.folder=same||f; else delete g.folder}
  const srcSel=v('g_source'); if(srcSel&&srcSel.dataset.ready) g.source_id=srcSel.value;
  const domSel=v('g_domain'); if(domSel) g.domain_id=domSel.value;
  if(v('g_cost_param')&&!v('g_cost_param').disabled) g.cost_param=val('g_cost_param').trim();
  if(v('g_cost_token')) g.cost_token=val('g_cost_token').trim();
  if(v('g_currency_param')&&!v('g_currency_param').disabled) g.currency_param=val('g_currency_param').trim();
  if(v('g_currency_token')) g.currency_token=val('g_currency_token').trim();
  g.aliases=v('g_aliases')?tagValues(v('g_aliases')):(g.aliases||[]);
  const prev=g.redirect; g.redirect=val('g_redirect'); g.header=val('g_header');
  g.out=g.redirect==='group'?(v('g_group')?val('g_group'):(prev==='group'?g.out:'')):(v('g_outv')?readVariants(v('g_outv')):(prev==='group'?'':g.out||''));
  g.geo=val('g_geo'); g.uniq_method=val('g_uniq');
  g.uniq_seconds=Math.max(0,Math.round((+val('g_uniqh')||0)*3600))||86400;
  g.save_keys=on('g_savekeys'); g.save_keys_se=on('g_savekeys_se');
  if(v('g_sticky')){if(on('g_sticky')) g.sticky_stream=true; else delete g.sticky_stream}
  g.firewall={enabled:on('fw_en'),queries:+val('fw_q')||0,seconds:+val('fw_s')||0};
  if(q('#s2s-rows',d)){
    g.postbacks=[...qa('#s2s-rows .s2s',d)].map(row=>({
      url:q('.s2s-url',row).value.trim(),
      method:(q('.s2s-method',row).value||'GET').toUpperCase(),
      statuses:[...qa('[data-st]',row)].filter(c=>c.checked).map(c=>c.dataset.st)
    })).filter(p=>p.url&&p.statuses.length);
  }
  if(q('#s2s-global',d) && S2S_LIST){
    const ids=[...qa('[data-gs2s]',d)].filter(c=>c.checked).map(c=>c.dataset.gs2s).filter(Boolean);
    if(ids.length) g.postback_ids=ids; else delete g.postback_ids;
  }
  // Keep the address bar and the links pointing at this flow in step with its ID.
  const touched=[g];
  if(g.id&&g.id!==was){
    GROUPS.forEach(x=>{
      let hit=false;
      if(x.redirect==='group'&&(x.out||'').trim()===was){x.out=g.id;hit=true}
      (x.streams||[]).forEach(s=>{if(s&&s.out&&s.out.redirect==='group'&&(s.out.out||'').trim()===was){s.out.out=g.id;hit=true}});
      if(hit&&x!==g) touched.push(x);
    });
    history.replaceState(null,'','#/flows/'+encodeURIComponent(g.id));
  }
  return touched;
}

function normalizeUI(raw){
  if(!raw||typeof raw!=='object') return;
  if(raw.cols&&typeof raw.cols==='object'&&!Array.isArray(raw.cols)) UI.cols=raw.cols;
  const dash=raw.dash&&typeof raw.dash==='object'?raw.dash:{};
  UI.dash={panels:dash.panels==null?null:Array.isArray(dash.panels)?dash.panels.slice():null, dim:String(dash.dim||'')};
  const co=raw.company&&typeof raw.company==='object'?raw.company:{};
  UI.company=defaultCompany();
  UI.company.name=String(co.name||'').trim();
  const lg=String(co.logo==null?'':co.logo);
  UI.company.logo=lg.startsWith('data:image/')?lg:'';
}
const DASH_DIM_KEY='kuztds-dash-dim';
/**
 * loadUI reads the shared /api/ui into UI.
 * When the server copy has no columns, panels or dimension yet, the old per-browser values fill UI (see uiSeedPlan).
 * Only a user allowed to write /api/ui (the settings section) also sends them once with a PUT and drops the browser keys after the save;
 * anyone else keeps them in memory, with no request, no toast and the browser keys left as they are.
 * @returns {Promise<void>}
 */
async function loadUI(){
  const raw=await get('/api/ui',null);
  if(!raw) return;
  normalizeUI(raw);
  const plan=uiSeedPlan(UI, sectionAllowed(ME,'settings'));
  if(!plan.seed) return;
  let moved=[];
  try{moved=seedUI(UI, k=>localStorage.getItem(k), COL_KEY, DASH_DIM_KEY)}catch(e){}
  if(!moved.length||!plan.persist) return;
  if(await saveUI()){
    try{moved.forEach(k=>localStorage.removeItem(k))}catch(e){}
  }
}
/**
 * saveUI writes UI to the shared /api/ui; a failure shows the server text as a toast.
 * @returns {Promise<boolean>} true when the server stored it
 */
async function saveUI(){
  try{await call('PUT','/api/ui',UI); return true}catch(e){toast(e.message,true); return false}
}
// fieldReady reports whether a journal column may be shown.
// table is "events" or "conversions". name is the field name.
// It returns true when the field is absent (an old backend) or its wave is ready.
function fieldReady(table, name){
  const list=(FIELDS&&FIELDS.fields)||[];
  const f=list.find(x=>x&&x.name===name);
  if(!f) return true;
  const wave=table==='conversions'?(f.conv_wave||''):(f.events_wave||'');
  if(!wave) return true;
  const bag=FIELDS.ready&&FIELDS.ready[table];
  return !!(bag&&bag[wave]);
}
// fieldsFor lists fields that have a column on table and a ready wave.
// table is "events" or "conversions". It returns the matching field objects.
function fieldsFor(table){
  return ((FIELDS&&FIELDS.fields)||[]).filter(f=>f&&f.name&&(table==='conversions'?f.conv:f.events)&&fieldReady(table, f.name));
}
// fieldLabel is the translated caption of a journal field.
// name is the field name. It returns the fld.<name> phrase.
function fieldLabel(name){return tr('fld.'+name)}
// colSpec normalises a catalog row into a column descriptor.
// row is a tuple [id, label, on] or an object. It returns {id, label, on, field, fields}.
function colSpec(row){
  if(Array.isArray(row)) return {id:row[0],label:row[1],on:!!row[2],field:row[3]||'',fields:row[4]||null};
  return {id:row.id,label:row.label,on:!!row.on,field:row.field||'',fields:Array.isArray(row.fields)?row.fields.slice():null};
}
// colShown hides a logs or conversion column whose field wave is not ready.
// kind is the catalog id. c is a column descriptor. It returns true when the column stays.
function colShown(kind, c){
  if(c&&c.id&&hiddenCols(ME).has(c.id)) return false;
  const table=kind==='logs'?'events':kind==='conv'?'conversions':'';
  if(!table||!c) return true;
  const names=(c.fields&&c.fields.length)?c.fields:(c.field?[c.field]:[]);
  if(columnHidden(ME, names)) return false;
  return names.every(n=>fieldReady(table, n));
}

const FLOW_COLS_MIGRATED='kuztds-flow-cols-epc';
const FLOW_LOCKED=new Set(['num','name']);
const DOM_LOCKED=new Set(['id','host']);
/** lockedCols returns column ids that stay on and pinned for a report kind.
 * @param {string} kind report kind
 * @returns {Set<string>} locked ids, empty when the kind has none
 */
function lockedCols(kind){return kind==='flows'?FLOW_LOCKED:kind==='domains'?DOM_LOCKED:new Set()}
/** migrateFlowCols turns EPC on and uEPC off when a saved flows list still has uEPC on and EPC off.
 * @param {Array<{id:string,on:boolean}>} out merged column list
 * @returns {void}
 */
function migrateFlowCols(out){
  const uepc=out.find(r=>r.id==='uepc');
  const epc=out.find(r=>r.id==='epc');
  if(uepc&&epc&&uepc.on&&!epc.on){uepc.on=false;epc.on=true}
}
function loadCols(kind){
  const defs=colCatalog(kind).map(colSpec).filter(c=>colShown(kind,c));
  const pin=list=>{
    const locked=lockedCols(kind);
    list.forEach(r=>{if(locked.has(r.id)) r.on=true});
    if(!locked.size) return list;
    const order=colCatalog(kind).map(row=>row[0]);
    const front=list.filter(r=>locked.has(r.id)).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
    return front.concat(list.filter(r=>!locked.has(r.id)));
  };
  const own=Array.isArray(VIEW_COLS[kind]);
  let saved=own?VIEW_COLS[kind]:UI.cols[kind];
  if(saved===undefined) saved=null;
  if(kind==='conv'&&saved&&!Array.isArray(saved)&&typeof saved==='object'){
    return defs.map(d=>saved[d.id]==null?d:Object.assign({},d,{on:!!saved[d.id]}));
  }
  if(!Array.isArray(saved)) return pin(defs);
  const by=new Map(defs.map(d=>[d.id,d]));
  const migrate={group:'campaign',ua:'useragent',tz:'timezone',offer:'offer_id',landing:'landing_id',source:'source_id',network:'network_id'};
  for(let n=1;n<=12;n++) migrate['s'+n]='sub_id_'+n;
  const out=[];
  saved.forEach(s=>{
    if(!s) return;
    let id=s.id;
    if((kind==='logs'||kind==='conv')&&migrate[id]) id=migrate[id];
    const d=id&&by.get(id);
    if(!d) return;
    out.push(Object.assign({},d,{on:!!s.on}));
    by.delete(id);
  });
  const modelIsNew=kind==='logs'&&by.has('device_model');
  by.forEach(d=>out.push(d));
  adoptModelCol(out,modelIsNew);
  if(kind==='flows'&&!own){
    try{
      if(!localStorage.getItem(FLOW_COLS_MIGRATED)) migrateFlowCols(out);
    }catch(e){}
  }
  if(out.length&&!out.some(r=>r.on)) out[0].on=true;
  return pin(out);
}
// saveCols stores a column list in the account's page views; it is called only from an explicit Apply in the columns window, never while a page loads.
// kind is the catalog id. rows are {id,on}. The list is applied in memory at once, even when the server refuses it.
// It returns a promise of true when the server stored the list; a failure shows a toast.
async function saveCols(kind,rows){
  if(!Object.prototype.hasOwnProperty.call(VIEW_COLS,kind)) return false;
  VIEW_COLS[kind]=pageViewCols(rows);
  const ok=await flushPageViews();
  if(!ok) toast(tr('ui.fail'),true);
  return ok;
}
// endFlowColsMigration ends the in-memory flows migration of loadCols once the user has saved the flow columns.
// kind is the catalog id; any other kind is ignored.
function endFlowColsMigration(kind){
  if(kind!=='flows') return;
  try{localStorage.setItem(FLOW_COLS_MIGRATED,'1')}catch(e){}
}
function openCols(kind,onApply){
  let rows=loadCols(kind).map(r=>Object.assign({},r));
  const locked=lockedCols(kind);
  const sc=$('<div class="scrim" style="z-index:74"></div>');
  const m=$(`<div class="modal" role="dialog" style="width:min(480px,92vw)"><h3>${tr('cols.title')}</h3>
    <input id="col-find" placeholder="${esc(tr('Search…'))}" autocomplete="off">
    <label class="tog"><input type="checkbox" id="col-all"> ${tr('Select all')}</label>
    <div class="colbox" id="col-list"></div>
    <div class="row"><button type="button" id="col-reset">${tr('cols.restore')}</button><div class="spacer"></div><button type="button" data-no>${tr('Cancel')}</button><button type="button" class="primary" data-yes>${tr('Apply')}</button></div></div>`);
  const close=()=>{sc.remove();m.remove()};
  const paint=()=>{
    const qv=q('#col-find',m).value.trim().toLowerCase();
    const list=q('#col-list',m);
    const lockN=rows.filter(r=>locked.has(r.id)).length;
    list.innerHTML=rows.map((r,i)=>{
      const label=tr(r.label);
      if(qv&&!label.toLowerCase().includes(qv)&&!r.id.toLowerCase().includes(qv)) return '';
      const hold=locked.has(r.id);
      const grip=hold?'<span class="grip"></span>':`<span class="grip">${icon('grip')}</span>`;
      return `<div class="colrow" draggable="${hold||qv?'false':'true'}" data-i="${i}">${grip}<label class="tog"><input type="checkbox" data-i="${i}" ${hold?'checked disabled':(r.on?'checked':'')}>${esc(label)}</label></div>`;
    }).join('');
    q('#col-all',m).checked=rows.every(r=>r.on);
    let from=-1;
    qa('.colrow',list).forEach(row=>{
      row.ondragstart=e=>{if(qv||+row.dataset.i<lockN){e.preventDefault();return} from=+row.dataset.i; e.dataTransfer.effectAllowed='move'};
      row.ondragover=e=>e.preventDefault();
      row.ondrop=e=>{
        e.preventDefault();
        const to=+row.dataset.i;
        if(from<0||to===from||qv||from<lockN||to<lockN) return;
        const [item]=rows.splice(from,1);
        rows.splice(to,0,item);
        from=-1;
        paint();
      };
    });
    qa('input[data-i]',list).forEach(c=>c.onchange=()=>{
      const i=+c.dataset.i;
      if(locked.has(rows[i].id)){c.checked=true;return}
      if(!c.checked&&rows.filter(r=>r.on).length<=1){c.checked=true;return}
      rows[i].on=c.checked;
      q('#col-all',m).checked=rows.every(r=>r.on);
    });
  };
  q('#col-find',m).oninput=paint;
  q('#col-all',m).onchange=()=>{
    if(q('#col-all',m).checked) rows.forEach(r=>{r.on=true});
    else rows.forEach((r,i)=>{r.on=locked.has(r.id)||(!locked.size&&i===0)});
    paint();
  };
  q('#col-reset',m).onclick=()=>{rows=colCatalog(kind).map(colSpec).filter(c=>colShown(kind,c)); q('#col-find',m).value=''; paint()};
  q('[data-no]',m).onclick=close;
  sc.onclick=close;
  q('[data-yes]',m).onclick=async()=>{const saving=saveCols(kind,rows); close(); onApply&&onApply(); if(await saving) endFlowColsMigration(kind)};
  document.body.append(sc,m);
  paint();
}

/** bindColTools wires the toolbar refresh control and the header column gear.

// fltName is the caption of a filter field. Clicks call ts a click time.
// table is "events" or "conversions". name is the field name. It returns a phrase.
function fltName(table, name){

// idLabel is the human name of a catalog id, or the id itself.
// field is the journal field. id is the stored value. It returns a string.
// deviceLabel turns a stored device type into a phrase, or the raw value.
// v is the device field from a row or filter. It returns a display string.
function deviceLabel(v){
  const k=deviceKey(v);
  return k?tr(k):String(v==null?'':v);
}
function idLabel(field, id){
  if(id==null||id==='') return '';
  if(field==='status'||field==='original_status'||field==='prev_status'){
    const lk=fltStatusLabelKey(id);
    if(lk) return tr(lk);
  }
  if(field==='offer_id') return nameOf(OFFERS, id);
  if(field==='landing_id') return nameOf(LANDINGS, id);
  if(field==='network_id') return nameOf(NETS, id);
  if(field==='source_id') return nameOf(SOURCES, id);
  if(field==='campaign_id') return nameOf(GROUPS, id);
  if(field==='campaign'||field==='origin_campaign') return String(id);
  if(field==='device'){
    const k=deviceKey(id);
    if(k) return deviceLabel(id)+' · '+id;
  }

}
/**
 * fltCatalogGroup reads a folder or group label for one catalog entity key.
 * field is the journal field. key is the stored id or campaign name.
 * @returns {string} group label or ''
 */
function fltCatalogGroup(field, key){
  const k=String(key==null?'':key);
  if(!k) return '';
  if(field==='campaign'||field==='campaign_id'||field==='origin_campaign'||field==='origin_campaign_id'){
    const g=(GROUPS||[]).find(x=>x&&(String(x.id)===k||String(x.name)===k));
    return g?grantLabel(g):'';
  }
  if(field==='offer_id'){ const row=(OFFERS||[]).find(x=>x&&String(x.id)===k); return grantLabel(row) }
  if(field==='landing_id'){ const row=(LANDINGS||[]).find(x=>x&&String(x.id)===k); return grantLabel(row) }
  if(field==='network_id'){ const row=(NETS||[]).find(x=>x&&String(x.id)===k); return grantLabel(row) }
  if(field==='source_id'){ const row=(SOURCES||[]).find(x=>x&&String(x.id)===k); return grantLabel(row) }
  return '';

// condsQS serialises conditions as repeated f=field:op:value parameters.
// conds is an array of {f, op, v}. It returns a URLSearchParams.
function condsQS(conds){
  const qs=new URLSearchParams();
  (Array.isArray(conds)?conds:[]).forEach(c=>{
    if(!c||!c.f||!c.op) return;
    const vals=Array.isArray(c.v)&&c.v.length?c.v:[''];
    vals.forEach(v=>qs.append('f', c.f+':'+c.op+':'+condEscapeFilterValue(c.op, String(v==null?'':v))));
  });
  return qs;
}

  }).map(it=>{

/**
 * fltValueItems merges catalog options with period log-values rows.
 * field is the journal field. rows come from GET /api/log-values.
 * @returns {Array<{key:string,label:string,group:string}>}
 */
function fltValueItems(field, rows){
  const base=fltFieldStrict(field)||FLT_CATALOG.has(field)?fltCatalogBase(field):[];
  const extra=[];
  (rows||[]).forEach(r=>{
    const key=r&&r.key!=null?String(r.key):'';
    if(!key) return;
    const name=idLabel(field, key);
    extra.push({key, label:fltOptionLabel(field, key, name), group:fltCatalogGroup(field, key)});
  });
  if(!base.length&&!extra.length&&(field==='status'||field==='original_status'||field==='prev_status')){
    FLT_STATUS_KEYS.forEach(k=>{
      const lk=fltStatusLabelKey(k);
      extra.push({key:k, label:lk?tr(lk):k, group:''});
    });
  }

}

// filterBuilder edits conditions in a modal and calls onApply after a successful save.
// table is "events" or "conversions". state is the live {f, op, v} array, mutated on apply.
// onApply is optional. It returns nothing. Cancel leaves state unchanged.
async function filterBuilder(table, state, onApply){
  await Promise.all([ensureCatalogs(), ensureGroups().catch(()=>[])]);
  const draft=(Array.isArray(state)?state:[]).map(c=>({f:c.f||'', op:c.op||'eq', v:Array.isArray(c.v)?c.v.slice():[]}));
  if(!draft.length) draft.push({f:'', op:'eq', v:[]});
  const cache={}, opts={}, optsLoaded={}, optsLoading={};
  const fieldMeta=(name)=>((FIELDS&&FIELDS.fields)||[]).find(f=>f&&f.name===name);
  const seedOpts=(field)=>{
    if(!field) return;
    if(!opts[field]) opts[field]=fltCatalogBase(field);
  };
  const valuesFor=(field)=>{
    if(Object.prototype.hasOwnProperty.call(cache, field)) return cache[field];
    const meta=fieldMeta(field);
    if(!fltFieldSuggest(field, meta&&meta.dim)){ cache[field]=Promise.resolve([]); return cache[field] }
    const b=rangeBounds();
    const qs=new URLSearchParams({table:table, field:field, from:b.from.toISOString(), to:b.to.toISOString()});
    cache[field]=get('/api/log-values?'+qs.toString(), []).then(rows=>Array.isArray(rows)?rows:[]);
    return cache[field];
  };
  const loadOpts=(field)=>{
    if(!field) return Promise.resolve([]);
    const meta=fieldMeta(field);
    if(!fltFieldSuggest(field, meta&&meta.dim)) return Promise.resolve([]);
    seedOpts(field);
    if(optsLoaded[field]) return Promise.resolve(opts[field]);
    if(optsLoading[field]) return optsLoading[field];
    optsLoading[field]=valuesFor(field).then(rows=>{
      opts[field]=fltValueItems(field, rows);
      optsLoaded[field]=true;
      optsLoading[field]=null;
      if(PICK_COMBO&&PICK_COMBO.comboField===field&&typeof PICK_COMBO.renderList==='function') PICK_COMBO.renderList();
      return opts[field];
    });
    return optsLoading[field];
  };
  draft.forEach(row=>{ if(row&&row.f) seedOpts(row.f) });
  const m=formModal(tr('flt.title'), `<div id="fb-rows" class="fbuild"></div>
    <div class="row"><button type="button" id="fb-add">${esc(tr('flt.add'))}</button><button type="button" id="fb-reset">${esc(tr('flt.reset'))}</button></div>`, async()=>{
    qa('[data-chip]', m).forEach(inp=>{
      const i=+inp.dataset.i;
      const row=draft[i];
      if(row&&!fltFieldStrict(row.f)) fltCommit(row, inp.value);
    });
    const next=fltApplyDraft(draft);
    if(Array.isArray(state)) state.splice(0, state.length, ...next);
    if(typeof onApply==='function') return await onApply();
  }, tr('flt.apply'));
  if(m) m.style.width='min(920px,94vw)';
  const commitInput=(inp, redraw)=>{
    if(!inp) return;
    const i=+inp.dataset.i;
    if(!draft[i]) return;
    const had=fltCommit(draft[i], inp.value);
    inp.value='';
    if(had&&typeof redraw==='function') redraw(i);
  };
  const fieldSelect=(selected, i)=>{
    const taken=new Set(draft.map((row,j)=>j!==i&&row.f?row.f:null).filter(Boolean));
    const have=new Set(fieldsFor(table).map(f=>f.name));
    if(selected) have.add(selected);
    const groups=FLT_GROUPS.map(([g, names])=>{
      const opts=names.filter(n=>have.has(n)&&(!taken.has(n)||n===selected)).map(n=>`<option value="${esc(n)}"${n===selected?' selected':''}>${esc(fltName(table, n))}</option>`).join('');
      return opts?`<optgroup label="${esc(tr('flt.group.'+g))}">${opts}</optgroup>`:'';
    }).join('');
    return `<div class="flt-fld"><select data-f><option value="">—</option>${groups}</select><button type="button" class="flt-clr icon sm ghost" data-f-clr hidden aria-label="${esc(tr('Clear'))}">${icon('x')}</button></div>`;
  };
  const fbCanAdd=()=>{
    const names=fieldsFor(table).map(f=>f.name);
    const used=new Set(draft.map(r=>r.f).filter(Boolean));
    return names.some(n=>!used.has(n));
  };
  const opSelect=(op)=>`<select data-op>${FLT_OPS.map(([k,lab])=>`<option value="${k}"${k===op?' selected':''}>${esc(tr(lab))}</option>`).join('')}</select>`;
  const paint=(focus)=>{
    closeFltCombo();
    const box=q('#fb-rows', m); if(!box) return;
    box.innerHTML=draft.map((row,i)=>{
      const chips=(row.v||[]).map((v,j)=>`<span class="chip"><span class="v">${esc(idLabel(row.f, v))}</span><button type="button" class="icon sm ghost" data-i="${i}" data-vdrop="${j}" aria-label="${esc(tr('Delete'))}">${icon('x')}</button></span>`).join('');
      const meta=row.f?fieldMeta(row.f):null;
      const suggest=fltFieldSuggest(row.f, meta&&meta.dim);
      const combo=suggest?` role="combobox" aria-expanded="false" aria-controls="fb-list-${i}" aria-autocomplete="list"`:'';
      const valBox=suggest?`<div class="tags flt-val">${chips}<input class="tin" data-chip data-i="${i}" placeholder="${esc(tr('flt.value'))}" autocomplete="off"${combo}><span class="flt-chev" aria-hidden="true">${icon('down')}</span></div>`:`<div class="tags">${chips}<input class="tin" data-chip data-i="${i}" placeholder="${esc(tr('flt.value'))}" autocomplete="off"></div>`;
      return `<div class="frow" data-i="${i}">${fieldSelect(row.f, i)}${opSelect(row.op)}${valBox}<button type="button" class="icon sm ghost" data-rm="${i}" aria-label="${esc(tr('Delete'))}">${icon('x')}</button></div>`;
    }).join('');
    qa('[data-f]', box).forEach(sel=>{
      const row=sel.closest('.frow');
      const clr=q('[data-f-clr]', row);
      const syncClr=()=>{ if(clr) clr.hidden=!sel.value };
      syncClr();
      sel.onchange=()=>{
        const i=+row.dataset.i;
        if(!draft[i]) return;
        const prev=draft[i].f;
        draft[i].f=sel.value; draft[i].v=[];
        if(prev&&prev!==sel.value){ delete opts[prev]; delete optsLoaded[prev]; delete optsLoading[prev] }
        if(sel.value){ seedOpts(sel.value); delete optsLoaded[sel.value]; loadOpts(sel.value).then(()=>paint(i)) }
        syncClr();
        paint(i);
      };
      if(clr) clr.onclick=()=>{ sel.value=''; sel.onchange() };
    });
    qa('[data-op]', box).forEach(sel=>sel.onchange=()=>{
      const i=+sel.closest('.frow').dataset.i;
      if(!draft[i]) return;
      draft[i].op=sel.value;
      if((sel.value==='eq'||sel.value==='ne')&&draft[i].v.length>1) draft[i].v=draft[i].v.slice(0,1);
      paint(i);
    });
    qa('[data-vdrop]', box).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(draft[i]) draft[i].v.splice(+b.dataset.vdrop, 1);
      paint(i);
    });
    qa('[data-rm]', box).forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm, 1); paint()});
    qa('[data-chip]', box).forEach(inp=>{
      const i=+inp.dataset.i;
      const row=draft[i];
      const meta=row&&row.f?fieldMeta(row.f):null;
      const strict=row&&fltFieldStrict(row.f);
      if(row&&fltFieldSuggest(row.f, meta&&meta.dim)){
        const multi=fltOpMulti(row.op||'eq');
        bindFltCombo(inp, {
          field:row.f,
          multi,
          getItems:()=>opts[row.f]||fltCatalogBase(row.f),
          isLoading:()=>!!optsLoading[row.f],
          selected:()=>(draft[i]&&draft[i].v)||[],
          onPick:key=>{
            if(fltPickValue(draft[i], key, multi)){
              inp.value='';
              if(multi){ paint(i); const el=q(`[data-chip][data-i="${i}"]`, m); if(el) el.focus() }
              else paint(i);
            }
          },
          onPop:()=>{
            if(!draft[i]||!draft[i].v.length) return false;
            draft[i].v.pop();
            paint(i);
            return true;
          }
        });
      }
      if(strict){
        inp.onblur=()=>{ if(PICK_COMBO&&PICK_COMBO.inp===inp) return; inp.value=''; };
        inp.addEventListener('keydown', e=>{
          if(e.key!=='Enter'&&e.key!==',') return;
          if(PICK_COMBO&&PICK_COMBO.inp===inp) return;
          e.preventDefault();
          e.stopPropagation();
          const keys=(opts[row.f]||fltCatalogBase(row.f)).map(it=>it.key);
          const picked=fltSanitizeValues(row.f, [String(inp.value||'').trim()], keys);
          if(picked.length){ fltPickValue(draft[i], picked[0], multi); inp.value=''; paint(i) }
        });
        return;
      }
      inp.addEventListener('keydown', e=>{
        if(e.key!=='Enter'&&e.key!==',') return;
        if(PICK_COMBO&&PICK_COMBO.inp===inp) return;
        e.preventDefault();
        e.stopPropagation();
        commitInput(inp, paint);
      });
      inp.onchange=()=>commitInput(inp, paint);
      inp.onblur=()=>{
        if(PICK_COMBO&&PICK_COMBO.inp===inp) return;
        commitInput(inp, ()=>{});
      };
    });
    draft.forEach(row=>{ if(row.f) loadOpts(row.f) });
    if(add) add.disabled=!fbCanAdd();
    if(focus!=null){const el=q(`[data-chip][data-i="${focus}"]`, m); if(el) el.focus()}
  };
  const add=q('#fb-add', m), reset=q('#fb-reset', m);
  if(add) add.onclick=()=>{draft.push({f:'', op:'eq', v:[]}); paint(draft.length-1)};
  if(reset) reset.onclick=()=>{draft.splice(0, draft.length); paint()};
  paint();
}
// ipMask hides the tail of an IPv4 address. keep is 2 for 1.2.*.* and 3 for 1.2.3.*.
// ip is the raw address. It returns '' when ip is not four decimal octets.
function ipMask(ip, keep){
  const p=String(ip||'').split('.');
  if(p.length!==4||p.some(x=>!/^\d+$/.test(x))) return '';
  const out=[];
  for(let i=0;i<4;i++) out.push(i<keep?p[i]:'*');
  return out.join('.');
}
// asnText prints an ASN with an AS prefix. v is the raw value. It returns '' for empty and zero.
function asnText(v){
  if(v==null||v===''||v===0||v==='0') return '';
  const s=String(v);
  return s.slice(0,2)==='AS'?s:'AS'+s;
}
// salePeriod is the gap from the click to the conversion.
// ts and click are ISO times. It returns '' when click is missing, otherwise a short duration.
function salePeriod(ts, click){
  if(!click) return '';
  const a=+new Date(ts), b=+new Date(click);
  if(!a||!b) return '';
  let s=Math.round((a-b)/1000);
  if(s<0) s=0;
  const d=Math.floor(s/86400);
  const h=Math.floor((s%86400)/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  if(d>0) return d+tr('d')+' '+h+tr('h');
  if(h>0) return m?h+tr('h')+' '+m+' '+tr('min'):h+tr('h');
  if(m>0) return m+' '+tr('min');
  return sec+' '+tr('s');
}

/** loadPostbacks reads one page of conversions and paints the table.
 * A failed read is repeated once without the sort, so a sort the server cannot apply neither blocks the page nor is dropped from the account.
 * @param {boolean} [unsorted] true to leave the sort out of this request
 * @returns {Promise<void>}
 */
async function loadPostbacks(unsorted){
  const wrap=q('#pb-wrap'); if(!wrap) return;
  wrap.innerHTML=stateHTML(tr('Loading…'));
  let r=null;
  try{
    r=await call('GET','/api/postbacks?'+pbQuery(unsorted));
  }catch(e){
    if(PB_SORT.k&&!unsorted){
      PB_PAGE_I=0;
      return loadPostbacks(true);
    }
    wrap.innerHTML=stateHTML(tr('conv.down'),'err');
    paintPbDock(null, null);
    return;
  }
  if(!q('#pb-wrap')) return;
  if(!r||!Array.isArray(r.rows)){
    wrap.innerHTML=stateHTML(tr('conv.down'),'err');
    paintPbDock(null, null);
    return;
  }
  const total=dockTotal(r, r.rows.length);
  const pages=Math.max(1, Math.ceil((total>0?total:0)/PB_PAGE)||1);
  if(PB_PAGE_I>=pages){PB_PAGE_I=pages-1; return loadPostbacks(unsorted)}
  PB_ROWS=r.rows.slice();
  const revTotal=typeof r.total==='number'?r.total:null;
  paintPbDock(r, revTotal);
  if(!PB_ROWS.length){wrap.innerHTML=`<div class="card">${stateHTML(tr('conv.empty'))}</div>`; return}
  const cols=loadCols('conv').filter(c=>c.on);
  const convFields=fieldsFor('conversions');
  const convMeta={text:new Set(['campaign','stream','country','device','status','original_status','prev_status','domain','cid','keyword','se','referer','page','site','via','timezone','bot','external_id','ad_campaign_id','creative_id','xrw']), date:new Set(['ts']), field:(id)=>logSortField('conversions', id, convFields)};
  const body=PB_ROWS.map(x=>`<tr>${cols.map(c=>`<td class="${cellClass(c.id)}">${convCell(x,c.id)}</td>`).join('')}</tr>`).join('');
  wrap.innerHTML=`<div class="tw"><table><thead><tr>${sortableHead('conv', PB_SORT, cols, convMeta)}</tr></thead><tbody>${body}</tbody></table></div>`;
  bindSort(wrap, PB_SORT, ()=>{PB_PAGE_I=0; loadPostbacks()});
}

/** cronFloor is the minimum schedule interval in minutes for one job.
 * @param {string} job job id
 * @returns {number} floor in minutes, at least 1
 */
function cronFloor(job){
  const f=CRONST&&CRONST.floors&&+CRONST.floors[job];
  return f>=1?f:1;
}
/** cronLagText formats catch-up lag in seconds for the automation card.
 * @param {number} sec lag in seconds
 * @returns {string} short phrase
 */
function cronLagText(sec){
  sec=Math.max(0, Math.round(+sec||0));
  if(sec<60) return sec+' s';
  if(sec<3600) return Math.floor(sec/60)+' min';
  return Math.floor(sec/3600)+' h';
}
/** cronIntervalMinutes reads the interval control and clamps it to the job floor.
 * @param {string} job job id
 * @returns {number} every_minutes
 */
function cronIntervalMinutes(job){
  const floor=cronFloor(job);
  const n=+q(`[data-iv="${job}"]`)?.value||1;
  const u=+q(`[data-ivu="${job}"]`)?.value||1;
  return Math.max(floor, Math.round(n*u)||floor);
}
/** cronApplyInterval writes every_minutes for one job and syncs the interval inputs to the floor.
 * @param {string} job job id
 * @returns {void}
 */
function cronApplyInterval(job){
  if(!CRON[job]) return;
  const mins=cronIntervalMinutes(job);
  CRON[job].every_minutes=mins;
  const floor=cronFloor(job);
  let m=mins, u=1;
  if(m&&m%1440===0){u=1440; m=m/1440}
  else if(m&&m%60===0){u=60; m=m/60}
  const n=q(`[data-iv="${job}"]`), sel=q(`[data-ivu="${job}"]`);
  if(n){ n.min=String(floor); n.value=String(Math.max(floor/u, m)||1) }
  if(sel) sel.value=String(u);
}

 * @param {object} st cron panel payload

function keitaroSyncState(st){

}

/** cronDropTarget finds the card whose centre is closest to the pointer.
 * @param {Element} jobsEl #jobs element
 * @param {number} x pointer clientX
 * @param {number} y pointer clientY
 * @param {Element|null} skip card being dragged
 * @returns {Element|null}
 */
function cronDropTarget(jobsEl, x, y, skip){
  let best=null, bestD=Infinity;
  qa('.job[data-cron-id]:not(.job-ph):not(.cron-drag)', jobsEl).forEach(el=>{
    if(el===skip) return;
    const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    const d=(cx-x)**2+(cy-y)**2;
    if(d<bestD){ bestD=d; best=el; }
  });
  return best;
}

/** bindCronArrange wires arrange mode and drag handles on the automation page.
 * @param {Element} root automation view root
 * @returns {void}
 */
function bindCronArrange(root){
  const btn=q('#cron-arrange', root), jobs=q('#jobs', root), reset=q('#cron-arrange-reset', root), hint=q('#cron-arrange-hint', root);
  if(!btn||!jobs) return;
  const syncBtn=()=>{
    const on=CRON_ARRANGING;
    btn.setAttribute('aria-pressed', on?'true':'false');
    const title=tr(on?'cron.arrange.done':'cron.arrange');
    btn.title=title;
    btn.setAttribute('aria-label', title);
    jobs.classList.toggle('arranging', on);
    if(hint) hint.hidden=!on;
    if(reset) reset.hidden=!on;
  };
  if(!btn.dataset.bound){
    btn.dataset.bound='1';
    btn.onclick=()=>{ CRON_ARRANGING=!CRON_ARRANGING; syncBtn(); };
    if(reset) reset.onclick=async()=>{ AUTOMATION_ORDER=cronDefaultIds().slice(); const ok=await flushPageViews(); if(ok) try{ localStorage.removeItem(CRON_ORDER_KEY); }catch(e){} paintAutomation(); };
    jobs.addEventListener('pointerdown', e=>{
      if(!CRON_ARRANGING) return;
      const grip=e.target.closest('.job-grip');
      if(!grip||e.button) return;
      const card=grip.closest('.job');
      if(!card||card.classList.contains('cron-drag')) return;
      e.preventDefault();
      try{ grip.setPointerCapture(e.pointerId); }catch(err){}
      const r=card.getBoundingClientRect(), ph=$('<div class="card job job-ph" aria-hidden="true"></div>');
      ph.style.height=r.height+'px';
      jobs.insertBefore(ph, card);
      const ox=e.clientX-r.left, oy=e.clientY-r.top;
      card.classList.add('cron-drag');
      card.style.width=r.width+'px';
      card.style.left=r.left+'px';
      card.style.top=r.top+'px';
      const place=ev=>{
        const t=cronDropTarget(jobs, ev.clientX, ev.clientY, card);
        if(!t) return;
        const r=t.getBoundingClientRect();
        const after=ev.clientY>r.top+r.height/2;
        const ref=after?t.nextElementSibling:t;
        if(ref===ph) return;
        if(ref) jobs.insertBefore(ph, ref); else jobs.appendChild(ph);
      };
      const move=ev=>{ card.style.left=(ev.clientX-ox)+'px'; card.style.top=(ev.clientY-oy)+'px'; place(ev); };
      const up=ev=>{
        try{ grip.releasePointerCapture(ev.pointerId); }catch(err){}
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
        card.classList.remove('cron-drag');
        card.style.position=card.style.left=card.style.top=card.style.width=card.style.zIndex=card.style.boxShadow='';
        jobs.insertBefore(card, ph);
        ph.remove();
        cronOrderSave(cronOrderFromDOM(jobs));
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    });
  }
  syncBtn();
}

/* ---------- SETTINGS ---------- */
/** tzCanon maps a zone id through TZ_ALIAS when Intl accepts the target.
 * A canonical id Intl rejects is mapped back to the legacy key. Storage is not written.
 * @param {string} z zone id from the browser or from storage.
 * @return {string} a supported zone id, or z when it needs no change. */
function tzCanon(z){
  if(z&&TZ_ALIAS[z]) return TZ_ALIAS_OK[TZ_ALIAS[z]]?TZ_ALIAS[z]:z;
  if(z) for(const k in TZ_ALIAS) if(TZ_ALIAS[k]===z&&!TZ_ALIAS_OK[z]) return k;
  return z;
}
function tzOffsetHours(z){
  if(!z||z==='UTC') return 0;
  const read=zone=>{
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'shortOffset'}).formatToParts(new Date());
    const raw=((parts.find(p=>p.type==='timeZoneName')||{}).value||'').replace(/^GMT/,'');
    if(raw===''||raw==='UTC') return 0;
    const m=/^([+-])(\d{1,2})(?::(\d{2}))?$/.exec(raw);
    if(!m) return null;
    const h=+m[2]+(m[3]?+m[3]/60:0);
    return m[1]==='-'?-h:h;
  };
  try{return read(z)}catch(e){
    if(z==='Europe/Kyiv'){try{return read('Europe/Kiev')}catch(e2){return null}}
    return null;
  }
}
function tzOptions(filter){
  let all=['UTC'];
  try{all=Intl.supportedValuesOf('timeZone')}catch(e){}
  const cur=uiTz();
  const rows=[];
  const seen=new Set();
  for(const z of all){
    if(z==='Europe/Moscow') continue;
    const canon=tzCanon(z);
    if(seen.has(canon)) continue;
    seen.add(canon);
    const h=tzOffsetHours(canon);
    if(h==null||h<-11||h>11) continue;
    rows.push({z:canon, raw:z, h});
  }
  if(TZ_ALIAS_OK['Europe/Kyiv']&&!rows.some(r=>r.z==='Europe/Kyiv')){
    const h=tzOffsetHours('Europe/Kyiv');
    if(h!=null) rows.push({z:'Europe/Kyiv', raw:'Europe/Kiev', h});
  }
  if(cur&&!rows.some(r=>r.z===cur)) rows.push({z:cur, raw:cur, h:tzOffsetHours(cur)||0});
  rows.sort((a,b)=>a.h-b.h||String(a.z).localeCompare(b.z));
  const f=String(filter||'').toLowerCase();
  const has=s=>String(s||'').toLowerCase().includes(f);
  const out=rows.filter(r=>{
    if(!f) return true;
    if(has(r.z)||has(tzLabel(r.z))||has(r.raw)) return true;
    return Object.keys(TZ_ALIAS).some(k=>TZ_ALIAS[k]===r.z&&has(k));
  }).map(r=>r.z);
  if(cur&&out.indexOf(cur)<0) out.unshift(cur);
  return out;
}
function tzLabel(z){
  if(!z) return '';
  if(z==='UTC') return 'UTC · UTC+0';
  try{
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:z,timeZoneName:'shortOffset'}).formatToParts(new Date());
    const off=(parts.find(p=>p.type==='timeZoneName')||{}).value||'';
    if(off) return z+' · '+off.replace(/^GMT/,'UTC');
  }catch(e){}
  return z;
}
// bindTzPick opens one zone list from tzOptions. Letters typed while the list
// is open accumulate in a buffer that filters the list. The buffer clears
// after 3 seconds without keys and when the list closes. onPick(zone) is the
// only write; the buffer is not stored.
function bindTzPick(btn, list, getZone, onPick){
  let buf='', timer=null, open=false;
  const label=()=>{if(btn.isConnected) btn.textContent=tzLabel(getZone())};
  const paint=()=>{
    label();
    if(!list) return;
    const cur=getZone();
    list.innerHTML=tzOptions(buf).map(z=>`<button type="button" data-tz="${esc(z)}" class="${z===cur?'on':''}">${esc(tzLabel(z))}</button>`).join('');
    qa('[data-tz]', list).forEach(b=>b.onclick=ev=>{
      ev.stopPropagation();
      const z=b.dataset.tz;
      shut();
      onPick(z);
      label();
    });
  };
  const shut=()=>{
    open=false;
    buf='';
    if(timer){clearTimeout(timer); timer=null}
    if(list) list.hidden=true;
    document.removeEventListener('keydown', onKey, true);
    document.removeEventListener('click', onDoc, true);
  };
  const arm=()=>{
    if(timer) clearTimeout(timer);
    timer=setTimeout(()=>{buf=''; if(open) paint()}, 3000);
  };
  const onKey=(e)=>{
    if(!open) return;
    if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){shut(); return}
    if(e.key==='Escape'){e.stopPropagation(); e.preventDefault(); shut(); return}
    if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1) return;
    buf+=e.key;
    arm();
    paint();
    e.preventDefault();
    e.stopPropagation();
  };
  const onDoc=(e)=>{
    if(!open) return;
    if(e.target===btn||btn.contains(e.target)||(list&&list.contains(e.target))) return;
    shut();
  };
  btn.onclick=ev=>{
    ev.stopPropagation();
    if(open){shut(); return}
    open=true;
    list.hidden=false;
    paint();
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('click', onDoc, true);
  };
  label();
  return {close:shut};
}

// showKeyOnce shows the new secret in a dialog and does not keep it afterwards.
// raw is the key from POST /api/api-keys. It returns nothing. Closing drops the text.
function showKeyOnce(raw){
  const sc=$('<div class="scrim" style="z-index:82"></div>');
  const m=$(`<div class="modal" role="dialog" style="z-index:83;width:min(640px,92vw)"><h3>${esc(tr('key.once.title'))}</h3>
    <p class="hint">${esc(tr('key.once.warn'))}</p>
    <p><code id="key-once">${esc(raw)}</code></p>
    <div class="row"><div class="spacer"></div><button type="button" class="primary" id="key-copy">${esc(tr('key.copy'))}</button><button type="button" data-no>${esc(tr('key.close'))}</button></div></div>`);
  const done=()=>{sc.remove(); m.remove(); document.removeEventListener('keydown', onKey, true)};
  const onKey=(e)=>{if(e.key==='Escape'){e.stopPropagation(); done()}};
  sc.onclick=done;
  q('[data-no]', m).onclick=done;
  q('#key-copy', m).onclick=()=>{
    const el=q('#key-once', m);
    const text=el?(el.textContent||''):'';
    const select=()=>{
      if(!el) return;
      const range=document.createRange();
      range.selectNodeContents(el);
      const sel=window.getSelection();
      if(!sel) return;
      sel.removeAllRanges();
      sel.addRange(range);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast(tr('pb.copy'))).catch(select);
    else select();
  };
  document.addEventListener('keydown', onKey, true);
  document.body.append(sc, m);
}

  const resBlocks=USER_ACCESS_RESOURCES.map(res=>{

      const catLabels=accessEntityLabels(rows);
      const labels=catLabels.concat(g.labels.filter(l=>!catLabels.includes(l)));

      <div class="fld"><label>${esc(tr('acc.mode'))}</label><select data-amode="${esc(res)}">${modeOpts}</select></div>${lists}</div>`;

  const hid=Array.isArray(acc.hidden)?acc.hidden:[];
  const hidHtml=`<div class="togs">${hideChoices(FIELDS&&FIELDS.fields, hid).map(n=>`<label class="tog"><input type="checkbox" data-ahid="${esc(n)}"${hid.includes(n)?' checked':''}>${esc(hideLabel(n))}</label>`).join('')}</div>`;
  return `<div class="lbl">${esc(tr('acc.sections'))}</div>${secHtml}${resBlocks}<div class="lbl">${esc(tr('acc.hidden'))}</div>${hidHtml}`;
}
/** readAccessEditor reads the blocks of accessEditorHTML.
 * @param {Element} box dialog root
 * @param {boolean} [forRole] true when the editor was built for a role
 * @returns {{sections:string[],grants:object,hidden:string[]}} access for PUT /api/users/{id}/access or a role body
 */
function readAccessEditor(box, forRole){
  const sections=[];
  qa('[data-asec]', box).forEach(el=>{if(el.checked) sections.push(el.dataset.asec)});
  const rows={};
  USER_ACCESS_RESOURCES.forEach(res=>{
    const sel=q('[data-amode="'+res+'"]', box);
    const ids=[], labels=[];
    qa('[data-ent="'+res+'"]', box).forEach(el=>{if(el.checked) ids.push(el.dataset.id)});
    qa('[data-lab="'+res+'"]', box).forEach(el=>{if(el.checked) labels.push(el.dataset.label)});
    rows[res]={mode:sel?sel.value:'', ids, labels};
  });
  const grants=grantsFromRows(rows, !!forRole);
  const hidden=[];
  qa('[data-ahid]', box).forEach(el=>{if(el.checked) hidden.push(el.dataset.ahid)});
  return {sections, grants, hidden};
}
/** bindAccessEditor widens the dialog and shows the record lists of a resource only for the selected and created modes.
 * @param {Element|null} el the formModal element
 * @returns {void}
 */
function bindAccessEditor(el){
  if(!el) return;
  el.style.width='min(920px,96vw)';
  qa('[data-amode]', el).forEach(sel=>sel.onchange=()=>{
    const box=q('[data-agrants="'+sel.dataset.amode+'"]', el);
    if(box) box.hidden=sel.value!=='selected'&&sel.value!=='created';
  });
}
/** openUserAccess edits sections, grants and hidden metrics for a USER account without a role.
 * @param {object} u user row
 * @returns {Promise<void>}
 */
async function openUserAccess(u){
  if(u.role_id){ toast(tr('err.user.role'), true); return; }

  try{
    lists=await Promise.all([

      call('GET','/api/offers'),
      call('GET','/api/landings'),
      call('GET','/api/traffic-sources'),
      call('GET','/api/affiliate-networks'),
      call('GET','/api/domains'),
    ]);
  }catch(e){toast(e.message,true); return}
  const [groups, offers, landings, sources, networks, domains]=lists.map(x=>Array.isArray(x)?x:[]);
  const catalog={campaigns:groups, offers, landings, sources, networks, domains};
  const acc=u.access&&typeof u.access==='object'?u.access:{sections:[],grants:{},hidden:[]};
  formModal(tr('acc.title')+' · '+(u.login||''), accessEditorHTML(acc,{catalog}), async box=>{

  });
  bindAccessEditor(FORM&&FORM.el);
}
/** openRoleEditor creates a role or edits one: name, sections, resource modes and hidden fields.

 */

/** deleteRole removes a role after confirmation; the server refuses a role that users still have.

/** roleHiddenText lists the hidden fields of a role.

 */
function roleHiddenText(r){

/** paintRolesTable draws the roles of GET /api/roles into #roles-table.
 * @param {Array|null} rows roles, null when they are unavailable
 * @param {string} err translated reason shown instead of the table when rows is null
 * @returns {void}
 */
function paintRolesTable(rows, err){
  const box=q('#roles-table'); if(!box) return;
  if(rows===null){ box.innerHTML=stateHTML(err||tr('ui.fail'),'err'); return; }
  if(!rows.length){ box.innerHTML=`<div class="card">${stateHTML(tr('roles.empty'))}</div>`; return; }
  let list=rows.slice();
  const roleMeta={text:['name','sections','hidden'], name:['name']};
  if(ROLE_SORT.k) list=applySort(list, ROLE_SORT, (r,k)=>{
    if(k==='name') return r&&r.name;
    if(k==='sections') return roleSectionsText(r);
    if(k==='hidden') return roleHiddenText(r);
    if(k==='users') return +(r&&r.users)||0;
    return '';
  }, roleMeta);
  const body=list.map(r=>`<tr><td>${esc(r.name||'')}</td><td>${esc(roleSectionsText(r))}</td><td>${esc(roleHiddenText(r))}</td><td class="num">${fmt(r.users||0)}</td>
    <td class="acts"><button type="button" class="icon sm ghost" data-redit="${esc(r.id)}" title="${esc(tr('roles.edit'))}">${icon('edit')}</button><button type="button" class="icon sm ghost" data-rdel="${esc(r.id)}" title="${esc(tr('roles.delete'))}">${icon('trash')}</button></td></tr>`).join('');
  const roleCols=[{id:'name',label:'roles.name',on:1},{id:'sections',label:'roles.sections',on:1},{id:'hidden',label:'roles.hidden',on:1},{id:'users',label:'roles.users',on:1}];
  box.innerHTML=`<div class="tw"><table><thead><tr>${sortableHead('', ROLE_SORT, roleCols, roleMeta)}<th class="acts"></th></tr></thead><tbody>${body}</tbody></table></div>`;
  bindSort(box, ROLE_SORT, ()=>paintRolesTable(rows, err));
  const find=id=>rows.find(x=>String(x.id)===id);
  qa('[data-redit]', box).forEach(b=>b.onclick=()=>{const r=find(b.dataset.redit); if(r) openRoleEditor(r)});
  qa('[data-rdel]', box).forEach(b=>b.onclick=()=>{const r=find(b.dataset.rdel); if(r) deleteRole(r)});
}

    saveNav({order:NAV.map(pair=>pair[0]), hidden:{}});

  };

}

// openPostbacks copies the lead and sale URLs of this tracker. The lead URL
// has no payout. enginePostback stays as it is for network templates.
function openPostbacks(){

    async()=>{copyText('lead: '+lead+'\nsale: '+sale)}, tr('pb.copyall'));
  q('#pb-pop-lead',m).onclick=e=>{e.stopPropagation(); copyText(lead, e.currentTarget)};
  q('#pb-pop-sale',m).onclick=e=>{e.stopPropagation(); copyText(sale, e.currentTarget)};
}
function enginePostback(status){
  return postbackOrigin()+'/postback?subid={subid}&status='+(status||'{status}')+'&payout={payout}';
}
const NET_TEMPLATES=[
  {id:'s2s',label:'Generic S2S',url:'',query:'sub1={subid}'},
  {id:'click',label:'clickid, goal, sum',url:'https://example.com/postback?clickid={subid}&goal={status}&sum={payout}',query:''}
];
let LAND_SORT={k:'',dir:-1};
// Same extension set as server landingTextExt (GET/PUT /api/landings/{id}/files).
const LAND_TEXT=new Set(['html','htm','php','css','js','txt','json','xml','svg']);
// landingKind is the catalog label for how a landing is served.
// row is a landing record. It returns URL, PHP or HTML.
function landingKind(row){
  if(!row||!row.local) return 'URL';
  return /\.php$/i.test(String(row.entry||''))?'PHP':'HTML';
}
// landingText reports whether a landing file opens in the text editor.
// path is the relative path from the file list. It returns true for a known text extension.
function landingText(path){
  const name=String(path||'').split('/').pop().toLowerCase();
  const dot=name.lastIndexOf('.');
  if(dot<0) return false;
  return LAND_TEXT.has(name.slice(dot+1));
}
// landingFileURL builds the API path of one file inside a landing.
// id is the landing id. path is the relative file path. It returns the encoded path.
function landingFileURL(id, path){
  const parts=String(path||'').split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return '/api/landings/'+encodeURIComponent(id)+'/files/'+parts;
}
// landingSortValue is the key one landing column sorts by.
// row is the landing. k is the column id. files is the file count.
// It returns a string for text columns and a number otherwise.
function landingSortValue(row, k, files){
  if(k==='id') return row&&row.id!=null?row.id:'';
  if(k==='name') return (row&&row.name)||'';
  if(k==='group') return (row&&row.group)||'';
  if(k==='kind') return landingKind(row);
  if(k==='state') return tr(row&&row.status?'On':'Off');
  if(k==='files') return files||0;
  return 0;
}
function landingRowHTML(row, files){
  return loadCols('landings').filter(c=>c.on).map(c=>{
    if(c.id==='id') return `<td class="num">${esc(row.id)}</td>`;
    if(c.id==='name') return `<td>${esc(row.name||'')}</td>`;
    if(c.id==='group') return `<td>${esc(row.group||'')}</td>`;
    if(c.id==='kind') return `<td>${esc(landingKind(row))}</td>`;
    if(c.id==='state') return `<td>${esc(tr(row.status?'On':'Off'))}</td>`;
    if(c.id==='files') return `<td class="num">${fmt(files||0)}</td>`;
    return '<td></td>';
  }).join('');
}
// landingFileRead loads one landing file as text.
// id is the landing id. path is the relative path.
// It returns the text. A JSON body with content uses that field.
// A 401 opens the login screen and throws. Any other failure throws Error with status.
async function landingFileRead(id, path){
  const r=await fetch(landingFileURL(id, path),{method:'GET',credentials:'same-origin'});
  if(r.status===401){loginView(); throw new Error('session expired')}
  const raw=await r.text();
  let msg=raw;
  try{
    const j=JSON.parse(raw);
    if(j&&j.error) msg=String(j.error);
    if(r.ok&&j&&typeof j.content==='string') return j.content;
  }catch(e){}
  if(!r.ok){const e=new Error(msg||('HTTP '+r.status)); e.status=r.status; throw e}
  return raw;
}
// openLandingFile edits one text file of a local landing. The path stays the file name.
// id is the landing id. path is the relative path. A missing file stays editable.
// A load error other than 404 is toasted and saving stays off. It does not return a value.
async function openLandingFile(id, path){
  const sc=$('<div class="scrim" style="z-index:80"></div>');
  const m=$(`<div class="modal" role="dialog" style="width:min(1100px,96vw);max-height:min(92vh,980px);overflow:auto;z-index:81"><h3>${esc(path)}</h3>
    <p class="hint" id="lf-miss" hidden>${esc(tr('page.missing'))}</p>
    <textarea id="lf-body" class="code" spellcheck="false" style="min-height:60vh"></textarea>
    <div class="row"><div class="spacer"></div><button type="button" data-no>${tr('Cancel')}</button><button type="button" class="primary" data-yes disabled>${tr('Save')}</button></div></div>`);
  let ed=null;
  const close=()=>{if(ed) ed.destroy(); sc.remove();m.remove();document.removeEventListener('keydown',key,true)};
  const key=(e)=>{
    if(!m.isConnected) return;
    if(e.key==='Escape'){if(ed&&ed.popupOpen()) return; e.stopPropagation();e.preventDefault();close()}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.stopPropagation();e.preventDefault();const b=q('[data-yes]',m); if(b&&!b.disabled) b.click()}
  };
  sc.onclick=close;
  q('[data-no]',m).onclick=close;
  q('[data-yes]',m).onclick=async()=>{
    const save=q('[data-yes]',m);
    if(!save||save.disabled) return;
    save.disabled=true;
    try{
      await callRaw('PUT', landingFileURL(id, path), ed?ed.value:(q('#lf-body',m)||{}).value, 'text/plain; charset=utf-8');
      toast(tr('Saved'));
      close();
    }catch(err){save.disabled=false; toast(err.message,true)}
  };
  document.addEventListener('keydown',key,true);
  document.body.append(sc,m);
  const ta=q('#lf-body',m);
  const edReady=codeEditor(ta,path).then(e=>{if(!m.isConnected){e.destroy();return null} ed=e; return e});
  try{
    const text=await landingFileRead(id, path);
    if(!m.isConnected) return;
    const e=await edReady;
    if(e) e.value=text||'';
  }catch(err){
    if(!m.isConnected) return;
    if(err.status===404){const miss=q('#lf-miss',m); if(miss) miss.hidden=false}
    else{toast(err.message,true); return}
  }
  const save=q('[data-yes]',m);
  if(save) save.disabled=false;
  const e=await edReady;
  if(e) e.focus();
}

/** registerDomainModal opens the purchase window: availability check, price confirmation and the buy request.

    <div class="fld"><label for="nr-reg">${tr('nc.reg.registrar')}</label><select id="nr-reg"><option value="namecheap">${esc('Namecheap'+acctName)}</option></select></div>
    <div class="fld"><label for="nr-domain">${tr('nc.reg.domain')}</label><div class="row" style="gap:6px;align-items:stretch"><input id="nr-domain" class="mono" style="flex:1" placeholder="example.com" autocomplete="off" spellcheck="false"><button type="button" id="nr-check"${ready?'':' disabled'}>${tr('nc.reg.check')}</button></div></div>

      <div class="fld"><label for="nr-group">${tr('off.group')}</label><select id="nr-group">${groups}</select></div></div>
    ${cfOn?`<label class="tog"><input type="checkbox" id="nr-cf" checked> <span>${esc(trFill('cf.reg.use',{ip:cf.public_ip}))}</span></label>`:''}
    <div class="fld" id="nr-ns-box"${cfOn?' hidden':''}><label for="nr-ns">${tr('nc.ns.label')}</label><textarea id="nr-ns" rows="3" class="mono" placeholder="ns1.example.com&#10;ns2.example.com" spellcheck="false"></textarea><div class="hint">${tr('nc.reg.nshint')}</div></div>

    if(!q('#nr-confirm',box).checked) throw new Error(tr('nc.reg.needconfirm'));
    const body={domain:st.domain, years:term, max_price:total, group:q('#nr-group',box).value.trim()};

        st.price=o.price/term;
        q('#nr-confirm',box).checked=false;
        sync();
        throw new Error(trFill('nc.reg.pricechanged',{price:moneyText(o.price,'USD',2), years:term}));
      }
      if(o.kind==='pending'||o.kind==='early'||o.kind==='released'||o.kind==='owned'){
        toast(domainOutcomeText(e), true);
        await ensureDomains();
        return;
      }
      throw new Error(domainOutcomeText(e));
    }
    toast(res&&res.ns_error?tr('nc.reg.done')+'. '+tr('nc.reg.nserr')+': '+res.ns_error:tr('nc.reg.done'), !!(res&&res.ns_error));
    if(res&&res.over_max_price) toast(trFill('nc.reg.over',{charged:moneyText(res.charged,'USD',2), expected:moneyText(res.expected,'USD',2)}), true);

  if(cfBox) cfBox.onchange=()=>{q('#nr-ns-box',m).hidden=cfBox.checked};
  const info=(text,bad)=>{const p=q('#nr-info',m); p.hidden=!text; p.textContent=text||''; p.classList.toggle('err',!!bad)};
  const sync=()=>{
    const term=+q('#nr-years',m).value;
    const total=ncTotal(st.price, term);
    const box=q('#nr-confirm',m);
    box.disabled=!(total>0);
    if(box.disabled) box.checked=false;

  };

  let seq=0;

  q('#nr-domain',m).oninput=reset;
  q('#nr-years',m).onchange=()=>{q('#nr-confirm',m).checked=false; sync()};
  q('#nr-check',m).onclick=async()=>{
    const btn=q('#nr-check',m);
    const name=q('#nr-domain',m).value.trim().toLowerCase();
    if(!name||btn.disabled) return;
    reset();
    const mine=seq;
    btn.disabled=true;
    const stale=()=>mine!==seq||q('#nr-domain',m).value.trim().toLowerCase()!==name;
    try{
      const r=await call('POST','/api/registrars/namecheap/check',{domains:[name]});
      if(stale()) return;
      const row=((r&&r.results)||[])[0];
      if(!row) info(tr('nc.reg.noanswer'),true);
      else if(!row.available) info(row.error?tr('nc.reg.taken')+': '+row.error:tr('nc.reg.taken'),true);
      else if(row.premium) info(tr('nc.err.premium'),true);

      else{

        info(trFill('nc.reg.price',{domain:st.domain, price:moneyText(+row.price,'USD',2)}),false);
      }
      sync();
    }catch(e){
      if(stale()) return;
      info(domainOutcomeText(e),true); sync();
    }finally{
      if(!stale()) btn.disabled=!ready;
    }
  };
  sync();
}

let REPORT_ROWS=[];

let REPORT_CUT=false;
let REP={conds:[]}, REP_HOLD=false;
// reportQS is the report query: the period plus the active conditions.
// It returns a query string without a leading question mark.
function reportQS(){
  const qs=new URLSearchParams(rangeQS());
  condsQS(REP.conds).forEach((v,k)=>qs.append(k,v));
  qs.set('meta','1');
  return qs.toString();
}
// setReport stores the rows of an /api/report?meta=1 answer and whether the server cut them.
// body is the parsed answer; an older server's bare array is accepted.
function setReport(body){
  const d=reportData(body);
  REPORT_ROWS=d.rows;
  REPORT_CUT=d.truncated;
}
async function report(_,live){
  const hold=REP_HOLD; REP_HOLD=false;
  const [body]=await Promise.all([get('/api/report?'+reportQS(),null), ensureCatalogs()]);
  if(!live()) return;
  setReport(body);
  paintReport(live);
}

function reportCellText(r, id, machine){
  if(!r) return '';
  if(id==='hits'||id==='bots'||id==='conv') return machine?csvNum(r[id]):fmt(r[id]);
  if(id==='uniq') return machine?csvNum(r.unique):fmt(r.unique);
  if(id==='cr') return cellRatio(r.conv, r.hits);
  if(id==='profit') return machine?csvMoney(r.profit):moneyText(r.profit||0, 'USD', 2);
  if(id==='device') return deviceLabel(r.device);
  if(id==='offer') return idLabel('offer_id', r.offer);
  if(id==='source') return idLabel('source_id', r.source);
  if(id==='country') return countryLabel(r.country, uiLang());
  const raw={group:r.group,stream:r.stream}[id];
  return raw==null?'':String(raw);
}
/** reportTotalCells is the total row of the report: sums of the shown count and money columns, the ratio from those sums, and the label in the first text column.
 * @param {object[]} rows report rows
 * @param {{id:string}[]} cols shown columns
 * @param {boolean} machine true for CSV: plain numbers
 * @param {boolean} cut true when the server cut the rows at its limit: the sums would be partial, so there is no total row
 * @returns {string[]} one unescaped text per column; empty when there are no rows or they are cut
 */
function reportTotalCells(rows, cols, machine, cut){
  if(cut||!rows.length) return [];
  const total=reportTotals(rows);
  const calc=new Set(['hits','uniq','bots','conv','profit','cr']);
  let label=true;
  return cols.map(c=>{
    if(calc.has(c.id)) return reportCellText(total, c.id, machine);
    if(!label) return '';
    label=false;
    return tr('flows.sum');
  });
}
/** reportSortValue is the key one report column sorts by.
 * @param {object} r report row
 * @param {string} k column id
 * @returns {number|string} sort key
 */
function reportSortValue(r, k){
  if(!r) return '';
  if(k==='hits'||k==='bots'||k==='conv') return +r[k]||0;
  if(k==='uniq') return +r.unique||0;
  if(k==='cr') return (+r.conv||0)/((+r.hits||0)||1);
  if(k==='profit') return +r.profit||0;
  if(k==='device') return deviceLabel(r.device);
  if(k==='offer') return idLabel('offer_id', r.offer);
  if(k==='source') return idLabel('source_id', r.source);
  if(k==='country') return countryLabel(r.country, uiLang());
  const raw={group:r.group,stream:r.stream}[k];
  return raw==null?'':String(raw);
}
function paintReport(live){
  let rows=REPORT_ROWS||[];
  const cols=loadCols('report').filter(c=>c.on);
  const repMeta={text:['group','stream','country','device','offer','source'], name:['group','offer']};
  if(REP_SORT.k) rows=applySort(rows, REP_SORT, reportSortValue, repMeta);
  const num=new Set(['hits','uniq','bots','conv','profit','cr']);
  const cell=(r,id)=>esc(reportCellText(r,id));
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td class="${num.has(c.id)?'num':''}">${cell(r,c.id)}</td>`).join('')}</tr>`).join('');
  const cut=!!REPORT_CUT;
  const totals=reportTotalCells(rows,cols,false,cut);
  const cutNote=cut?`<p class="hint err" id="rep-cut">${esc(tr('rep.cut'))}</p>`:'';
  const foot=totals.length?`<tfoot><tr>${cols.map((c,i)=>`<td class="${num.has(c.id)?'num':''}">${esc(totals[i])}</td>`).join('')}</tr></tfoot>`:'';
  view().innerHTML=`<div class="ph"><h1>${tr('rep.title')}</h1><span class="sub">${periodLabel()}</span><div class="spacer"></div>${colTools('report')}</div>
    <div class="toolbar"><div class="lft"><button type="button" class="primary" id="rep-filters"></button></div><div class="rgt"><button type="button" class="icon" id="rep-export" aria-haspopup="menu" title="${tr('Export')}" aria-label="${tr('Export')}">${icon('download')}</button><button type="button" class="icon" id="rep-refresh" data-col-refresh="report" title="${tr('Refresh')}" aria-label="${tr('Refresh')}">${icon('refresh')}</button></div></div>
    <div class="chips" id="rep-chips"></div>
    ${cutNote}
    <div class="tw"><table><thead><tr>${sortableHead('report', REP_SORT, cols, repMeta)}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}">${tr('rep.empty')}</td></tr>`}</tbody>${foot}</table></div>`;
  bindSort(view(), REP_SORT, ()=>paintReport(live));
  const reloadRep=async()=>{
    const next=await get('/api/report?'+reportQS(),null);
    if(live&&!live()) return;
    setReport(next);
    paintReport(live);
    touchPageViews();
  };
  paintFilterBar('events', q('#rep-filters'), q('#rep-chips'), REP.conds, reloadRep);
  q('#rep-filters').onclick=()=>filterBuilder('events', REP.conds, ()=>{REP_HOLD=true});
  bindColTools(view(),'report',reloadRep,()=>{if(!live||live()) paintReport(live)});
  q('#rep-export').onclick=e=>{e.stopPropagation(); if(MENU){closeMenu();return} menu(e.currentTarget,[{label:tr('rep.csv'),on:()=>{
    const exp=REP_SORT.k?applySort(REPORT_ROWS||[], REP_SORT, reportSortValue, repMeta):rows;
    download('report.csv', csvTable(cols.map(c=>tr(c.label)+(c.id==='profit'?', '+curSign('USD'):'')), exp.map(r=>cols.map(c=>reportCellText(r,c.id,true))).concat(totals.length?[reportTotalCells(rows,cols,true,cut)]:[])), 'text/csv');
  }},{label:tr('Export HTML'),on:()=>{
    const exp=REP_SORT.k?applySort(REPORT_ROWS||[], REP_SORT, reportSortValue, repMeta):rows;
    downloadHTML(tr('rep.title'), cols.map(c=>tr(c.label)), exp.map(r=>cols.map(c=>reportCellText(r,c.id))).concat(totals.length?[totals]:[]));
  }}], 'end')};
}

  const show=(text,bad)=>{const p=q('#cf-status',host); p.hidden=!text; p.textContent=text||''; p.classList.toggle('err',!!bad)};
  const body=()=>({token:q('#cf-token',host).value.trim(), account_id:val('cf-account')});
  q('#cf-test',host).onclick=async e=>{
    const btn=e.currentTarget;
    show('',false);
    btn.disabled=true;
    try{
      const r=await call('POST','/api/cloudflare/test',body());
      if(r&&r.ok) show(trFill('cf.test.ok',{n:r.zones}),false);
      else show((r&&r.error)||tr('cf.test.fail'),true);
    }catch(err){show(errText(err),true)}
    finally{btn.disabled=false}
  };
  q('#cf-save',host).onclick=async e=>{

      toast(tr('Saved'));
      await cloudflarePanel(host,live);
    }catch(err){show(errText(err),true); btn.disabled=false}
  };
}

  };
