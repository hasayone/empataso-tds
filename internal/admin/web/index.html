// Wires: the trunk from the entry down to the default, a branch into every
// stream, a ribbon from each stream to its destination. Widths follow the
// traffic of the period; with a simulation on screen its path is drawn on top.
function drawWires(){
  const cv=q('#canvas'), svg=q('#wires'); if(!cv||!svg||!CUR)return;
  const R=cv.getBoundingClientRect();
  const box=(el)=>{const r=el.getBoundingClientRect();return {l:r.left-R.left,r:r.right-R.left,y:(r.top+r.bottom)/2-R.top,b:r.bottom-R.top}};
  const g=CUR, total=perfOf(g,null).hits;
  const w=(n)=>total&&n?Math.max(2,Math.min(14,2+12*n/total)):2;
  const entry=q('#entry',cv), fbn=q('#fbnode',cv), fbd=q('#fbdest',cv); if(!entry||!fbn)return;
  const E=box(entry), X=E.l+22, parts=[], top=[];
  const line=(d,width,cls,extra)=>`<path d="${d}" fill="none" stroke="var(${cls})" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${extra||''}/>`;
  const arrow=(x,y,cls)=>`<path d="M${x-7},${y-5} L${x},${y} L${x-7},${y+5}" fill="none" stroke="var(${cls})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const elbow=(y,toX)=>`M${X},${y-14} Q${X},${y} ${X+14},${y} L${toX},${y}`;
  const step=SIM&&SIM.path&&SIM.path[0];
  const winner=step?(step.selected==='-'?'fb':step.streams.findIndex(x=>x.on&&x.match)):null;
  const kind=(n)=>n?'--wire':'--wire-idle';

  let rem=total, prevY=E.b, reached=true; // reached: the simulated visitor is still on the trunk
  const rows=qa('.srow',cv).map(row=>({i:+row.dataset.s,n:box(q('.node',row)),d:box(q('.dest',row))})).sort((a,b)=>a.n.y-b.n.y);
  rows.forEach(({i,n,d})=>{
    const s=g.streams[i], hits=s.status?perfOf(g,s.name).hits:0, dashed=s.status?'':'stroke-dasharray="2 7"';
    parts.push(line(`M${X},${prevY} L${X},${n.y}`,w(rem),kind(rem)));
    if(step&&reached)top.push(line(`M${X},${prevY} L${X},${n.y-14}`,3,'--wire-ok'));
    // side: the destination sits beside the node (wide layout), not under it
    const side=d.l>n.r;
    parts.push(line(elbow(n.y,n.l),w(hits),kind(hits),dashed));
    if(side)parts.push(line(`M${n.r},${n.y} L${d.l-4},${n.y}`,w(hits),kind(hits),dashed),arrow(d.l-2,n.y,kind(hits)));
    if(step&&reached&&winner===i){
      top.push(line(elbow(n.y,n.l),3,'--wire-ok'));
      if(side)top.push(line(`M${n.r},${n.y} L${d.l-4},${n.y}`,3,'--wire-ok'),arrow(d.l-2,n.y,'--wire-ok'));
      reached=false;
    }
    if(step&&reached)top.push(line(`M${X},${n.y-14} L${X},${n.y}`,3,'--wire-ok'));
    rem=Math.max(0,rem-hits); prevY=n.y;
  });
  const F=box(fbn), D=box(fbd), fb=perfOf(g,'-').hits;
  const fside=D.l>F.r;
  parts.push(line(`M${X},${prevY} L${X},${F.y-14}`,w(rem),kind(rem)),line(elbow(F.y,F.l),w(fb),kind(fb)));
  if(fside)parts.push(line(`M${F.r},${F.y} L${D.l-4},${F.y}`,w(fb),kind(fb)),arrow(D.l-2,F.y,kind(fb)));
  if(step&&reached){
    top.push(line(`M${X},${prevY} L${X},${F.y-14}`,3,'--wire-ok'),line(elbow(F.y,F.l),3,'--wire-ok'));
    if(fside)top.push(line(`M${F.r},${F.y} L${D.l-4},${F.y}`,3,'--wire-ok'),arrow(D.l-2,F.y,'--wire-ok'));
  }
  svg.innerHTML=parts.join('')+top.join('');
}
/**
 * bindSort wires column headers or a stream grip.
 * With onChange, data-sort buttons update state: the active column flips, a numeric th starts descending, a text th starts ascending, then onChange runs.
 * Without onChange, the canvas grip drags a stream row and commits the order on release.
 * @param {Element} root table root, or the flow canvas
 * @param {object} state sort state {k, dir}, or the campaign group
 * @param {function} [onChange] repaint after a column click
 * @returns {void}
 */
function bindSort(root, state, onChange){
  if(typeof onChange==='function'){
    if(!root||!state) return;
    qa('[data-sort]', root).forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const k=b.dataset.sort;
      if(state.k===k) state.dir=-(state.dir||1);
      else {
        state.k=k;
        const th=b.closest('th');
        state.dir=th&&th.classList.contains('num')?-1:1;
      }
      onChange();
    });
    return;
  }
  const cv=root, g=state;
  cv.addEventListener('pointerdown',e=>{
    const grip=e.target.closest('[data-grip]'); if(!grip||e.button)return;
    const row=grip.closest('.srow'), rows=qa('.srow',cv), from=rows.indexOf(row);
    e.preventDefault(); closeMenu();
    const rects=rows.map(r=>r.getBoundingClientRect());
    const gap=rows.length>1?rects[1].top-rects[0].bottom:22, size=rects[from].height+gap, y0=e.clientY;
    let to=from, raf=0;
    rows.forEach(r=>{if(r!==row)r.classList.add('moving')}); row.classList.add('dragging');
    const loop=()=>{drawWires();raf=requestAnimationFrame(loop)}; raf=requestAnimationFrame(loop);
    const move=ev=>{
      const dy=ev.clientY-y0, mid=rects[from].top+rects[from].height/2+dy;
      row.style.transform=`translateY(${dy}px)`; to=from;
      rows.forEach((r,i)=>{
        if(i===from)return;
        const c=rects[i].top+rects[i].height/2; let s=0;
        if(i>from&&mid>c){s=-size;to=Math.max(to,i)} else if(i<from&&mid<c){s=size;to=Math.min(to,i)}
        r.style.transform=s?`translateY(${s}px)`:'';
      });
    };
    const up=()=>{
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
      cancelAnimationFrame(raf);
      if(to!==from)moveStream(g,from,to);
      renderFlow();
    };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });
}
function moveStream(g,from,to){
  const a=g.streams; if(to<0||to>=a.length||to===from)return;
  const [m]=a.splice(from,1); a.splice(to,0,m); SIM=null; markDirty();
}

// ensureLandings loads the landing catalog once and keeps it for the stream editor and the canvas.
// refresh forces a new read. It returns the list. A failed read is an empty list.
async function ensureLandings(refresh){
  if(LANDINGS&&!refresh) return LANDINGS;

  LANDINGS=Array.isArray(list)?list:[];
  return LANDINGS;

// ensureCatalogs loads offers, networks, landings and sources once.
// A null left by a save or a group clear loads that list again.
// It returns nothing. A failed read becomes an empty list.
async function ensureCatalogs(){
  const jobs=[];
  if(!OFFERS) jobs.push(get('/api/offers',[]).then(v=>{if(!OFFERS) OFFERS=Array.isArray(v)?v:[]}));
  if(!NETS) jobs.push(get('/api/affiliate-networks',[]).then(v=>{if(!NETS) NETS=Array.isArray(v)?v:[]}));
  if(!LANDINGS) jobs.push(ensureLandings());
  if(!SOURCES) jobs.push(get('/api/traffic-sources',[]).then(v=>{if(!SOURCES) SOURCES=Array.isArray(v)?v:[]}));

function condRow(c,r,hit){

        const searching=c.m==='has'||(c.m==='dom'&&L.form==='alt');
        const notes=[c.hint,searching?(L.form==='alt'&&!L.flags.includes('i')?'letter case matters':'any letter case'):''].filter(Boolean).join(' · ');

    case 'schedule':{const d=(r.schedule&&r.schedule.days)||[];b=WEEK.map(i=>`<label class="tog"><input type="checkbox" class="schd" data-d="${i}" ${d[i]?'checked':''}>${DAYS[i]}</label>`).join('')+'<div class="hint">'+tr('the stream works on the checked days')+'</div>';break}

function resetCond(r,k){

// A list edited as chips: type and press Enter or a comma, or paste a list;

// Words stored as an expression without i are compared in their letter case:

const tagCS=(t)=>t.dataset.form==='alt'&&!(t.dataset.flags||'').includes('i');

const tagNew=(t)=>{

/** loadScript appends one script tag and resolves when it loads.
 * @param {string} src script URL
 * @returns {Promise<void>}
 */
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const el=document.createElement('script');
    el.src=src;
    el.onload=()=>resolve();
    el.onerror=()=>reject(new Error('load '+src));
    document.head.appendChild(el);
  });
}

 * @returns {Promise<object>} the global ace object
 */
function ensureAce(){
  if(typeof ace!=='undefined'&&ace.edit) return Promise.resolve(ace);
  if(ACE_LOAD) return ACE_LOAD;
  ACE_LOAD=(async()=>{
    await loadScript('/assets/ace/ace.js');
    await loadScript('/assets/ace/ext-language_tools.js');
    ace.config.set('basePath','/assets/ace');
    ace.require('ace/ext/language_tools');
    return ace;
  })();
  ACE_LOAD.catch(()=>{ACE_LOAD=null});
  return ACE_LOAD;
}

/** codeEditor replaces a textarea with Ace or keeps plain text when Ace fails to load.
 * @param {HTMLTextAreaElement} textarea host field
 * @param {string} path file name used for syntax mode
 * @returns {Promise<{value:string, focus:Function, destroy:Function, popupOpen:Function, setTheme:Function}>} editor facade
 */
async function codeEditor(textarea, path){
  const mode=codeMode(path);
  let editor=null, host=null, statusEl=null;
  const plain=()=>({
    get value(){return textarea?textarea.value:''},
    set value(v){if(textarea) textarea.value=v==null?'':String(v)},
    focus(){if(textarea) textarea.focus()},
    destroy(){},
    popupOpen(){return false},
    setTheme(){}
  });
  if(!textarea) return plain();
  try{await ensureAce()}catch(e){toast(tr('ed.noace'),true); return plain()}
  textarea.hidden=true;
  host=document.createElement('div');
  host.className='ace-host';
  statusEl=document.createElement('p');
  statusEl.className='hint ed-status';
  textarea.insertAdjacentElement('afterend',host);
  host.insertAdjacentElement('afterend',statusEl);
  const aceMode=mode==='text'?'ace/mode/text':'ace/mode/'+mode;
  editor=ace.edit(host,{
    mode:aceMode,
    theme:isDark()?'ace/theme/cloud_editor_dark':'ace/theme/cloud_editor',
    tabSize:2,
    useSoftTabs:true,
    showPrintMargin:false,
    enableBasicAutocompletion:true,
    enableLiveAutocompletion:true,
    fontSize:'12.5px'
  });
  editor.setValue(textarea.value,-1);
  const paintStatus=()=>{
    if(!statusEl) return;
    if(mode==='text'){statusEl.textContent=''; statusEl.classList.remove('bad'); return}
    const n=(editor.session.getAnnotations()||[]).filter(a=>a&&a.type==='error').length;
    if(!n){statusEl.textContent=tr('ed.clean'); statusEl.classList.remove('bad')}
    else{statusEl.textContent=tr('ed.errors').replace('{n}',String(n)); statusEl.classList.add('bad')}
  };
  editor.session.on('changeAnnotation',paintStatus);
  paintStatus();
  const wrap={
    get value(){return editor.getValue()},
    set value(v){editor.setValue(v==null?'':String(v),-1); paintStatus()},
    focus(){editor.focus()},
    destroy(){
      CODE_EDITORS.delete(wrap);
      if(editor){editor.destroy(); editor=null}
      if(host){host.remove(); host=null}
      if(statusEl){statusEl.remove(); statusEl=null}
      if(textarea){textarea.hidden=false}
    },
    popupOpen(){return !!(editor&&editor.completer&&editor.completer.popup&&editor.completer.popup.isOpen)},
    setTheme(){if(editor) editor.setTheme(isDark()?'ace/theme/cloud_editor_dark':'ace/theme/cloud_editor')}
  };
  CODE_EDITORS.add(wrap);
  return wrap;
}

// openStreamPage edits the HTML file named by an @page: output. The stream field keeps the reference.
// name is the file name. Returns nothing.
// A missing file (HTTP 404) stays editable so saving creates it; any other load error is toasted and saving stays off.
async function openStreamPage(name){
  const sc=$('<div class="scrim" style="z-index:74"></div>');
  const m=$(`<div class="modal" role="dialog" style="width:min(1100px,96vw);max-height:min(92vh,980px);overflow:auto"><h3>${esc(name)}</h3>
    <p class="hint" id="pg-miss" hidden>${esc(tr('page.missing'))}</p>
    <textarea id="pg-body" class="code" spellcheck="false" style="min-height:60vh"></textarea>
    <div class="row"><div class="spacer"></div><button type="button" data-no>${tr('Cancel')}</button><button type="button" class="primary" data-yes disabled>${tr('Save')}</button></div></div>`);
  let ed=null;
  const close=()=>{if(ed) ed.destroy(); sc.remove();m.remove();document.removeEventListener('keydown',key,true)};
  const key=(e)=>{
    if(!m.isConnected) return;
    if(e.key==='Escape'){if(ed&&ed.popupOpen()) return; e.stopPropagation();e.preventDefault();close()}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.stopPropagation();e.preventDefault();const b=q('[data-yes]',m); if(b&&!b.disabled) b.click()}
  };
  sc.onclick=close;
  q('[data-no]',m).onclick=close;
  q('[data-yes]',m).onclick=async()=>{
    const save=q('[data-yes]',m);
    if(!save||save.disabled) return;
    save.disabled=true;
    try{
      await call('PUT','/api/pages/'+encodeURIComponent(name),{content:ed?ed.value:(q('#pg-body',m)||{}).value});
      toast(tr('Saved'));
      close();
    }catch(err){save.disabled=false; toast(err.message,true)}
  };
  document.addEventListener('keydown',key,true);
  document.body.append(sc,m);
  const ta=q('#pg-body',m);
  const edReady=codeEditor(ta,name).then(e=>{if(!m.isConnected){e.destroy();return null} ed=e; return e});
  try{
    const j=await call('GET','/api/pages/'+encodeURIComponent(name));
    if(!m.isConnected) return;
    const e=await edReady;
    if(e) e.value=j&&typeof j.content==='string'?j.content:'';
  }catch(err){
    if(!m.isConnected) return;
    if(err.status===404){const miss=q('#pg-miss',m); if(miss) miss.hidden=false}
    else{toast(err.message,true); return}
  }
  const save=q('[data-yes]',m);
  if(save) save.disabled=false;
  const e=await edReady;
  if(e) e.focus();
}

  s.rules=r;

  s.api_mac={enabled:on('am_en'),code:val('am_code'),prob:+val('am_prob')||0};
}

// fieldReady reports whether a journal column may be shown.
// table is "events" or "conversions". name is the field name.
// It returns true when the field is absent (an old backend) or its wave is ready.
function fieldReady(table, name){
  const list=(FIELDS&&FIELDS.fields)||[];
  const f=list.find(x=>x&&x.name===name);
  if(!f) return true;
  const wave=table==='conversions'?(f.conv_wave||''):(f.events_wave||'');
  if(!wave) return true;
  const bag=FIELDS.ready&&FIELDS.ready[table];

// table is "events" or "conversions". It returns the matching field objects.

const FLOW_COLS_MIGRATED='kuztds-flow-cols-epc';
const FLOW_LOCKED=new Set(['num','name']);
const DOM_LOCKED=new Set(['id','host']);
/** lockedCols returns column ids that stay on and pinned for a report kind.
 * @param {string} kind report kind
 * @returns {Set<string>} locked ids, empty when the kind has none
 */
function lockedCols(kind){return kind==='flows'?FLOW_LOCKED:kind==='domains'?DOM_LOCKED:new Set()}
/** migrateFlowCols turns EPC on and uEPC off when a saved flows list still has uEPC on and EPC off.
 * @param {Array<{id:string,on:boolean}>} out merged column list
 * @returns {void}
 */
function migrateFlowCols(out){
  const uepc=out.find(r=>r.id==='uepc');
  const epc=out.find(r=>r.id==='epc');
  if(uepc&&epc&&uepc.on&&!epc.on){uepc.on=false;epc.on=true}
}
function loadCols(kind){
  const defs=colCatalog(kind).map(colSpec).filter(c=>colShown(kind,c));
  const pin=list=>{
    const locked=lockedCols(kind);
    list.forEach(r=>{if(locked.has(r.id)) r.on=true});
    if(!locked.size) return list;
    const order=colCatalog(kind).map(row=>row[0]);
    const front=list.filter(r=>locked.has(r.id)).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
    return front.concat(list.filter(r=>!locked.has(r.id)));
  };
  let saved=UI.cols[kind];
  if(saved===undefined) saved=null;
  if(kind==='conv'&&saved&&!Array.isArray(saved)&&typeof saved==='object'){
    return defs.map(d=>saved[d.id]==null?d:Object.assign({},d,{on:!!saved[d.id]}));
  }
  if(!Array.isArray(saved)) return pin(defs);
  const by=new Map(defs.map(d=>[d.id,d]));
  const migrate={group:'campaign',ua:'useragent',tz:'timezone',offer:'offer_id',landing:'landing_id',source:'source_id',network:'network_id'};
  for(let n=1;n<=12;n++) migrate['s'+n]='sub_id_'+n;
  const out=[];
  saved.forEach(s=>{
    if(!s) return;
    let id=s.id;
    if((kind==='logs'||kind==='conv')&&migrate[id]) id=migrate[id];
    const d=id&&by.get(id);
    if(!d) return;
    out.push(Object.assign({},d,{on:!!s.on}));
    by.delete(id);
  });
  by.forEach(d=>out.push(d));
  if(kind==='flows'){
    try{
      if(!localStorage.getItem(FLOW_COLS_MIGRATED)){
        migrateFlowCols(out);
        saveCols(kind,out);
        localStorage.setItem(FLOW_COLS_MIGRATED,'1');
      }
    }catch(e){}
  }
  if(out.length&&!out.some(r=>r.on)) out[0].on=true;
  return pin(out);
}

  const close=()=>{sc.remove();m.remove()};
  const paint=()=>{
    const qv=q('#col-find',m).value.trim().toLowerCase();
    const list=q('#col-list',m);
    const lockN=rows.filter(r=>locked.has(r.id)).length;
    list.innerHTML=rows.map((r,i)=>{
      const label=tr(r.label);
      if(qv&&!label.toLowerCase().includes(qv)&&!r.id.toLowerCase().includes(qv)) return '';
      const hold=locked.has(r.id);
      const grip=hold?'<span class="grip"></span>':`<span class="grip">${icon('grip')}</span>`;
      return `<div class="colrow" draggable="${hold||qv?'false':'true'}" data-i="${i}">${grip}<label class="tog"><input type="checkbox" data-i="${i}" ${hold?'checked disabled':(r.on?'checked':'')}>${esc(label)}</label></div>`;
    }).join('');
    q('#col-all',m).checked=rows.every(r=>r.on);
    let from=-1;
    qa('.colrow',list).forEach(row=>{
      row.ondragstart=e=>{if(qv||+row.dataset.i<lockN){e.preventDefault();return} from=+row.dataset.i; e.dataTransfer.effectAllowed='move'};
      row.ondragover=e=>e.preventDefault();
      row.ondrop=e=>{
        e.preventDefault();
        const to=+row.dataset.i;
        if(from<0||to===from||qv||from<lockN||to<lockN) return;
        const [item]=rows.splice(from,1);
        rows.splice(to,0,item);
        from=-1;
        paint();
      };
    });
    qa('input[data-i]',list).forEach(c=>c.onchange=()=>{
      const i=+c.dataset.i;
      if(locked.has(rows[i].id)){c.checked=true;return}
      if(!c.checked&&rows.filter(r=>r.on).length<=1){c.checked=true;return}
      rows[i].on=c.checked;
      q('#col-all',m).checked=rows.every(r=>r.on);
    });
  };
  q('#col-find',m).oninput=paint;
  q('#col-all',m).onchange=()=>{
    if(q('#col-all',m).checked) rows.forEach(r=>{r.on=true});
    else rows.forEach((r,i)=>{r.on=locked.has(r.id)||(!locked.size&&i===0)});
    paint();
  };
  q('#col-reset',m).onclick=()=>{rows=colCatalog(kind).map(colSpec).filter(c=>colShown(kind,c)); q('#col-find',m).value=''; paint()};
  q('[data-no]',m).onclick=close;
  sc.onclick=close;
  q('[data-yes]',m).onclick=()=>{saveCols(kind,rows); close(); onApply&&onApply()};
  document.body.append(sc,m);
  paint();
}

// condsQS serialises conditions as repeated f=field:op:value parameters.
// conds is an array of {f, op, v}. It returns a URLSearchParams.
function condsQS(conds){
  const qs=new URLSearchParams();
  (Array.isArray(conds)?conds:[]).forEach(c=>{
    if(!c||!c.f||!c.op) return;
    const vals=Array.isArray(c.v)&&c.v.length?c.v:[''];
    vals.forEach(v=>qs.append('f', c.f+':'+c.op+':'+String(v==null?'':v)));
  });
  return qs;
}

// filterBuilder edits conditions in a modal and calls onApply after a successful save.
// table is "events" or "conversions". state is the live {f, op, v} array, mutated on apply.
// onApply is optional. It returns nothing. Cancel leaves state unchanged.
async function filterBuilder(table, state, onApply){
  await Promise.all([ensureCatalogs(), ensureGroups().catch(()=>[])]);
  const draft=(Array.isArray(state)?state:[]).map(c=>({f:c.f||'', op:c.op||'eq', v:Array.isArray(c.v)?c.v.slice():[]}));
  if(!draft.length) draft.push({f:'', op:'eq', v:[]});
  const cache={};
  const valuesFor=(field)=>{
    if(Object.prototype.hasOwnProperty.call(cache, field)) return cache[field];
    const meta=((FIELDS&&FIELDS.fields)||[]).find(f=>f&&f.name===field);
    if(!meta||!meta.dim){cache[field]=Promise.resolve([]); return cache[field]}
    const b=rangeBounds();
    const qs=new URLSearchParams({table:table, field:field, from:b.from.toISOString(), to:b.to.toISOString()});
    cache[field]=get('/api/log-values?'+qs.toString(), []).then(rows=>Array.isArray(rows)?rows:[]);
    return cache[field];
  };
  const m=formModal(tr('flt.title'), `<div id="fb-rows" class="fbuild"></div>
    <div class="row"><button type="button" id="fb-add">${esc(tr('flt.add'))}</button><button type="button" id="fb-reset">${esc(tr('flt.reset'))}</button></div>`, async()=>{
    const next=dedupeConds(draft.filter(r=>r.f&&Array.isArray(r.v)&&r.v.length).map(r=>({f:r.f, op:r.op||'eq', v:r.v.slice()})));
    if(Array.isArray(state)) state.splice(0, state.length, ...next);
    if(typeof onApply==='function') return await onApply();
  }, tr('flt.apply'));
  if(m) m.style.width='min(920px,94vw)';
  const pushVal=(row, raw)=>{
    if(!row) return;
    const v=String(raw==null?'':raw).trim();
    if(!v) return;
    if(row.op==='eq'||row.op==='ne') row.v=[v];
    else if(!row.v.includes(v)) row.v.push(v);
  };
  const fieldSelect=(selected, i)=>{
    const taken=new Set(draft.map((row,j)=>j!==i&&row.f?row.f:null).filter(Boolean));
    const have=new Set(fieldsFor(table).map(f=>f.name));
    if(selected) have.add(selected);
    const groups=FLT_GROUPS.map(([g, names])=>{
      const opts=names.filter(n=>have.has(n)&&(!taken.has(n)||n===selected)).map(n=>`<option value="${esc(n)}"${n===selected?' selected':''}>${esc(fltName(table, n))}</option>`).join('');
      return opts?`<optgroup label="${esc(tr('flt.group.'+g))}">${opts}</optgroup>`:'';
    }).join('');
    return `<select data-f><option value="">—</option>${groups}</select>`;
  };
  const fbCanAdd=()=>{
    const names=fieldsFor(table).map(f=>f.name);
    const used=new Set(draft.map(r=>r.f).filter(Boolean));
    return names.some(n=>!used.has(n));
  };
  const opSelect=(op)=>`<select data-op>${FLT_OPS.map(([k,lab])=>`<option value="${k}"${k===op?' selected':''}>${esc(tr(lab))}</option>`).join('')}</select>`;
  const fillList=async(i, field)=>{
    const list=q('#fb-dl-'+i, m);
    if(!list||!field) return;
    const rows=await valuesFor(field);
    if(!q('#fb-dl-'+i, m)||!draft[i]||draft[i].f!==field) return;
    list.innerHTML=(rows||[]).map(r=>{
      const key=r&&r.key!=null?String(r.key):'';
      const name=idLabel(field, key);
      const show=field==='device'?name:(name&&name!==key?name+' · '+key:key);
      return `<option value="${esc(key)}">${esc(show)}</option>`;
    }).join('');
  };
  const paint=(focus)=>{
    const box=q('#fb-rows', m); if(!box) return;
    box.innerHTML=draft.map((row,i)=>{
      const chips=(row.v||[]).map((v,j)=>`<span class="chip"><span class="v">${esc(idLabel(row.f, v))}</span><button type="button" class="icon sm ghost" data-i="${i}" data-vdrop="${j}" aria-label="${esc(tr('Delete'))}">${icon('x')}</button></span>`).join('');
      return `<div class="frow" data-i="${i}">${fieldSelect(row.f, i)}${opSelect(row.op)}<div class="tags">${chips}<input class="tin" data-chip data-i="${i}" placeholder="${esc(tr('flt.value'))}" list="fb-dl-${i}" autocomplete="off"><datalist id="fb-dl-${i}"></datalist></div><button type="button" class="icon sm ghost" data-rm="${i}" aria-label="${esc(tr('Delete'))}">${icon('x')}</button></div>`;
    }).join('');
    qa('[data-f]', box).forEach(sel=>sel.onchange=()=>{
      const i=+sel.closest('.frow').dataset.i;
      if(!draft[i]) return;
      draft[i].f=sel.value; draft[i].v=[];
      paint(i);
    });
    qa('[data-op]', box).forEach(sel=>sel.onchange=()=>{
      const i=+sel.closest('.frow').dataset.i;

      paint(i);

    qa('[data-vdrop]', box).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(draft[i]) draft[i].v.splice(+b.dataset.vdrop, 1);

    });

    qa('[data-chip]', box).forEach(inp=>inp.onkeydown=e=>{
      if(e.key!=='Enter'&&e.key!==',') return;
      e.preventDefault();

      String(inp.value||'').split(',').forEach(part=>pushVal(draft[i], part));
      inp.value='';
      paint(i);

    draft.forEach((row,i)=>{if(row.f) fillList(i, row.f)});
    if(add) add.disabled=!fbCanAdd();
    if(focus!=null){const el=q(`[data-chip][data-i="${focus}"]`, m); if(el) el.focus()}
  };
  const add=q('#fb-add', m), reset=q('#fb-reset', m);
  if(add) add.onclick=()=>{draft.push({f:'', op:'eq', v:[]}); paint(draft.length-1)};
  if(reset) reset.onclick=()=>{draft.splice(0, draft.length); paint()};
  paint();
}
// ipMask hides the tail of an IPv4 address. keep is 2 for 1.2.*.* and 3 for 1.2.3.*.
// ip is the raw address. It returns '' when ip is not four decimal octets.
function ipMask(ip, keep){
  const p=String(ip||'').split('.');
  if(p.length!==4||p.some(x=>!/^\d+$/.test(x))) return '';
  const out=[];
  for(let i=0;i<4;i++) out.push(i<keep?p[i]:'*');
  return out.join('.');
}
// asnText prints an ASN with an AS prefix. v is the raw value. It returns '' for empty and zero.
function asnText(v){
  if(v==null||v===''||v===0||v==='0') return '';
  const s=String(v);
  return s.slice(0,2)==='AS'?s:'AS'+s;
}
// salePeriod is the gap from the click to the conversion.
// ts and click are ISO times. It returns '' when click is missing, otherwise a short duration.
function salePeriod(ts, click){
  if(!click) return '';
  const a=+new Date(ts), b=+new Date(click);
  if(!a||!b) return '';
  let s=Math.round((a-b)/1000);
  if(s<0) s=0;
  const d=Math.floor(s/86400);
  const h=Math.floor((s%86400)/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  if(d>0) return d+tr('d')+' '+h+tr('h');
  if(h>0) return m?h+tr('h')+' '+m+' '+tr('min'):h+tr('h');
  if(m>0) return m+' '+tr('min');
  return sec+' '+tr('s');
}
// campaignGroupLabel is the campaign folder.
// x is a log or conversion row. It returns the folder, or '' when the campaign is unknown.
function campaignGroupLabel(x){
  let g=x&&x.campaign_id?groupById(x.campaign_id):null;
  if(!g){
    const name=(x&&(x.group||x.campaign))||'';
    if(name) g=(GROUPS||[]).find(item=>item&&(item.name===name||item.id===name))||null;
  }
  return g&&g.folder?g.folder:'';
}
// cellClass is the td class list for a journal column. id is the column id. It returns a string.

// subValue reads subs[N-1] for a sub_id_N column. x is a row. id is the column. It returns a string.

// convCell renders one conversion cell. x is a postback row. id is the column. It returns HTML.
function convCell(x, id){

function linkDomains(){return (DOMAINS||[]).filter(d=>d.role==='links'||d.role==='both')}
function visitOrigin(){
  const eng=String(ENGINE||'').replace(/\/$/,'');
  let host='', port='8080';
  try{
    const u=new URL(eng||'http://127.0.0.1:8080');
    host=u.hostname;
    port=u.port||(u.protocol==='https:'?'443':'8080');
  }catch(e){}
  const page=location.hostname||'';
  const internal=host==='engine'||host==='localhost'||host==='127.0.0.1'||host==='::1';
  if(host==='engine'||(page&&internal&&page!==host)) return 'http://'+(page||'127.0.0.1')+':'+(port==='443'?'8080':port);
  if(eng) return eng;
  return 'http://'+(page||'127.0.0.1')+':8080';
}
function campaignBase(g){
  const list=linkDomains();
  let d=g&&g.domain_id?list.find(x=>x.id===g.domain_id):null;

  if(d&&d.host) return 'https://'+String(d.host).replace(/^https?:\/\//,'').replace(/\/$/,'');

}

function sourceCampaignLink(g, src){
  const base=campaignURL(g);

  if(src&&src.parameters){
    Object.keys(src.parameters).forEach(k=>{
      const name=String(src.parameters[k]||'').trim();

/* ---------- SETTINGS ---------- */
/** tzCanon maps a zone id through TZ_ALIAS when Intl accepts the target.
 * A canonical id Intl rejects is mapped back to the legacy key. Storage is not written.
 * @param {string} z zone id from the browser or from storage.
 * @return {string} a supported zone id, or z when it needs no change. */
function tzCanon(z){
  if(z&&TZ_ALIAS[z]) return TZ_ALIAS_OK[TZ_ALIAS[z]]?TZ_ALIAS[z]:z;
  if(z) for(const k in TZ_ALIAS) if(TZ_ALIAS[k]===z&&!TZ_ALIAS_OK[z]) return k;
  return z;
}
function tzOffsetHours(z){
  if(!z||z==='UTC') return 0;
  const read=zone=>{
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'shortOffset'}).formatToParts(new Date());
    const raw=((parts.find(p=>p.type==='timeZoneName')||{}).value||'').replace(/^GMT/,'');
    if(raw===''||raw==='UTC') return 0;
    const m=/^([+-])(\d{1,2})(?::(\d{2}))?$/.exec(raw);
    if(!m) return null;
    const h=+m[2]+(m[3]?+m[3]/60:0);
    return m[1]==='-'?-h:h;
  };
  try{return read(z)}catch(e){
    if(z==='Europe/Kyiv'){try{return read('Europe/Kiev')}catch(e2){return null}}
    return null;
  }
}
function tzOptions(filter){
  let all=['UTC'];
  try{all=Intl.supportedValuesOf('timeZone')}catch(e){}
  const cur=uiTz();
  const rows=[];
  const seen=new Set();
  for(const z of all){
    if(z==='Europe/Moscow') continue;
    const canon=tzCanon(z);
    if(seen.has(canon)) continue;
    seen.add(canon);
    const h=tzOffsetHours(canon);
    if(h==null||h<-11||h>11) continue;
    rows.push({z:canon, raw:z, h});
  }
  if(TZ_ALIAS_OK['Europe/Kyiv']&&!rows.some(r=>r.z==='Europe/Kyiv')){
    const h=tzOffsetHours('Europe/Kyiv');
    if(h!=null) rows.push({z:'Europe/Kyiv', raw:'Europe/Kiev', h});
  }
  if(cur&&!rows.some(r=>r.z===cur)) rows.push({z:cur, raw:cur, h:tzOffsetHours(cur)||0});
  rows.sort((a,b)=>a.h-b.h||String(a.z).localeCompare(b.z));
  const f=String(filter||'').toLowerCase();
  const has=s=>String(s||'').toLowerCase().includes(f);
  const out=rows.filter(r=>{
    if(!f) return true;
    if(has(r.z)||has(tzLabel(r.z))||has(r.raw)) return true;
    return Object.keys(TZ_ALIAS).some(k=>TZ_ALIAS[k]===r.z&&has(k));
  }).map(r=>r.z);
  if(cur&&out.indexOf(cur)<0) out.unshift(cur);
  return out;
}
function tzLabel(z){
  if(!z) return '';
  if(z==='UTC') return 'UTC · UTC+0';
  try{
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:z,timeZoneName:'shortOffset'}).formatToParts(new Date());
    const off=(parts.find(p=>p.type==='timeZoneName')||{}).value||'';
    if(off) return z+' · '+off.replace(/^GMT/,'UTC');
  }catch(e){}
  return z;
}
// bindTzPick opens one zone list from tzOptions. Letters typed while the list
// is open accumulate in a buffer that filters the list. The buffer clears
// after 3 seconds without keys and when the list closes. onPick(zone) is the
// only write; the buffer is not stored.
function bindTzPick(btn, list, getZone, onPick){
  let buf='', timer=null, open=false;
  const label=()=>{if(btn.isConnected) btn.textContent=tzLabel(getZone())};
  const paint=()=>{
    label();
    if(!list) return;
    const cur=getZone();
    list.innerHTML=tzOptions(buf).map(z=>`<button type="button" data-tz="${esc(z)}" class="${z===cur?'on':''}">${esc(tzLabel(z))}</button>`).join('');
    qa('[data-tz]', list).forEach(b=>b.onclick=ev=>{
      ev.stopPropagation();
      const z=b.dataset.tz;
      shut();
      onPick(z);
      label();
    });
  };
  const shut=()=>{
    open=false;
    buf='';
    if(timer){clearTimeout(timer); timer=null}
    if(list) list.hidden=true;
    document.removeEventListener('keydown', onKey, true);
    document.removeEventListener('click', onDoc, true);
  };
  const arm=()=>{
    if(timer) clearTimeout(timer);
    timer=setTimeout(()=>{buf=''; if(open) paint()}, 3000);
  };
  const onKey=(e)=>{
    if(!open) return;
    if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){shut(); return}
    if(e.key==='Escape'){e.stopPropagation(); e.preventDefault(); shut(); return}
    if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1) return;
    buf+=e.key;
    arm();
    paint();
    e.preventDefault();
    e.stopPropagation();
  };
  const onDoc=(e)=>{
    if(!open) return;
    if(e.target===btn||btn.contains(e.target)||(list&&list.contains(e.target))) return;
    shut();
  };
  btn.onclick=ev=>{
    ev.stopPropagation();
    if(open){shut(); return}
    open=true;
    list.hidden=false;
    paint();
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('click', onDoc, true);
  };
  label();
  return {close:shut};
}
// profile opens #/settings: profile cards, API keys, or the docs page.
// arg is the hash tail after settings (keys, docs, or empty). It returns nothing.
async function profile(arg){
  if(arg==='docs'||location.hash==='#/settings/docs'){ await apiDocs(); return; }
  const usersTab=arg==='users'||location.hash==='#/settings/users';
  const keys=arg==='keys'||location.hash==='#/settings/keys';
  const showKeys=sectionAllowed(ME,'api_keys');
  const showUsers=sectionAllowed(ME,'users');
  let tabBtns=`<button type="button" role="tab" data-ptab="profile" aria-selected="${!keys&&!usersTab}" class="${keys||usersTab?'':'on'}">${tr('prof.tab')}</button>`;
  if(showKeys) tabBtns+=`<button type="button" role="tab" data-ptab="keys" aria-selected="${keys}" class="${keys?'on':''}">${tr('prof.keys')}</button>`;
  if(showUsers) tabBtns+=`<button type="button" role="tab" data-ptab="users" aria-selected="${usersTab}" class="${usersTab?'on':''}">${tr('prof.users')}</button>`;
  const tabs=`<div class="vseg" role="tablist">${tabBtns}</div>`;
  view().innerHTML=`<div class="ph"><h1>${tr('prof.title')}</h1><div class="spacer"></div>${tabs}</div><div id="profile-body"></div>`;
  qa('[data-ptab]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.ptab;
    if(t==='keys') go('settings/keys');
    else if(t==='users') go('settings/users');
    else go('settings');
  });
  if(usersTab){
    if(!showUsers){ go('settings'); return; }
    await usersPage();
    return;
  }
  if(keys){
    if(!showKeys){ go('settings'); return; }
    await apiKeys();
    return;
  }
  settings();
}
// keyRevokedAt is the display time of a revoked key, or '' while it is active.
// item is one row from GET /api/api-keys. A zero time counts as active.
function keyRevokedAt(item){
  if(!item||!item.revoked_at) return '';
  const t=new Date(item.revoked_at);
  if(!+t||t.getUTCFullYear()<2000) return '';
  return when(item.revoked_at);
}
// keyAccess joins scope captions. scopes is the row's scopes array. It returns a phrase.
function keyAccess(scopes){
  const map={admin:tr('key.scope.admin'), engine:tr('key.scope.engine')};
  return (Array.isArray(scopes)?scopes:[]).map(s=>map[s]||s).join(', ');
}
/** readKeyForm reads the name and scopes from a key dialog.
 * @param {Element} box dialog root that contains #key-name, #key-admin and #key-engine
 * @returns {{name:string,scopes:string[]}} throws when the name or the scopes are invalid
 */
function readKeyForm(box){
  const name=(q('#key-name', box).value||'').trim();
  if(!name||name.length>64) throw new Error(tr('key.name.need'));
  const scopes=[];
  if(q('#key-admin', box).checked) scopes.push('admin');
  if(q('#key-engine', box).checked) scopes.push('engine');
  if(!scopes.length) throw new Error(tr('key.scope.need'));
  return {name, scopes};
}
/** keyFormHTML is the shared name and scope fields for create and edit.

function keyFormHTML(item){

      <label class="tog"><input type="checkbox" id="key-engine"${engine?' checked':''}>${esc(tr('key.scope.engine'))}</label>
    </div>`;
}
/** rotateKey reissues an active key and shows the new secret once.
 * @param {object} item key row with id

async function rotateKey(item){
  if(!await ask(tr('key.rotate.ask'), tr('key.rotate.hint'), tr('key.rotate'), true)) return;

/** editKey changes the name and scopes of an active key.

/** revokeKey asks, then revokes an active key.

// showKeyOnce shows the new secret in a dialog and does not keep it afterwards.
// raw is the key from POST /api/api-keys. It returns nothing. Closing drops the text.
function showKeyOnce(raw){
  const sc=$('<div class="scrim" style="z-index:82"></div>');
  const m=$(`<div class="modal" role="dialog" style="z-index:83;width:min(640px,92vw)"><h3>${esc(tr('key.once.title'))}</h3>
    <p class="hint">${esc(tr('key.once.warn'))}</p>
    <p><code id="key-once">${esc(raw)}</code></p>
    <div class="row"><div class="spacer"></div><button type="button" class="primary" id="key-copy">${esc(tr('key.copy'))}</button><button type="button" data-no>${esc(tr('key.close'))}</button></div></div>`);
  const done=()=>{sc.remove(); m.remove(); document.removeEventListener('keydown', onKey, true)};
  const onKey=(e)=>{if(e.key==='Escape'){e.stopPropagation(); done()}};
  sc.onclick=done;
  q('[data-no]', m).onclick=done;
  q('#key-copy', m).onclick=()=>{
    const el=q('#key-once', m);
    const text=el?(el.textContent||''):'';
    const select=()=>{
      if(!el) return;
      const range=document.createRange();
      range.selectNodeContents(el);
      const sel=window.getSelection();
      if(!sel) return;
      sel.removeAllRanges();
      sel.addRange(range);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast(tr('pb.copy'))).catch(select);
    else select();
  };
  document.addEventListener('keydown', onKey, true);
  document.body.append(sc, m);
}

/** accessEntityLabels collects unique group/folder labels from catalog rows.
 * @param {Array} rows catalog rows
 * @returns {string[]}
 */
function accessEntityLabels(rows){
  const seen=new Set(), out=[];
  (rows||[]).forEach(r=>{
    const lab=grantLabel(r);
    if(!lab||seen.has(lab)) return;
    seen.add(lab); out.push(lab);
  });
  return out.sort((a,b)=>a.localeCompare(b));
}

// openPostbacks copies the lead and sale URLs of this tracker. The lead URL
// has no payout. enginePostback stays as it is for network templates.
function openPostbacks(){

    async()=>{copyText('lead: '+lead+'\nsale: '+sale)}, tr('pb.copyall'));
  q('#pb-pop-lead',m).onclick=e=>{e.stopPropagation(); copyText(lead, e.currentTarget)};
  q('#pb-pop-sale',m).onclick=e=>{e.stopPropagation(); copyText(sale, e.currentTarget)};
}
function enginePostback(status){
  return visitOrigin()+'/postback?subid={subid}&status='+(status||'{status}')+'&payout={payout}';
}
const NET_TEMPLATES=[
  {id:'s2s',label:'Generic S2S',url:'',query:'sub1={subid}'},
  {id:'click',label:'clickid, goal, sum',url:'https://example.com/postback?clickid={subid}&goal={status}&sum={payout}',query:''}
];
let LAND_SORT={k:'',dir:-1};
// Same extension set as server landingTextExt (GET/PUT /api/landings/{id}/files).
const LAND_TEXT=new Set(['html','htm','php','css','js','txt','json','xml','svg']);
// landingKind is the catalog label for how a landing is served.
// row is a landing record. It returns URL, PHP or HTML.
function landingKind(row){
  if(!row||!row.local) return 'URL';
  return /\.php$/i.test(String(row.entry||''))?'PHP':'HTML';
}
// landingText reports whether a landing file opens in the text editor.
// path is the relative path from the file list. It returns true for a known text extension.
function landingText(path){
  const name=String(path||'').split('/').pop().toLowerCase();
  const dot=name.lastIndexOf('.');
  if(dot<0) return false;
  return LAND_TEXT.has(name.slice(dot+1));
}
// landingFileURL builds the API path of one file inside a landing.
// id is the landing id. path is the relative file path. It returns the encoded path.
function landingFileURL(id, path){
  const parts=String(path||'').split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return '/api/landings/'+encodeURIComponent(id)+'/files/'+parts;
}
// landingSortValue is the key one landing column sorts by.
// row is the landing. k is the column id. files is the file count.
// It returns a string for text columns and a number otherwise.
function landingSortValue(row, k, files){
  if(k==='id') return row&&row.id!=null?row.id:'';
  if(k==='name') return (row&&row.name)||'';
  if(k==='group') return (row&&row.group)||'';
  if(k==='kind') return landingKind(row);
  if(k==='state') return tr(row&&row.status?'On':'Off');
  if(k==='files') return files||0;
  return 0;
}
function landingRowHTML(row, files){
  return loadCols('landings').filter(c=>c.on).map(c=>{
    if(c.id==='id') return `<td class="num">${esc(row.id)}</td>`;
    if(c.id==='name') return `<td>${esc(row.name||'')}</td>`;
    if(c.id==='group') return `<td>${esc(row.group||'')}</td>`;
    if(c.id==='kind') return `<td>${esc(landingKind(row))}</td>`;
    if(c.id==='state') return `<td>${esc(tr(row.status?'On':'Off'))}</td>`;
    if(c.id==='files') return `<td class="num">${fmt(files||0)}</td>`;
    return '<td></td>';
  }).join('');
}
// landingFileRead loads one landing file as text.
// id is the landing id. path is the relative path.
// It returns the text. A JSON body with content uses that field.
// A 401 opens the login screen and throws. Any other failure throws Error with status.
async function landingFileRead(id, path){
  const r=await fetch(landingFileURL(id, path),{method:'GET',credentials:'same-origin'});
  if(r.status===401){loginView(); throw new Error('session expired')}
  const raw=await r.text();
  let msg=raw;
  try{
    const j=JSON.parse(raw);
    if(j&&j.error) msg=String(j.error);
    if(r.ok&&j&&typeof j.content==='string') return j.content;
  }catch(e){}
  if(!r.ok){const e=new Error(msg||('HTTP '+r.status)); e.status=r.status; throw e}
  return raw;
}
// openLandingFile edits one text file of a local landing. The path stays the file name.
// id is the landing id. path is the relative path. A missing file stays editable.
// A load error other than 404 is toasted and saving stays off. It does not return a value.
async function openLandingFile(id, path){
  const sc=$('<div class="scrim" style="z-index:80"></div>');
  const m=$(`<div class="modal" role="dialog" style="width:min(1100px,96vw);max-height:min(92vh,980px);overflow:auto;z-index:81"><h3>${esc(path)}</h3>
    <p class="hint" id="lf-miss" hidden>${esc(tr('page.missing'))}</p>
    <textarea id="lf-body" class="code" spellcheck="false" style="min-height:60vh"></textarea>
    <div class="row"><div class="spacer"></div><button type="button" data-no>${tr('Cancel')}</button><button type="button" class="primary" data-yes disabled>${tr('Save')}</button></div></div>`);
  let ed=null;

    if(err.status===404){const miss=q('#lf-miss',m); if(miss) miss.hidden=false}
    else{toast(err.message,true); return}
  }
  const save=q('[data-yes]',m);
  if(save) save.disabled=false;
  const e=await edReady;
  if(e) e.focus();

/** domainStatus is the status cell markup: a dot plus the escaped phrase.

function domainStatus(d){

}
/** domainCell renders one body cell of the domains table.
 * @param {object} d domain record
 * @param {string} id column id from the domains catalog
 * @returns {string} a td element, empty when the id is unknown
 */
function domainCell(d, id){
  if(id==='id') return `<td class="num">${esc(d.id)}</td>`;
  if(id==='host') return `<td class="mono">${esc(d.host)}</td>`;
  if(id==='group') return `<td class="grp">${esc(d.group||'')}</td>`;
  if(id==='role'){
    const role=d.role||'both';
    const key='dom.role.'+role;
    const label=tr(key);
    return `<td>${esc(label===key?role:label)}</td>`;
  }
  if(id==='campaigns') return `<td class="num">${fmt(+d.campaigns||0)}</td>`;
  if(id==='status') return `<td>${domainStatus(d)}</td>`;
  if(id==='checked') return `<td>${d.checked?esc(when(d.checked)):''}</td>`;
  return '<td></td>';
}
/** paintDomPage fills the domains pager: newer, older, page size and the range.
 * @param {number} total filtered domain count
 * @param {function} paint redraws the table after a page or size change
 * @returns {void}
 */
function paintDomPage(total, paint){
  const box=q('#dompage'); if(!box) return;
  const pages=Math.max(1,Math.ceil(total/DOM_PAGE)||1);
  const from=total?DOM_PAGE_I*DOM_PAGE+1:0;
  const to=Math.min(total,(DOM_PAGE_I+1)*DOM_PAGE);
  const sizes=FLOW_PRESETS.includes(DOM_PAGE)?FLOW_PRESETS:FLOW_PRESETS.concat([DOM_PAGE]);
  const opts=sizes.map(n=>`<option value="${n}"${n===DOM_PAGE?' selected':''}>${n}</option>`).join('');
  box.innerHTML=`<button type="button" class="icon sm" id="dprev" title="${tr('Newer')}" aria-label="${tr('Newer')}" ${DOM_PAGE_I<=0?'disabled':''}>${icon('back')}</button>
    <button type="button" class="icon sm" id="dnext" title="${tr('Older')}" aria-label="${tr('Older')}" ${DOM_PAGE_I>=pages-1?'disabled':''}>${icon('arrow')}</button>
    <label class="hint">${tr('flows.page')}</label><select id="dpage">${opts}</select>
    <span class="hint">${fmt(from)}–${fmt(to)} ${tr('of')} ${fmt(total)}</span>`;

/** checkDomain rechecks one domain and updates that row and the DOMAINS cache.

  const domNew=q('#dom-new'); if(domNew) domNew.onclick=()=>openDomainAdd('');
  const domGrp=q('#dom-groups'); if(domGrp) domGrp.onclick=()=>openGroupWindow({
    title:tr('dom.groups'), rows,
    labelOf:g=>g,
    countOf:g=>(rows||[]).filter(d=>(d.group||'').trim()===g).length,
    onCreate:name=>{DOM_PREFILL=name;},
    onClear:async name=>{
      await clearGroupLabel('/api/domains', rows, name);
      await ensureDomains();
      if(live()) paintTable();

  });

}
let REPORT_ROWS=[];
let REP={conds:[]}, REP_HOLD=false;
// reportQS is the report query: the period plus the active conditions.
// It returns a query string without a leading question mark.
function reportQS(){
  const qs=new URLSearchParams(rangeQS());
  condsQS(REP.conds).forEach((v,k)=>qs.append(k,v));
  return qs.toString();
}
async function report(_,live){
  const hold=REP_HOLD; REP_HOLD=false;
  if(!hold) REP={conds:[]};
  const rows=await get('/api/report?'+reportQS(),[]);
  if(!live()) return;
  REPORT_ROWS=rows||[];
  paintReport(live);
}
function paintReport(live){
  const rows=REPORT_ROWS||[];
  const cols=loadCols('report').filter(c=>c.on);
  const num=new Set(['hits','bots','conv','profit','cr']);
  const cell=(r,id)=>{
    if(id==='hits'||id==='bots'||id==='conv') return fmt(r[id]);
    if(id==='cr') return cellRatio(r.conv, r.hits);
    if(id==='profit') return moneyText(r.profit||0, '', 2);
    if(id==='device') return esc(deviceLabel(r.device));
    return esc({group:r.group,stream:r.stream,country:r.country,offer:r.offer,source:r.source}[id]??'');
  };
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td class="${num.has(c.id)?'num':''}">${cell(r,c.id)}</td>`).join('')}</tr>`).join('');
  view().innerHTML=`<div class="ph"><h1>${tr('rep.title')}</h1><span class="sub">${periodLabel()}</span><div class="spacer"></div>${colTools('report')}<button id="rcsv">${tr('rep.csv')}</button><button type="button" id="rhtml">${tr('Export HTML')}</button></div>
    <div class="toolbar"><button type="button" class="primary" id="rep-filters"></button></div>
    <div class="chips" id="rep-chips"></div>
    <div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${num.has(c.id)?'num':''}">${esc(tr(c.label))}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}">${tr('rep.empty')}</td></tr>`}</tbody></table></div>`;
  const reloadRep=async()=>{
    const next=await get('/api/report?'+reportQS(),[]);
    if(live&&!live()) return;
    REPORT_ROWS=next||[];
    paintReport(live);
  };
  paintFilterBar('events', q('#rep-filters'), q('#rep-chips'), REP.conds, reloadRep);
  q('#rep-filters').onclick=()=>filterBuilder('events', REP.conds, ()=>{REP_HOLD=true});
  bindColTools(view(),'report',async()=>{
    const next=await get('/api/report?'+reportQS(),[]);
    if(live&&!live()) return;
    REPORT_ROWS=next||[];
    paintReport(live);
  },()=>{if(!live||live()) paintReport(live)});
  q('#rcsv').onclick=()=>{
    const head=['campaign','stream','country','offer','source','visits','bots','conv','profit'];
    const lines=[head.join(',')].concat(rows.map(r=>[r.group,r.stream,r.country,r.offer,r.source,r.hits,r.bots,r.conv,r.profit].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')));
    const blob=new Blob([lines.join('\n')],{type:'text/csv'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='report.csv'; a.click();
  };
  q('#rhtml').onclick=()=>{
    downloadHTML(tr('rep.title'), cols.map(c=>tr(c.label)), rows.map(r=>cols.map(c=>plainCell(String(cell(r,c.id))))));
  };
}

/**
 * keitaroPanel draws Keitaro import controls into host: connection, catalogs, progress, and result.
 * @param {Element} host container for the panel markup
 * @param {function(): boolean} live false once this render is no longer current
 * @returns {Promise<void>} a failed request shows its message and leaves the page in place
 */
async function keitaroPanel(host,live){
  if(!host) return;
  const st=await get('/api/keitaro/status',{configured:false});
  if(!live()) return;
  const ymd=d=>{const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
  if(!st||!st.configured){
    host.innerHTML=`<div class="card pad"><p style="margin:0">${tr('kt.need')}</p></div>`;
    return;
  }
  const b0=rangeBounds();
  const from0=ymd(b0.from), to0=ymd(b0.to);
  host.innerHTML=`<div class="bds setgrid">
    <div class="card pad"><div class="bd"><div class="bt">${tr('kt.conn')}</div></div>
      <p class="mono" style="margin:0 0 12px">${esc(st.host||'')}</p>
      <button type="button" id="kt-check">${tr('kt.check')}</button>
      <p class="hint" id="kt-status" hidden></p>
      <p class="hint err" id="kt-check-err" hidden></p></div>
    <div class="card pad" id="kt-import" hidden><div class="bd"><div class="bt">${tr('kt.what')}</div></div>
      <div class="togs">
        <label class="tog"><input type="checkbox" id="kt-domains" checked>${tr('kt.domains')}</label>
        <label class="tog"><input type="checkbox" id="kt-networks" checked>${tr('kt.networks')}</label>
        <label class="tog"><input type="checkbox" id="kt-offers" checked>${tr('kt.offers')}</label>
        <label class="tog"><input type="checkbox" id="kt-landings" checked>${tr('kt.landings')}</label>
        <label class="tog"><input type="checkbox" id="kt-sources" checked>${tr('kt.sources')}</label>
        <label class="tog"><input type="checkbox" id="kt-campaigns" checked>${tr('kt.campaigns')}</label>
        <label class="tog"><input type="checkbox" id="kt-users">${tr('kt.users')}</label>
      </div>
      <p class="hint">${tr('kt.users.hint')}</p>
      <div class="togs">
        <label class="tog"><input type="checkbox" id="kt-conversions">${tr('kt.conversions')}</label>
        <label class="tog"><input type="checkbox" id="kt-clicks">${tr('kt.clicks')}</label>
      </div>
      <div class="fld"><label>${tr('kt.period')}</label>
        <div class="togs">
          <label class="tog"><input type="radio" name="ktperiod" id="kt-period-global" checked>${tr('kt.period.global')} ${esc(periodLabel())}</label>
          <label class="tog"><input type="radio" name="ktperiod" id="kt-period-custom">${tr('kt.period.custom')}</label>
        </div>
        <div class="row wrap"><input type="date" id="kt-from" value="${esc(from0)}" disabled><input type="date" id="kt-to" value="${esc(to0)}" disabled></div>
      </div>
      <div class="row wrap"><button type="button" class="primary" id="kt-run">${tr('kt.run')}</button><button type="button" class="danger" id="kt-purge">${tr('kt.purge')}</button></div>
    </div>
    <div class="card pad" id="kt-progress" hidden><div class="bd"><div class="bt">${tr('kt.progress')}</div></div>
      <p class="hint" id="kt-progress-line"></p>
      <progress id="kt-bar"></progress>
    </div>
    <div class="card pad" id="kt-result" hidden><div class="bd"><div class="bt" id="kt-result-title">${tr('kt.result')}</div></div>
      <div class="row wrap" id="kt-counts"></div>
      <p class="hint err" id="kt-job-err" hidden></p>
      <div id="kt-losses"></div>
    </div>
    </div>`;
  const on=id=>{const el=q('#'+id); return !!(el&&el.checked)};
  const syncPeriod=()=>{
    const open=on('kt-conversions')||on('kt-clicks');
    ['kt-from','kt-to'].forEach(id=>{const el=q('#'+id); if(el) el.disabled=!open});
  };
  ['kt-conversions','kt-clicks'].forEach(id=>{const el=q('#'+id); if(el) el.onchange=syncPeriod});
  const span=()=>{
    if(on('kt-period-custom')) return {from:(q('#kt-from')||{}).value||'', to:(q('#kt-to')||{}).value||''};
    const b=rangeBounds();
    return {from:ymd(b.from), to:ymd(b.to)};
  };
  const payload=()=>{
    const s=span();
    return {domains:on('kt-domains'),networks:on('kt-networks'),offers:on('kt-offers'),landings:on('kt-landings'),sources:on('kt-sources'),campaigns:on('kt-campaigns'),users:on('kt-users'),conversions:on('kt-conversions'),clicks:on('kt-clicks'),from:s.from,to:s.to};
  };
  const dropCatalog=()=>{if(typeof flowsDirty==='function' && !flowsDirty()) GROUPS=null};
  const countKeys=['groups','offers','landings','networks','sources','domains','lists','pages','users','conversions','clicks'];
  const countBag=r=>{
    if(!r||typeof r!=='object') return {};
    if(r.counts&&typeof r.counts==='object') return r.counts;
    if(r.removed&&typeof r.removed==='object') return r.removed;
    const top={};
    countKeys.forEach(k=>{if(Object.prototype.hasOwnProperty.call(r,k)) top[k]=r[k]});
    return top;
  };
  const paintResult=(r,purged)=>{
    const card=q('#kt-result'); if(!card) return;
    card.hidden=false;
    const jobErr=q('#kt-job-err'); if(jobErr){jobErr.hidden=true; jobErr.textContent=''}
    const title=q('#kt-result-title'); if(title) title.textContent=tr(purged?'kt.removed':'kt.result');
    const bag=countBag(r);
    const keys=countKeys.filter(k=>Object.prototype.hasOwnProperty.call(bag,k));
    const counts=q('#kt-counts');
    if(counts) counts.innerHTML=keys.map(k=>`<span class="pill">${esc(tr('kt.c.'+k))} <b>${esc(bag[k])}</b></span>`).join('');
    const lossesEl=q('#kt-losses'); if(!lossesEl) return;
    if(purged){lossesEl.innerHTML=''; return}
    const losses=Array.isArray(r&&r.losses)?r.losses:[];
    if(!losses.length){lossesEl.innerHTML=`<p class="hint">${esc(tr('kt.nolosses'))}</p>`; return}
    const tally={};
    losses.forEach(row=>{const k=String(row&&row.kind||''); tally[k]=(tally[k]||0)+1});
    const pills=Object.keys(tally).map(k=>`<span class="pill">${esc(tr('kt.kind.'+k))} ${esc(tally[k])}</span>`).join('');
    const groups={};
    losses.forEach(row=>{
      const kind=String(row&&row.kind||'');
      const detail=String(row&&row.detail==null?'':row.detail);
      const key=kind+'\u0000'+detail;
      const g=groups[key]||(groups[key]={kind,detail,refs:[]});
      g.refs.push(row&&row.ref);
    });
    const sorted=Object.keys(groups).map(k=>groups[k]).sort((a,b)=>b.refs.length-a.refs.length);
    const shown=sorted.slice(0,200);
    const rows=shown.map(g=>{
      const extra=g.refs.length-3;
      const refs=g.refs.slice(0,3).map(r=>String(r==null?'':r)).join(', ')+(extra>0?'… +'+extra:'');
      return `<tr><td><span class="pill">${esc(tr('kt.kind.'+g.kind))}</span></td><td>${esc(g.refs.length)}</td><td>${esc(g.detail)}</td><td>${esc(refs)}</td></tr>`;
    }).join('');
    const rest=sorted.length-shown.length;
    const more=rest?`<p class="hint">${esc(tr('kt.groups.more'))} ${esc(rest)}</p>`:'';
    lossesEl.innerHTML=`<div class="row wrap" style="margin:10px 0">${pills}</div><div class="tw"><table><thead><tr><th></th><th>${esc(tr('kt.col.count'))}</th><th>${esc(tr('kt.col.detail'))}</th><th>${esc(tr('kt.col.refs'))}</th></tr></thead><tbody>${rows}</tbody></table></div>${more}`;
  };
  let timer=0, reading=false;
  const stopPoll=()=>{if(timer){clearInterval(timer); timer=0}};
  const setRunBusy=locked=>{['kt-run','kt-purge'].forEach(id=>{const el=q('#'+id); if(el) el.disabled=!!locked})};
  const revealImport=()=>{const imp=q('#kt-import'); if(imp) imp.hidden=false};
  const progressLine=job=>{
    const done=Number(job&&job.done)||0, total=Number(job&&job.total)||0;
    return tr('kt.stage.'+String(job&&job.stage||''))+(total>0?' '+done+' / '+total:(done>0?' '+done:''));
  };
  const paintProgress=job=>{
    const card=q('#kt-progress'); if(card) card.hidden=false;
    const line=q('#kt-progress-line'); if(line) line.textContent=progressLine(job);
    const bar=q('#kt-bar');
    if(bar){
      const done=Number(job&&job.done)||0, total=Number(job&&job.total)||0;
      if(total>0){bar.max=total; bar.value=done>total?total:done}
      else bar.removeAttribute('value');
    }
    setRunBusy(true);
  };
  const hideProgress=()=>{
    const card=q('#kt-progress'); if(card) card.hidden=true;
    setRunBusy(false);
  };
  const showJobErr=msg=>{
    const err=q('#kt-job-err'); if(!err) return;
    err.hidden=!msg; err.textContent=msg||'';
  };
  const showFinished=(job, announce)=>{
    hideProgress();
    if(announce) dropCatalog();
    paintResult({counts:job&&job.counts, losses:job&&job.losses}, false);
    const msg=job&&job.error?String(job.error):'';
    showJobErr(msg);
    if(announce&&msg) toast(msg, true);
  };
  const pollJob=async()=>{
    if(!live()){stopPoll(); dropCatalog(); return}
    if(reading) return;
    reading=true;
    let job=null;
    try{job=await get('/api/keitaro/job', null)}
    finally{reading=false}
    if(!live()){stopPoll(); dropCatalog(); return}
    if(!job) return;
    if(job.running){paintProgress(job); return}
    stopPoll();
    showFinished(job, true);
  };
  const startPoll=()=>{
    if(timer) return;
    setRunBusy(true);
    const card=q('#kt-progress'); if(card) card.hidden=false;
    timer=setInterval(pollJob, 2000);
    pollJob();
  };
  const job0=await get('/api/keitaro/job',{running:false,stage:'idle'});
  if(!live()) return;
  if(job0&&job0.running){
    revealImport();
    paintProgress(job0);
    startPoll();
  }else if(job0&&(job0.stage==='done'||job0.stage==='failed')){
    revealImport();
    showFinished(job0, false);
  }
  q('#kt-check').onclick=()=>{
    const btn=q('#kt-check');
    busy(btn, async()=>{
      try{
        const r=await call('POST','/api/keitaro/check',{});
        if(!live()) return;
        const line=q('#kt-status');
        if(line){line.hidden=false; line.textContent=tr('kt.ok')+' '+((r&&r.campaigns!=null)?r.campaigns:'')}
        const err=q('#kt-check-err'); if(err){err.hidden=true; err.textContent=''}
        const imp=q('#kt-import'); if(imp) imp.hidden=false;
      }catch(e){
        if(!live()) return;
        toast(e.message,true);
        const err=q('#kt-check-err'); if(err){err.hidden=false; err.textContent=e.message||''}
      }
    });
  };
  q('#kt-run').onclick=async()=>{
    const btn=q('#kt-run');
    if(btn&&btn.disabled) return;
    setRunBusy(true);
    try{
      await call('POST','/api/keitaro/import', payload());
      if(!live()) return;
      startPoll();
    }catch(e){
      if(!live()) return;
      if(e&&e.status===409){
        toast(tr('kt.busy'), true);
        startPoll();
        return;
      }
      setRunBusy(false);
      toast(e.message, true);
    }
  };
  q('#kt-purge').onclick=()=>{
    if(!confirm(tr('kt.purge.confirm'))) return;
    const btn=q('#kt-purge');
    busy(btn, async()=>{
      try{
        const r=await call('POST','/api/keitaro/purge',{});
        if(!live()) return;
        dropCatalog();
        paintResult(r, true);
      }catch(e){
        if(!live()) return;
        toast(e.message,true);
      }
    });
  };
}
const PAGES={dashboard,flows,logs,conversions,report,keywords,lists,tools,networks,sources,offers,landings,domains,automation,settings:profile,keitaro:integrations,integrations};
