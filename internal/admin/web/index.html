  *{box-sizing:border-box}
  html{scrollbar-gutter:stable;background:var(--bg)}

   KuzTDS admin — a single embedded page, no build step.

   Layout: one top bar with the navigation; every page is full width and

const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};

// A missing file removes the image on error, so an unknown code leaves no broken icon.
const flag=(cc)=>{
  cc=String(cc||'').trim().toLowerCase();
  if(!/^[a-z]{2}$/.test(cc)) return '';
  return `<img class="flag" src="/assets/flags/${cc}.svg" alt="" width="18" height="12" loading="lazy" decoding="async" onerror="this.remove()">`;
};

const FMT_CACHE={};
/** fmt formats a count in the interface locale. The formatter is cached per language.
 * @param {number} n value to show

 */
function fmt(n){

  if(!f){f=new Intl.NumberFormat(uiLocale()); FMT_CACHE[lang]=f}
  return f.format(+n||0);

/** csvNum is a machine count for CSV: no grouping character.
 * @param {number} n value

function csvNum(n){

}
/** curKey is the key of a currency in a cents map; a record without a code is in USD.
 * @param {string} code currency code as stored, may be empty
 * @returns {string} upper-case code; USD for an empty one
 */
function curKey(code){
  const c=String(code==null?'':code).trim().toUpperCase();
  return c||'USD';
}
/** curSign is how a currency is written after an amount.
 * @param {string} code currency code, may be empty
 * @returns {string} $ for USD and for an empty code, otherwise the upper-case code

function curSign(code){
  const c=curKey(code);
  return c==='USD'?'$':c;
}
/** moneyUnits rounds an amount to whole minor units, halves away from zero, so a display and a CSV give the same digits.
 * @param {number} n amount; a non-number becomes 0
 * @param {number} d fraction digits of the minor unit
 * @returns {number} the amount times 10^d as an integer; never -0
 */
function moneyUnits(n, d){
  const v=Number(n);
  if(!Number.isFinite(v)) return 0;
  const a=Math.abs(v), txt=String(a);
  const m=Math.round(txt.indexOf('e')<0?Number(txt+'e'+d):a*Math.pow(10,d));
  return m===0?0:(v<0?-m:m);

/** moneyText formats a display amount with grouped digits and the currency after it.
 * @param {number} n amount; a non-number becomes 0
 * @param {string} code currency code; an empty code is USD
 * @param {number} [digits=2] fraction digits
 * @returns {string} e.g. 42,814.27 $, -120.50 $ or 1,234.50 EUR
 */
function moneyText(n, code, digits){
  const d=digits==null?2:digits;
  const v=moneyUnits(n, d)/Math.pow(10,d);

/** csvMoney is a machine amount for CSV: two decimals, no grouping and no currency.
 * @param {number} n amount; a non-number becomes 0
 * @returns {string} e.g. 1234.50
 */
function csvMoney(n){
  return (moneyUnits(n, 2)/100).toFixed(2);
}
/** plainMoney strips thousands separators from a display money string for CSV export.
 * @param {string} s formatted money text from moneyText, moneyMap, moneyOf, and similar helpers
 * @returns {string} the same text without grouping commas between digits

function plainMoney(s){

/** fetchOrNetErr is fetch that turns a network failure into the translated no-connection error.
 * @param {string} path request path
 * @param {object} o fetch options
 * @returns {Promise<Response>} the response; a rejected fetch (TypeError) throws Error with status 0 and no body, any other error is rethrown as is
 */
async function fetchOrNetErr(path,o){
  try{return await fetch(path,o)}
  catch(err){
    if(!(err instanceof TypeError)) throw err;
    const e=new Error(tr('err.network')); e.status=0; e.body=null; throw e;
  }
}
async function call(method,path,body){
  const o={method,credentials:'same-origin',headers:{}};
  if(method!=='GET'){o.headers['X-CSRF-Token']=CSRF;if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}}
  const r=await fetchOrNetErr(path,o);
  let j=null; try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=='/api/login'&&path!=='/api/me'){loginView();throw new Error('session expired')}
  if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;e.body=j;throw e}
  return j;
}
// callRaw sends a body that is not JSON, with the same session and CSRF header as call.
// method is the HTTP verb. path is the request path. body is sent as-is (bytes or text).
// contentType is the Content-Type header; an empty value omits the header.
// It returns the parsed JSON body, or null when the response is not JSON.
// A 401 opens the login screen and throws. Any other failed status throws Error with status.
async function callRaw(method,path,body,contentType){
  const o={method,credentials:'same-origin',headers:{}};
  if(method!=='GET'&&method!=='HEAD'){
    o.headers['X-CSRF-Token']=CSRF;
    if(contentType) o.headers['Content-Type']=contentType;
    if(body!==undefined) o.body=body;
  }
  const r=await fetchOrNetErr(path,o);
  let j=null; try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=='/api/login'&&path!=='/api/me'){loginView();throw new Error('session expired')}
  if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;e.body=j;throw e}
  return j;
}

/** loadUserPageViews fetches saved views after login and applies them before the first render.

  if(PAGE_VIEWS_USER!==user){
    resetPageViewsToDefaults();
    PAGE_VIEWS_USER=user;

  let views=null;
  for(let n=0;n<2&&views===null;n++){
    try{ views=await call('GET','/api/me/views'); }
    catch(e){ if(e.status!==0&&!(e.status>=500)) break; }

  const legacy=pageViewLegacy();

  try{localStorage.removeItem(RANGE_KEY)}catch(e){}
  syncHours();
  PAGE_VIEWS_LAST_SENT=JSON.stringify(collectPageViews(applyPageViews(views, defaultPageViewState())));
  PAGE_VIEWS_READY=true;
  if(!legacy.keys.length) return;
  const dropLegacy=()=>{ try{legacy.keys.forEach(k=>localStorage.removeItem(k))}catch(e){} };

  const snapshot=()=>JSON.stringify(collectPageViews(pageViewFromGlobals()));
  if(!PAGE_VIEWS_READY||PAGE_VIEWS_TIMER||Date.now()-PAGE_VIEWS_PULLED<PAGE_VIEWS_PULL_GAP) return Promise.resolve(false);
  if(snapshot()!==PAGE_VIEWS_LAST_SENT) return Promise.resolve(false);
  PAGE_VIEWS_PULLED=Date.now();
  const run=PAGE_VIEWS_QUEUE.then(async()=>{
    if(!PAGE_VIEWS_READY||PAGE_VIEWS_TIMER) return false;
    const before=snapshot();
    let views;
    try{ views=await call('GET','/api/me/views'); }
    catch(e){ return false; }
    const next=applyPageViews(views, defaultPageViewState());
    const server=JSON.stringify(collectPageViews(next));
    if(PAGE_VIEWS_TIMER||snapshot()!==before||pageViewsPull(before, PAGE_VIEWS_LAST_SENT, server)!=='apply') return false;
    applyPageViewSnapshot(next);
    syncHours();
    PAGE_VIEWS_LAST_SENT=server;
    paintChrome();
    if(pageViewsRepaintable()){ PERF=null; render(); }
    return true;
  }).catch(()=>false);
  PAGE_VIEWS_QUEUE=run;
  return run;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden') sendPageViewsOnHide();
  else pullPageViews();
});
addEventListener('focus', pullPageViews);

/* ---------- theme: light / dark, remembered per browser ---------- */
const THEME_KEY='kuztds-theme';
const ACCENT_KEY='kuztds-accent';
const ACCENTS=['violet','blue','green','graphite'];
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
/** currentAccent reads the chosen accent from the document, then from storage.
 * @return {string} an id from ACCENTS; violet when the stored value is missing or unknown. */
function currentAccent(){
  let id=document.documentElement.getAttribute('data-accent')||'';
  if(!id){try{id=localStorage.getItem(ACCENT_KEY)||''}catch(e){id=''}}
  return ACCENTS.includes(id)?id:'violet';
}
/** applyAccent remembers the accent and paints it. Violet is the default and drops the attribute.
 * @param {string} id accent id; anything outside ACCENTS becomes violet.
 * @return {void} */
function applyAccent(id){
  if(!ACCENTS.includes(id)) id='violet';
  try{localStorage.setItem(ACCENT_KEY,id)}catch(e){}
  if(id==='violet') document.documentElement.removeAttribute('data-accent');
  else document.documentElement.setAttribute('data-accent',id);
  themeChanged();
}
/** paintSwatches marks the swatch that matches the saved accent.
 * @return {void} */
function paintSwatches(){
  const cur=currentAccent();
  qa('[data-accent-pick]').forEach(b=>b.classList.toggle('on', b.dataset.accentPick===cur));
}
function toggleTheme(){
  const t=isDark()?'light':'dark';
  try{localStorage.setItem(THEME_KEY,t)}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  themeChanged();
}
function themeChanged(){
  qa('[data-theme-btn]').forEach(b=>{b.innerHTML=icon(isDark()?'sun':'moon');b.title=isDark()?tr('Light theme'):tr('Dark theme')});
  if(q('#chart'))drawChart(q('#chart'),CH.pts);
  drawWires();
  CODE_EDITORS.forEach(e=>e.setTheme());
}

function toast(msg,err){

// ask: a confirmation that matches the rest of the UI; resolves true / false.
function ask(title,text,okLabel,danger){
  return new Promise(res=>{
    const sc=$('<div class="scrim" style="z-index:74"></div>');
    const m=$(`<div class="modal" role="dialog"><h3>${esc(title)}</h3><p style="white-space:pre-line">${esc(text||'')}</p>
      <div class="row"><div class="spacer"></div><button data-no>${tr('Cancel')}</button><button data-yes class="${danger?'danger':'primary'}">${esc(okLabel||tr('OK'))}</button></div></div>`);
    const done=(v)=>{sc.remove();m.remove();document.removeEventListener('keydown',key,true);res(v)};
    const key=(e)=>{if(e.key==='Escape'){e.stopPropagation();done(false)}if(e.key==='Enter'){e.stopPropagation();done(true)}};
    sc.onclick=()=>done(false); q('[data-no]',m).onclick=()=>done(false); q('[data-yes]',m).onclick=()=>done(true);
    document.addEventListener('keydown',key,true);
    document.body.append(sc,m); q('[data-yes]',m).focus();
  });
}
/** bindFilePick accepts a dropped file on a file control and fires its change handler.
 * @param {Element|null} wrap the .filepick element that contains the file input.
 * @return {void} */
function bindFilePick(wrap){
  if(!wrap) return;
  const input=q('input[type=file]',wrap);
  if(!input) return;
  wrap.addEventListener('dragover',e=>{e.preventDefault(); wrap.classList.add('drag')});
  wrap.addEventListener('dragleave',e=>{if(e.relatedTarget&&wrap.contains(e.relatedTarget))return; wrap.classList.remove('drag')});
  wrap.addEventListener('drop',e=>{
    e.preventDefault();
    wrap.classList.remove('drag');
    const files=e.dataTransfer&&e.dataTransfer.files;
    if(!files||!files.length) return;
    try{
      const dt=new DataTransfer();
      const n=input.multiple?files.length:1;
      for(let i=0;i<n;i++) dt.items.add(files[i]);
      input.files=dt.files;
    }catch(err){return}
    input.dispatchEvent(new Event('change'));
  });
}
/** cropExport cuts the crop rectangle out of the source and encodes a logo.
 * @param {HTMLImageElement} img loaded source image.
 * @param {{x:number,y:number,w:number,h:number}} rect crop rectangle in canvas pixels.
 * @param {number} scale canvas pixels per source pixel.
 * @return {string|null} a png or jpeg data URL, or null when the result is still too large. */
function cropExport(img,rect,scale){
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  let sx=rect.x/scale, sy=rect.y/scale, sw=rect.w/scale, sh=rect.h/scale;
  if(sx<0){sw+=sx; sx=0}
  if(sy<0){sh+=sy; sy=0}
  if(sx+sw>iw) sw=iw-sx;
  if(sy+sh>ih) sh=ih-sy;
  if(!(sw>0)||!(sh>0)) return null;
  const k=Math.min(1,256/Math.max(sw,sh));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw*k));
  c.height=Math.max(1,Math.round(sh*k));
  const g=c.getContext('2d');
  if(!g) return null;
  g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  let url=c.toDataURL('image/png');
  if(url.length>270000){
    g.globalCompositeOperation='destination-over'; g.fillStyle='#ffffff'; g.fillRect(0,0,c.width,c.height);
    url=c.toDataURL('image/jpeg',.85);
  }
  if(url.length>270000){toast(tr('company.logo.big'),true); return null}
  return url;
}
/** cropRender clamps the crop rectangle inside the canvas and places the frame and handles.
 * @param {{cw:number,ch:number,x:number,y:number,w:number,h:number,square:boolean,box:Element,stage:Element}} state crop geometry in canvas pixels.
 * @return {void} */
function cropRender(state){
  const cw=state.cw, ch=state.ch, min=Math.min(16,cw,ch);
  let x=state.x, y=state.y, w=state.w, h=state.h;
  if(state.square){
    let s=Math.max(Math.min(w,h),min);
    s=Math.min(s,cw,ch);
    w=s; h=s;
  }else{
    w=Math.min(Math.max(w,min),cw);
    h=Math.min(Math.max(h,min),ch);
  }
  if(x<0) x=0;
  if(y<0) y=0;
  if(x+w>cw) x=Math.max(0,cw-w);
  if(y+h>ch) y=Math.max(0,ch-h);
  state.x=x; state.y=y; state.w=w; state.h=h;
  const view=state.stage.getBoundingClientRect();
  const kx=view.width>0?view.width/cw:1, ky=view.height>0?view.height/ch:1;
  const box=state.box;
  box.style.left=(x*kx)+'px';
  box.style.top=(y*ky)+'px';
  box.style.width=(w*kx)+'px';
  box.style.height=(h*ky)+'px';
}
/** cropImage opens a crop dialog for a logo data URL.
 * @param {string} dataURL image data URL from the file reader.
 * @param {boolean} keepAsIs when true the frame and the crop action stay hidden.
 * @return {Promise<string|null>} cropped data URL, the original, or null if cancelled. */
function cropImage(dataURL,keepAsIs){
  return new Promise(res=>{
    const sc=$('<div class="scrim" style="z-index:74"></div>');
    const body=keepAsIs
      ?`<p>${esc(tr('crop.svg'))}</p><img alt="" draggable="false" src="${esc(dataURL)}" style="max-width:100%;max-height:300px;display:block">`
      :`<div class="crop-stage"><canvas></canvas><div class="crop-box"><span class="crop-h h-nw" data-h="nw"></span><span class="crop-h h-ne" data-h="ne"></span><span class="crop-h h-sw" data-h="sw"></span><span class="crop-h h-se" data-h="se"></span></div></div><div class="vseg" style="margin-top:10px"><button type="button" data-ratio="free" class="on">${esc(tr('crop.free'))}</button><button type="button" data-ratio="1">${esc(tr('crop.square'))}</button></div>`;
    const apply=keepAsIs?'':`<button type="button" class="primary" data-apply>${esc(tr('crop.apply'))}</button>`;
    const m=$(`<div class="modal" role="dialog" style="width:min(560px,92vw)"><h3>${esc(tr('crop.title'))}</h3>${body}<div class="row"><div class="spacer"></div><button type="button" data-no>${tr('Cancel')}</button><button type="button" data-fit>${esc(tr('crop.fit'))}</button>${apply}</div></div>`);
    let dead=false, ro=null;
    const done=v=>{if(dead)return; dead=true; if(ro) ro.disconnect(); window.removeEventListener('hashchange',onHash); sc.remove(); m.remove(); document.removeEventListener('keydown',key,true); res(v)};
    const onHash=()=>done(null);
    const key=e=>{if(e.key==='Escape'){e.stopImmediatePropagation(); done(null)}};
    sc.onclick=()=>done(null);
    q('[data-no]',m).onclick=()=>done(null);
    q('[data-fit]',m).onclick=()=>done(dataURL);
    document.addEventListener('keydown',key,true);
    window.addEventListener('hashchange',onHash);
    document.body.append(sc,m);
    const first=q('[data-apply]',m)||q('[data-no]',m); if(first) first.focus();
    if(keepAsIs) return;
    const img=new Image();
    img.onload=()=>{
      if(dead) return;
      const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
      if(!iw||!ih){done(null); return}
      const fit=Math.min(480/iw,300/ih), cw=Math.max(1,Math.round(iw*fit)), ch=Math.max(1,Math.round(ih*fit));
      const cvs=q('canvas',m), stage=q('.crop-stage',m), ctx=cvs.getContext('2d');
      if(!ctx){done(null); return}
      cvs.width=cw; cvs.height=ch;
      ctx.drawImage(img,0,0,cw,ch);
      const inset=Math.min(14,Math.max(0,Math.floor((Math.min(cw,ch)-16)/2)));
      const st={scale:fit,cw,ch,x:inset,y:inset,w:cw-inset*2,h:ch-inset*2,square:false,box:q('.crop-box',m),stage};
      cropRender(st);
      ro=('ResizeObserver' in window)?new ResizeObserver(()=>cropRender(st)):null; if(ro) ro.observe(stage);
      let drag=null;
      const pt=e=>{const r=stage.getBoundingClientRect(); return {x:(e.clientX-r.left)*(cw/(r.width||1)), y:(e.clientY-r.top)*(ch/(r.height||1))}};
      stage.addEventListener('pointerdown',e=>{
        const h=e.target.closest('[data-h]');
        const mode=h?h.dataset.h:(e.target.closest('.crop-box')?'move':'');
        if(!mode) return;
        e.preventDefault();
        try{stage.setPointerCapture(e.pointerId)}catch(err){}
        const p=pt(e);
        drag={mode,px:p.x,py:p.y,x:st.x,y:st.y,w:st.w,h:st.h};
      });
      stage.addEventListener('pointermove',e=>{
        if(!drag) return;
        const p=pt(e), dx=p.x-drag.px, dy=p.y-drag.py;
        if(drag.mode==='move'){st.x=drag.x+dx; st.y=drag.y+dy}
        else{
          let L=drag.x, T=drag.y, R=drag.x+drag.w, B=drag.y+drag.h;
          if(drag.mode[0]==='n') T+=dy; else B+=dy;
          if(drag.mode[1]==='w') L+=dx; else R+=dx;
          if(st.square){const s=Math.max(Math.abs(R-L),Math.abs(B-T)); if(drag.mode[1]==='w') L=R-s; else R=L+s; if(drag.mode[0]==='n') T=B-s; else B=T+s}
          st.x=Math.min(L,R); st.y=Math.min(T,B); st.w=Math.abs(R-L); st.h=Math.abs(B-T);
        }
        cropRender(st);
      });
      const stop=()=>{drag=null};
      stage.addEventListener('pointerup',stop);
      stage.addEventListener('pointercancel',stop);
      qa('[data-ratio]',m).forEach(b=>b.onclick=()=>{
        st.square=b.dataset.ratio==='1';
        qa('[data-ratio]',m).forEach(x=>x.classList.toggle('on',x===b));
        if(st.square){const s=Math.min(st.w,st.h); st.w=s; st.h=s}
        cropRender(st);
      });
      q('[data-apply]',m).onclick=()=>done(cropExport(img,{x:st.x,y:st.y,w:st.w,h:st.h},st.scale));
    };
    img.onerror=()=>{if(!dead) done(null)};
    img.src=dataURL;
  });
}

const SPIN_TURN=500;
// busy spins a refresh button for the whole job and for at least one full turn.
// btn is the clicked button, or null. job is an async function; its return value is returned.
// A thrown error from job is rethrown after the turn finishes. It disables btn while it runs.
async function busy(btn, job){
  const t0=performance.now();
  const arm=(b)=>{if(b){b.classList.add('spin'); b.disabled=true}};
  const disarm=(b)=>{if(b){b.classList.remove('spin'); b.disabled=false}};
  const find=()=>{
    if(btn&&btn.isConnected) return btn;
    if(btn&&btn.id) return q('#'+btn.id);
    const k=btn&&btn.getAttribute&&btn.getAttribute('data-col-refresh');
    return k?q('[data-col-refresh="'+k+'"]'):null;
  };
  arm(btn);
  let result, err;
  try{result=await job()}
  catch(e){err=e}
  const left=SPIN_TURN-(performance.now()-t0);
  arm(find());
  if(left>16) await new Promise(r=>setTimeout(r, left));
  disarm(find());
  if(btn&&btn.isConnected) disarm(btn);
  if(err) throw err;
  return result;
}

/* ---------- drafts and the save bar ---------- */
let GROUPS=null;
// SNAP remembers each campaign object as last saved: {id, json}.
// DIRTY holds campaign objects that differ from SNAP. DELETED holds saved ids
// removed locally. ORDER_DIRTY is set when the array order is not what a
// per-id upsert would produce (a duplicate inserted before the end).
const SNAP=new Map();
const DIRTY=new Set();
const DELETED=new Set();
let ORDER_DIRTY=false;
let CRON=null, CRON_SAVED='';         // automation: working copy / last saved
const flowsDirty=()=>DIRTY.size>0||DELETED.size>0||ORDER_DIRTY||IP_DRAFT!=null;
const cronDirty=()=>CRON!==null&&JSON.stringify(CRON)!==CRON_SAVED;
const anyDirty=()=>flowsDirty()||cronDirty();
/** snapshotGroups stores every loaded campaign and clears the dirty flags.
 * @return {void} */
function snapshotGroups(){
  SNAP.clear(); DIRTY.clear(); DELETED.clear(); ORDER_DIRTY=false;
  (GROUPS||[]).forEach(g=>SNAP.set(g,{id:g.id,json:JSON.stringify(g)}));
}
/** markDirty records campaigns whose JSON differs from the snapshot.
 * g is one campaign, or an array of them. No argument only refreshes the save bar (automation).
 * A campaign equal to its snapshot leaves DIRTY. A new one, or a changed one, enters DIRTY.
 * @param {object|object[]} [g]
 * @return {void} */
function markDirty(g){
  if(g!=null){
    const list=Array.isArray(g)?g:[g];
    for(const x of list){
      if(!x||typeof x!=='object') continue;
      const prev=SNAP.get(x);
      const json=JSON.stringify(x);
      if(prev&&prev.json===json) DIRTY.delete(x);
      else DIRTY.add(x);
    }
  }
  syncSaveBar();
}
/** forgetGroup drops a campaign from the working sets.
 * A campaign that was loaded is remembered in DELETED by its saved id.
 * g is the campaign object. It returns nothing.
 * @param {object} g
 * @return {void} */
function forgetGroup(g){
  const prev=SNAP.get(g);
  if(prev) DELETED.add(prev.id);
  DIRTY.delete(g);
  SNAP.delete(g);
}
/** restoreGroup puts one dirty campaign back, or removes it when it was never saved.
 * g is the campaign object. It returns nothing. A broken snapshot throws from JSON.parse.
 * @param {object} g
 * @return {void} */
function restoreGroup(g){
  const prev=SNAP.get(g);
  if(!prev){
    if(GROUPS){const i=GROUPS.indexOf(g); if(i>=0) GROUPS.splice(i,1)}
    return;
  }
  const fresh=JSON.parse(prev.json);
  Object.keys(g).forEach(k=>{if(!Object.prototype.hasOwnProperty.call(fresh,k)) delete g[k]});
  Object.assign(g, fresh);
}
function syncSaveBar(){
  let bar=q('#savebar');
  if(!anyDirty()){if(bar)bar.remove();return}
  const what=[flowsDirty()?capFirst(tr('flows')):'',cronDirty()?capFirst(tr('automation')):''].filter(Boolean).join(' '+tr('and')+' ');
  if(!bar){
    bar=$(`<div class="savebar" id="savebar"><span class="dot warn"></span><span id="dirty"></span>
      <button class="discard" id="discard"></button><button class="primary" id="saveall"></button></div>`);
    document.body.appendChild(bar);
    q('#saveall',bar).onclick=saveAll;
    q('#discard',bar).onclick=async()=>{
      if(!await ask(tr('Discard changes?'),tr('Everything changed since the last save will be lost.'),tr('Discard'),true))return;
      if(flowsDirty()){
        if(DELETED.size||ORDER_DIRTY){
          const prev=GROUPS;
          GROUPS=null;
          try{await ensureGroups()}
          catch(e){GROUPS=prev; toast(e.message,true); return}
        }else{
          for(const g of [...DIRTY]) restoreGroup(g);
        }
        DIRTY.clear(); DELETED.clear(); ORDER_DIRTY=false;
        IP_DRAFT=null; IP_PENDING=false; IP_REQ=''; IP_TEXT=false;
      }
      if(cronDirty())CRON=JSON.parse(CRON_SAVED);
      closeDrawer(); syncSaveBar(); render();
    };
  }
  q('#discard',bar).textContent=tr('Discard');
  const block=flowsDirty()?saveBlock():'', saveBtn=q('#saveall',bar);
  saveBtn.innerHTML=tr('Save')+'<kbd>⌘S</kbd>';
  saveBtn.disabled=!!block&&!cronDirty();
  saveBtn.title=block;
  q('#dirty',bar).textContent=block||(tr('Unsaved changes in ')+what);
}
async function saveAll(){
  if(DRAWER&&DRAWER.commit){
    const touched=DRAWER.commit();
    if(touched) markDirty(touched);
  }

  try{
    if(flowsDirty()&&!block)await saveFlows();
    if(cronDirty())await saveCron();
    if(block) toast(block,true); else toast(tr('Saved'));
  }catch(e){toast(e.message,true)}

}

/** errText is the text of a failed request: translated when the server message is a known one.
 * @param {Error|string} e error thrown by call, or a message
 * @param {boolean} [registrar] true to know the Namecheap and registrar-settings texts as well
 * @returns {string} text for a toast
 */
function errText(e, registrar){
  const m=e&&e.message!=null?e.message:String(e);
  const info=errInfo(m, !!registrar);
  if(!info) return m;
  const vars=Object.assign({}, info.vars);
  if(vars.field){const f=NC_CONTACT_FIELDS.find(x=>x[0]===vars.field); if(f) vars.field=tr(f[1])}
  if(vars.fld) vars.fld=hideLabel(vars.fld);
  if(vars.inner) vars.inner=errText(vars.inner, registrar);
  return trFill(info.key, vars);
}

 * @param {Error|string} e error thrown by call, or a message

}

/** KT_DOCK_KEY is the localStorage key of the Keitaro progress window position; KT_DOCK_COUNTED lists the stages whose done/total is a real count. */
const KT_DOCK_KEY='kuztds-ktdock';
const KT_DOCK_COUNTED=['streams','clicks','conversions'];
const KT_DOCK_BUSY_MS=3000, KT_DOCK_IDLE_MS=30000, KT_DOCK_GAP=16, KT_DOCK_TOP=64;
/** KT_DOCK is the progress window state: poll generation and timer, the element, the saved position,
 * the last job, whether a run was seen running in this session, and the started_at of the run the user closed. */
const KT_DOCK={gen:0, timer:0, on:false, el:null, pos:null, job:null, seen:false, dismissed:null};
/** ktDockSaved reads the stored window position.
 * @returns {{x:number,y:number}|null} left/top in pixels, or null when nothing valid is stored */
function ktDockSaved(){
  try{
    const v=JSON.parse(localStorage.getItem(KT_DOCK_KEY)||'null');
    if(v&&Number.isFinite(v.x)&&Number.isFinite(v.y)) return {x:v.x, y:v.y};
  }catch(e){}
  return null;
}
/** ktDockClamp keeps the window inside the viewport.
 * @param {number} x wanted left
 * @param {number} y wanted top
 * @param {Element} el the window, measured for its size
 * @returns {{x:number,y:number}} left/top in pixels, at least 8 from each edge when the viewport allows */
function ktDockClamp(x,y,el){
  const m=8, w=el.offsetWidth, h=el.offsetHeight;
  return {x:Math.round(Math.max(m,Math.min(x,innerWidth-w-m))), y:Math.round(Math.max(m,Math.min(y,innerHeight-h-m)))};
}
/** ktDockPlace puts the window at its stored position, or at the top right, clamped to the viewport.
 * @param {Element} el the visible window
 * @returns {void} */
function ktDockPlace(el){

  const p=KT_DOCK.pos;
  const pos=ktDockClamp(p?p.x:innerWidth-el.offsetWidth-KT_DOCK_GAP, p?p.y:KT_DOCK_TOP, el);

/** ktDockDrag lets the header move the window; the new position is stored on release.
 * @param {Element} el the window
 * @param {Element} handle the header that starts the drag
 * @returns {void} */
function ktDockDrag(el,handle){
  handle.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('button,a')) return;
    const r=el.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
    handle.setPointerCapture(e.pointerId);
    const move=ev=>{
      const p=ktDockClamp(ev.clientX-dx, ev.clientY-dy, el);
      KT_DOCK.pos=p; el.style.left=p.x+'px'; el.style.top=p.y+'px';
    };
    const up=()=>{
      handle.removeEventListener('pointermove',move);
      handle.removeEventListener('pointerup',up);
      handle.removeEventListener('pointercancel',up);
      if(KT_DOCK.pos) try{localStorage.setItem(KT_DOCK_KEY,JSON.stringify(KT_DOCK.pos))}catch(err){}
    };
    handle.addEventListener('pointermove',move);
    handle.addEventListener('pointerup',up);
    handle.addEventListener('pointercancel',up);
    e.preventDefault();
  });
}

 * @param {object} job GET /api/keitaro/job answer
 * @returns {number|null} 0..100 for the streams, clicks and conversions stages with a total; null otherwise */
function ktDockPercent(job){

function paintFlags(root){
  if(!root) return;
  const skip=new Set(['INPUT','TEXTAREA','CODE','SCRIPT','STYLE','OPTION','SELECT']);
  const list=[];
  const walk=n=>{
    if(!n) return;
    if(n.nodeType===3){ if(/[\uD83C][\uDDE6-\uDDFF]/.test(n.nodeValue||'')) list.push(n); return }
    if(n.nodeType!==1||skip.has(n.tagName)) return;
    for(const c of n.childNodes) walk(c);
  };
  walk(root);
  for(const n of list){
    const s=n.nodeValue, frag=document.createDocumentFragment();
    let i=0, plain='';
    while(i<s.length){
      const a=s.codePointAt(i), b=s.codePointAt(i+2);
      if(a>=0x1F1E6&&a<=0x1F1FF&&b>=0x1F1E6&&b<=0x1F1FF){
        if(plain){frag.append(document.createTextNode(plain)); plain=''}
        const code=String.fromCharCode(a-0x1F1E6+65, b-0x1F1E6+65).toLowerCase();
        const hold=document.createElement('span');
        hold.className='flag';
        hold.innerHTML=flag(code);
        while(hold.firstChild) frag.append(hold.firstChild);
        i+=4;
      }else{plain+=s[i]; i++}
    }
    if(plain) frag.append(document.createTextNode(plain));
    n.replaceWith(frag);
  }
}

  for(const r of rows){

    let list=map.get(id);
    if(!list){list=[]; map.set(id,list)}
    list.push(row);
  };

  for(const r of FACTS.status) put(status,r);

function campaignMoney(by){return moneyMap(by)}
/** costCode picks the one currency of a cents map.

/** spendBasis tells whether spend can be set against revenue. Revenue is always in USD, so only spend in USD can.

function cpcHasSpend(m){

function periodSpendRev(){

/**

/**
 * paintServerPager fills a dock pager: newer, older, page size and the range.
 * A new page size is handed to setPageSize and then saved with the account's page views.
 * @param {Element|null} box pager container
 * @param {{prefix?:string,total:number,pageSize:number,pageIndex:number,setPageIndex?:function,setPageSize?:function,onReload:function}} cfg pager state and callbacks
 * @returns {void}
 */
function paintServerPager(box, cfg){
  if(!box||!cfg||typeof cfg.onReload!=='function') return;
  const pfx=cfg.prefix||'pg';
  const total=Math.max(0, +cfg.total||0);
  const pageSize=Math.max(1, +cfg.pageSize||50);
  let pageIndex=Math.max(0, +cfg.pageIndex||0);
  const pages=Math.max(1, Math.ceil(total/pageSize)||1);
  if(pageIndex>=pages) pageIndex=pages-1;
  if(pageIndex<0) pageIndex=0;
  if(typeof cfg.setPageIndex==='function'&&pageIndex!==cfg.pageIndex) cfg.setPageIndex(pageIndex);
  const from=total?pageIndex*pageSize+1:0;
  const to=Math.min(total, (pageIndex+1)*pageSize);
  const custom=!FLOW_PRESETS.includes(pageSize);
  const opts=FLOW_PRESETS.map(k=>`<option value="${k}"${!custom&&pageSize===k?' selected':''}>${k}</option>`).join('');
  box.innerHTML=`<button type="button" class="icon sm" id="${pfx}prev" title="${tr('Newer')}" aria-label="${tr('Newer')}" ${pageIndex<=0?'disabled':''}>${icon('back')}</button>
    <button type="button" class="icon sm" id="${pfx}next" title="${tr('Older')}" aria-label="${tr('Older')}" ${pageIndex>=pages-1?'disabled':''}>${icon('arrow')}</button>
    <label class="hint">${tr('flows.page')}</label><select id="${pfx}size">${opts}<option value="custom"${custom?' selected':''}>${tr('flows.page.custom')}</option></select><input id="${pfx}size-n" type="number" min="1" max="1000" value="${pageSize}" style="width:72px"${custom?'':' hidden'}>
    <span class="hint">${fmt(from)}–${fmt(to)} ${tr('of')} ${fmt(total)}</span>`;
  q(`#${pfx}prev`,box).onclick=()=>{if(pageIndex>0&&typeof cfg.setPageIndex==='function'){cfg.setPageIndex(pageIndex-1); cfg.onReload()}};
  q(`#${pfx}next`,box).onclick=()=>{if(pageIndex<pages-1&&typeof cfg.setPageIndex==='function'){cfg.setPageIndex(pageIndex+1); cfg.onReload()}};
  q(`#${pfx}size`,box).onchange=e=>{
    const num=q(`#${pfx}size-n`,box);
    if(e.target.value==='custom'){num.hidden=false; num.focus(); return}
    num.hidden=true;
    const v=+e.target.value;
    if(typeof cfg.setPageSize==='function') cfg.setPageSize(v);
    if(typeof cfg.setPageIndex==='function') cfg.setPageIndex(0);
    touchPageViews();
    num.value=v; cfg.onReload();
  };
  q(`#${pfx}size-n`,box).onchange=e=>{
    let v=+e.target.value; if(!(v>=1)) v=50; if(v>1000) v=1000;
    e.target.value=v;
    if(typeof cfg.setPageSize==='function') cfg.setPageSize(v);
    if(typeof cfg.setPageIndex==='function') cfg.setPageIndex(0);
    touchPageViews();
    cfg.onReload();
  };
}
/**

/**
 * applySort returns a sorted copy. Names use compareNameKeys; dates sort by time; text uses localeCompare; other columns use numeric order.
 * @param {Array} rows source rows
 * @param {{k:string,dir:number}} state column id and direction
 * @param {function} valueOf (row, columnId) => sort value
 * @param {Set<string>|string[]|object} meta text/name/date column sets
 * @returns {Array} sorted copy; the input array is left unchanged
 */
function applySort(rows, state, valueOf, meta){
  const list=Array.isArray(rows)?rows.slice():[];
  const k=state&&state.k;
  if(!k||typeof valueOf!=='function') return list;
  const sm=asSortMeta(meta);
  const dir=(state.dir||1)<0?-1:1;
  const asName=sm.name.has(k);
  const asDate=sm.date.has(k);
  const asText=sm.text.has(k)&&!asName&&!asDate;
  const nameKeys=asName?new Map(list.map(r=>[r,nameKey(valueOf(r,k))])):null;
  list.sort((a,b)=>{
    const va=valueOf(a,k), vb=valueOf(b,k);
    const sa=String(va==null?'':va), sb=String(vb==null?'':vb);
    if(asName) return compareNameKeys(nameKeys.get(a),nameKeys.get(b),dir);
    if(asDate){
      const ta=+new Date(va)||0, tb=+new Date(vb)||0;
      if(ta!==tb) return (ta-tb)*dir;
      return sa.localeCompare(sb)*dir;

    if(asText) return sa.localeCompare(sb)*dir;
    const na=+va||0, nb=+vb||0;
    if(na!==nb) return (na-nb)*dir;
    return sa.localeCompare(sb)*dir;
  });
  return list;
}

function openSpend(){
  const by={}, rows=[];
  for(const e of SPEND||[]){
    const share=spendShare(e);
    if(share<=0) continue;
    rows.push(e);
    const cur=curKey(e.currency);
    by[cur]=(by[cur]||0)+(e.cents||0)*share;
  }
  addBy(by, clickCostBy());
  const cc=costCode(by);
  return {rows, by, keys:Object.keys(by), code:cc.code, cost:cc.amount, multi:cc.multi};
}
/** pointSpendBy sums the spend that falls on one chart point, per currency.
 * @param {Array<{currency:string,cents:number,from:string,to:string}>} rows manual spend windows
 * @param {Object<string,number>|null} click click prices of the point, cents by currency
 * @param {number} start point start in ms
 * @param {number} end point end in ms
 * @returns {Object<string,number>} positive cents by currency; '' and USD are one currency
 */
function pointSpendBy(rows, click, start, end){
  const by={};
  for(const e of rows||[]){
    const cents=(e.cents||0)*overlapShare(+new Date(e.from), +new Date(e.to), start, end);
    if(!(cents>0)) continue;
    const k=curKey(e.currency);
    by[k]=(by[k]||0)+cents;
  }
  return addBy(by, click);
}
/** pointMoney writes the spend, profit and ROI of one chart point for its tooltip.

 * @param {object} p chart point from annotateChart
 * @param {boolean} money true when the chart shows all spend in USD
 * @param {string} cur currency code of the money axis
 * @param {boolean} ready true when revenue is loaded
 * @returns {{cost:string,profit:string,roi:(string|null)}} roi is null when the caller picks it
 */
function pointMoney(p, money, cur, ready){
  if(money) return {cost:moneyText(p.cost==null?0:p.cost, cur, 2), profit:moneyText(p.profit==null?0:p.profit, cur, 2), roi:null};
  const rev=ready?(+p.revenue||0):0;
  return {cost:moneyMap(p.costBy, 2), profit:profitList(rev, p.costBy, 2), roi:metricROI(rev, p.costBy, ready)};

function annotateChart(raw){
  const ready=!!FACTS.ready;
  const spend=openSpend();
  const moneyAxis=!spendBasis(spend.by).mixed;
  const cur=moneyAxis?'USD':'';
  const step=raw.length>1?(+new Date(raw[1].ts)-+new Date(raw[0].ts)):(HOURS>48?86400000:3600000);
  const rows=raw.map((p,i)=>{
    const start=new Date(p.ts);
    const end=raw[i+1]?new Date(raw[i+1].ts):new Date(+start+(step>0?step:3600000));
    const costBy=pointSpendBy(spend.rows, p.cost, +start, +end);
    const cost=moneyAxis?(costBy.USD||0)/100:null;
    const revenue=ready?(+p.revenue||0):null;
    const conv=ready?+p.conv||0:null;
    const profit=moneyAxis&&ready&&revenue!=null&&cost!=null?revenue-cost:null;
    const cr=ready?ratioPct(conv,+p.total||0):null;
    const roi=moneyAxis&&ready&&cost>0?roiPct(revenue,cost):null;
    return {ts:p.ts,total:+p.total||0,unique:+p.unique||0,bots:+p.bots||0,conv,revenue,cost,profit,cr,roi,costBy};
  });
  return {rows, cur, ready, spend, moneyAxis};
}

// Performance rows folded into config order: flow → its streams, the fallback
// ("-": no stream matched) last, then flows that exist only in the data.
function perfTree(groups){
  const nodes=new Map(), order=[];
  groups.forEach(g=>{const n={id:g.id,name:g.name||'',known:true,order:(g.streams||[]).map(s=>s.name),streams:new Map()};nodes.set('id:'+g.id,n);order.push(n)});
  const byName=(r)=>order.find(n=>n.known&&n.name===r.group)||null;
  (DASH_PERF||PERF||[]).forEach(r=>{
    let n=r.group_id?nodes.get('id:'+r.group_id):byName(r);
    if(!n){const k=r.group_id?'id:'+r.group_id:'nm:'+r.group;n=nodes.get(k);
      if(!n){n={id:r.group_id||r.group||'(unknown)',name:r.group_id?r.group:'',known:false,order:[],streams:new Map()};nodes.set(k,n);order.push(n)}}
    n.streams.set(r.stream,add(n.streams.get(r.stream)||Object.assign(zero(),{stream:r.stream}),r));
  });
  return order.map(n=>{const rows=[...n.streams.values()];return {...n,rows,tot:rows.reduce(add,zero())}}).filter(n=>n.rows.length);
}
function perfSorted(groups){
  const tree=perfTree(groups), {k,d}=PSORT;

function download(name,text,type){

/**
 * fetchExport downloads a CSV (or binary) export and shows truncation warnings.
 * @param {string} path absolute or root-relative export URL
 * @param {Element|null} [btn] button to disable for the duration
 * @returns {Promise<void>}
 */
async function fetchExport(path, btn){
  if(btn) btn.disabled=true;
  let url='';
  try{
    const r=await fetch(path, {credentials:'same-origin'});
    if(r.status===401){ loginView(); throw new Error('session expired'); }
    if(!r.ok){
      let msg='HTTP '+r.status;
      try{const j=await r.json(); if(j&&j.error) msg=j.error;}catch(e){}
      throw new Error(msg);
    }
    const truncated=r.headers.get('X-Export-Truncated')==='1';
    const blob=await r.blob();
    let name='export.csv';
    const cd=r.headers.get('Content-Disposition')||'';
    const m=/filename\*=UTF-8''([^;]+)|filename="([^"]+)"/i.exec(cd);
    if(m) name=decodeURIComponent((m[1]||m[2]||'export.csv').replace(/"/g,''));
    url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    if(truncated) toast(tr('export.truncated'));
  }catch(e){
    toast(e.message||tr('ui.fail'), true);
  }finally{
    if(url) URL.revokeObjectURL(url);
    if(btn) btn.disabled=false;
  }
}

function cssVar(k){return getComputedStyle(document.documentElement).getPropertyValue(k).trim()}
/**
 * Paints the dashboard chart. Counts take the left axis; percents take it only when no count series is visible. Money takes the right axis. Percent series are a stroke with no fill. An isolated point is drawn as a dot.
 * @param {HTMLCanvasElement} cv canvas; nothing is drawn when it is missing
 * @param {object[]} pts points for the period; a null field is a gap
 * @param {number|null} hover index of the point under the pointer
 * @returns {void}

function drawChart(cv,pts,hover){
  if(!cv)return; pts=pts||[];
  const cur=CH.cur||'', ready=!!CH.ready, money=!!CH.moneyAxis;
  const c={grid:cssVar('--border'),text:cssVar('--muted'),ring:cssVar('--surface')};
  CH_SERIES.forEach(s=>{c[s.color]=cssVar('--chart-'+s.color)});
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||600, H=260;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  if(!pts.length){CH={pts:[],x:[],cur,ready,moneyAxis:money};g.fillStyle=c.text;g.font='13px system-ui,sans-serif';g.fillText(tr('No data for the period'),12,24);return}
  const hideM=hiddenCols(ME);
  const vis=CH_SERIES.filter(s=>!CH_HIDE.has(s.id)&&!hideM.has(s.id)&&(s.axis!=='m'||money)&&pts.some(p=>p[s.id]!=null&&!Number.isNaN(+p[s.id])));
  const N=vis.filter(s=>s.axis==='n'), M=vis.filter(s=>s.axis==='m'), P=vis.filter(s=>s.axis==='p');
  const range=list=>{let lo=Infinity,hi=-Infinity; pts.forEach(p=>list.forEach(s=>{const v=p[s.id]; if(v==null||Number.isNaN(+v)) return; lo=Math.min(lo,+v); hi=Math.max(hi,+v)})); return lo===Infinity?{lo:0,hi:0}:{lo,hi}};
  const sN=N.length?axisScale(0,range(N).hi,true):null;
  const sM=M.length?(r=>axisScale(r.lo,r.hi,false))(range(M)):null;
  const sP=P.length?(r=>axisScale(Math.min(0,r.lo), P.some(s=>s.id==='roi')?Math.max(100,r.hi):r.hi, false))(range(P)):null;
  const sL=sN||sP;
  g.font='11px system-ui,sans-serif';
  const lab=v=>sN?fmt(v):(v+'%');
  const rightLab=v=>moneyText(v,cur,sM?tickDecimals(sM.step):2);
  const maxWidth=ts=>ts.reduce((m,t)=>Math.max(m,Math.ceil(g.measureText(String(t)).width)),0);
  const L=sL?maxWidth(sL.ticks.map(lab))+16:12;
  const R=sM?maxWidth(sM.ticks.map(rightLab))+16:12;
  const T=14,B=26,w=W-L-R,h=H-T-B;
  const x=i=>L+(pts.length<2?w/2:i/(pts.length-1)*w);
  const yOf=sc=>v=>T+h-((+v||0)-sc.lo)/(sc.hi-sc.lo)*h;
  const scaleOf=s=>s.axis==='n'?sN:s.axis==='m'?sM:sP;
  CH={pts,x:pts.map((_,i)=>x(i)),cur,ready,moneyAxis:money};
  const gridScale=sL||sM;
  g.strokeStyle=c.grid;g.lineWidth=1;g.fillStyle=c.text;g.font='11px system-ui,sans-serif';
  if(gridScale){
    gridScale.ticks.forEach(v=>{const yy=yOf(gridScale)(v);g.beginPath();g.moveTo(L,yy);g.lineTo(L+w,yy);g.stroke()});
    if(sL){g.textAlign='right'; sL.ticks.forEach(v=>g.fillText(lab(v),L-8,yOf(sL)(v)+4))}
    if(sM){g.textAlign='left'; sM.ticks.forEach(v=>g.fillText(rightLab(v),L+w+6,yOf(sM)(v)+4))}
  }
  const gap=pts.length>1?(+new Date(pts[1].ts)-+new Date(pts[0].ts)):0;
  const daily=gap>=20*3600000||(!gap&&HOURS>48);
  const gapH=Math.max(1,Math.round((gap||3600000)/3600000));
  const withTZ=o=>{try{o.timeZone=uiTz()}catch(e){} return o};
  const dateText=d=>d.toLocaleDateString(uiLocale(),withTZ({month:'short',day:'numeric'}));
  const timeText=d=>d.toLocaleTimeString(uiLocale(),withTZ({hour:'2-digit',minute:'2-digit'}));
  const localHM=d=>{let hp; try{hp=zonedParts(d,uiTz())}catch(e){hp=null} return {h:hp?hp.h:d.getHours(), min:hp?hp.min:d.getMinutes()}};
  const sample=new Date(pts[0].ts);
  const labelPx=Math.max(g.measureText(dateText(sample)).width, g.measureText(timeText(sample)).width)+10;
  const tickText=d=>{
    if(daily) return dateText(d);
    const hm=localHM(d);
    if(hm.h===0&&hm.min===0) return d.toLocaleDateString(uiLocale(),withTZ({day:'numeric',month:'short'}));
    return timeText(d);
  };
  let idxs;
  if(daily){
    const step=tickEvery(pts.length,w,labelPx,[1,2,7,14,30]);
    idxs=pts.map((_,i)=>i).filter(i=>i%step===0);
  }else{
    const step=tickEvery(pts.length,w,labelPx,[1,2,3,4,6,12,24]);
    const mod=step*gapH;
    idxs=[];
    pts.forEach((p,i)=>{const hm=localHM(new Date(p.ts)); if(hm.h%mod===0&&hm.min===0) idxs.push(i)});
    if(!idxs.length) idxs=pts.map((_,i)=>i).filter(i=>i%step===0);
  }
  g.fillStyle=c.text; g.font='11px system-ui,sans-serif'; g.textAlign='left';
  let lastRight=-Infinity;
  idxs.forEach(i=>{
    const text=tickText(new Date(pts[i].ts));
    const tw=g.measureText(text).width;
    const lx=Math.max(2,Math.min(W-2-tw, x(i)-tw/2));
    if(lx>lastRight+4){g.fillText(text,lx,H-8); lastRight=lx+tw}
  });

    g.beginPath(); g.strokeStyle=color; g.lineWidth=2; g.lineJoin='round'; g.setLineDash(dash||[]);
    let pen=false;
    pts.forEach((p,i)=>{
      const v=p[key];
      if(v==null||Number.isNaN(+v)){pen=false;return}
      const X=x(i), Y=yOf(+v);
      if(!pen){g.moveTo(X,Y);pen=true} else g.lineTo(X,Y);

    const nb=j=>j<0||j>=pts.length?null:pts[j][key];
    pts.forEach((p,i)=>{
      const v=p[key];
      if(nil(v)||!nil(nb(i-1))||!nil(nb(i+1))) return;

    });
  };
  const fillUnder=(key,yOf,color,baseY)=>{
    const grd=g.createLinearGradient(0,T,0,T+h);grd.addColorStop(0,color+'40');grd.addColorStop(1,color+'05');
    g.beginPath();
    let started=false, firstI=0, lastI=0;
    pts.forEach((p,i)=>{
      const v=p[key];
      if(v==null||Number.isNaN(+v)) return;
      if(!started){g.moveTo(x(i),yOf(+v));firstI=i;started=true}else g.lineTo(x(i),yOf(+v));
      lastI=i;
    });
    if(!started) return;
    g.lineTo(x(lastI),baseY);g.lineTo(x(firstI),baseY);g.closePath();g.fillStyle=grd;g.fill();
  };
  vis.forEach(s=>{
    const y=yOf(scaleOf(s));
    if(s.axis==='n'||s.axis==='m') fillUnder(s.id,y,c[s.color],y(0));
    stroke(s.id,y,c[s.color],s.dash);
  });
  if(hover!=null&&pts[hover]){
    const X=x(hover);g.strokeStyle=c.grid;g.lineWidth=1;g.setLineDash([]);g.beginPath();g.moveTo(X,T);g.lineTo(X,T+h);g.stroke();
    vis.forEach(s=>{
      if(pts[hover][s.id]==null||Number.isNaN(+pts[hover][s.id])) return;
      const Y=yOf(scaleOf(s))(+pts[hover][s.id]);
      g.beginPath();g.arc(X,Y,4,0,7);g.fillStyle=c[s.color];g.fill();g.strokeStyle=c.ring;g.lineWidth=2;g.stroke();
    });
  }
}

/* ==================================================================
   FLOWS — a flow (a group in the config) is an ordered list of streams.
   A stream is a rule: WHEN (conditions) → THEN (destination). The engine
   tries them top to bottom and the first match wins; what matches nothing
   gets the flow's default.

   The flow page draws exactly that: visitors enter at the top and fall
   down a trunk; each stream is a branch off it to a destination, and the
   trunk ends in the default. Line widths follow the traffic of the
   selected period, so the picture is also the report. Streams are
   reordered by dragging; a stream can also send visitors on to another
   flow.
   ================================================================== */

/**
 * Builds the browser tab title from brand and page parts.
 * @param {boolean} known true after the brand payload was applied
 * @param {string} name company name
 * @param {string} label localized page title
 * @returns {string} title text without a default product name
 */
function titleText(known, name, label){
  if(!known) return '';
  const n=String(name||'').trim();
  const l=String(label||'').trim();
  if(n&&l) return n+' - '+l;
  if(n) return n;
  if(l) return l;
  return '';
}
// Stored values ↔ what a person reads and edits. Nothing here touches the
// page: web_logic_test.go runs this block under node.
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK=[1,2,3,4,5,6,0];   // shown Monday first; the config is indexed by weekday
const DIST={random:'at random',rotator:'in turn per visitor',evenly:'evenly in turn'};

// A typed or pasted list: commas, new lines and "|" all separate values.
// Repeats are dropped — in any letter case unless cs (case-sensitive) is set.
function splitList(s,cs){return uniq(String(s==null?'':s).split(/[,|\n]/).map(x=>x.trim()).filter(Boolean),cs)}
function uniq(a,cs){const seen=new Set();return a.filter(x=>{const k=cs?String(x):String(x).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
/** ipEntries splits addresses on newlines, commas, semicolons and spaces.
 * text is a textarea or an old file field. A range or a prefix stays one entry.
 * Empties are dropped. A repeat in any letter case is dropped after the first. Order is kept.
 * @param {string} text raw list
 * @returns {string[]} entries
 */
function ipEntries(text){
  const seen=new Set(), out=[];
  String(text==null?'':text).split(/[\s,;]+/).forEach(raw=>{
    const v=raw.trim();
    if(!v) return;
    const k=v.toLowerCase();
    if(seen.has(k)) return;
    seen.add(k);
    out.push(v);
  });
  return out;
}
const sameList=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);

// A /pattern/flags made of nothing but plain alternatives — /amazon|ovh/i —
// reads as a list of words. Anything more (anchors, classes, groups, repeats,
// an empty alternative) is a real expression and gives null.
function altWords(raw){
  const m=/^\/([\s\S]*)\/([a-z]*)$/.exec(String(raw==null?'':raw).trim());
  if(!m||!m[1])return null;
  const p=m[1], words=[]; let w='';
  for(let i=0;i<p.length;i++){
    const ch=p[i];
    if(ch==='\\'){const nx=p[i+1];if(nx===undefined||/[A-Za-z0-9]/.test(nx))return null;w+=nx;i++;continue}
    if(ch==='|'){if(!w.trim())return null;words.push(w);w='';continue}
    if('.+*?()[]{}^$'.includes(ch))return null;
    w+=ch;
  }
  if(!w.trim())return null;
  words.push(w);

function findCountries(q){
  q=String(q||'').trim().toLowerCase();
  if(!q) return [];
  const hits=COUNTRIES.filter(c=>c.code===q || c.en.toLowerCase().includes(q) || c.ru.toLowerCase().includes(q) || c.uk.toLowerCase().includes(q));
  hits.sort((a,b)=>(a.code===q?0:1)-(b.code===q?0:1) || a.en.localeCompare(b.en));
  return hits.slice(0,12);
}
function countryLabel(code, lang){
  const c=COUNTRIES.find(x=>x.code===String(code||'').toLowerCase());
  if(!c) return String(code||'');
  if(lang==='ru') return c.ru||c.en;
  if(lang==='uk') return c.uk||c.en;
  return c.en;
}
function countryCode(raw){
  const q=String(raw||'').trim();
  if(!q) return '';
  const low=q.toLowerCase();
  const hits=findCountries(q);
  const exact=hits.find(c=>c.code===low || c.en.toLowerCase()===low || c.ru.toLowerCase()===low || c.uk.toLowerCase()===low);
  if(exact) return exact.code;
  if(/^[a-z]{2}$/i.test(q) && COUNTRIES.some(c=>c.code===low)) return low;
  if(hits.length===1) return hits[0].code;
  return '';
}

  const wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday];
  return {y:+o.year, m:+o.month, d:+o.day, h, min:+o.minute, s:+o.second, wd};
}

/**
 * Smallest step from {1, 2, 2.5, 5}×10^k such that span/step is at most n.
 * @param {number} span range width
 * @param {number} n maximum number of steps
 * @returns {number} the step, or 1 when span is not positive or n is below 1
 */
function niceStep(span, n){
  span=+span||0; n=+n||0;
  if(span<=0||n<1) return 1;
  const raw=span/n;
  let exp=Math.floor(Math.log10(raw));
  let pow=Math.pow(10, exp);
  let mant=raw/pow;
  if(!(mant<10)){ mant/=10; exp++; pow*=10 }
  const bases=[1,2,2.5,5,10];
  let m=10;
  for(let i=0;i<bases.length;i++){ if(mant<=bases[i]+1e-10){ m=bases[i]; break } }

/** PAGE_VIEW_COLS_PAGE maps a column catalog kind to the page key that stores its column set. */

function pageViewTrimShort(v, max){

/** pageViewSort validates a table sort object {k, dir}.
 * @param {*} sort candidate sort
 * @param {{k:string,dir:number}} def fallback sort
 * @returns {{k:string,dir:number}} validated sort

function pageViewSort(sort, def){

  let dir=+sort.dir;
  if(dir!==1&&dir!==-1) dir=(def.dir||1)<0?-1:1;

}
/** pageViewPSort validates dashboard campaign sort {k, d}.
 * @param {*} sort candidate sort
 * @param {{k:string,d:number}} def fallback sort
 * @returns {{k:string,d:number}} validated sort
 */
function pageViewPSort(sort, def){

  if(!sort||typeof sort!=='object') return {k:String(def.k||'conv'), d:(def.d||1)<0?-1:1};

 * Rows without a string id of 1..64 characters, repeated ids and rows past the 200th are dropped.
 * @param {*} list candidate column rows
 * @returns {Array<{id:string,on:boolean}>|null} normalized rows, or null when there is no usable set
 */

  const seen=new Set(), out=[];
  for(const c of list){
    if(out.length>=PAGE_VIEW_COLS_MAX) break;
    if(!c||typeof c!=='object'||typeof c.id!=='string') continue;
    const id=c.id.trim();
    if(!id||id.length>PAGE_VIEW_COL_ID_MAX||seen.has(id)) continue;
    seen.add(id);
    out.push({id, on:c.on===true||c.on===1});
  }

/** pageViewPage validates a page size.

 * @returns {number} v when it is an integer in 1..max, def otherwise

/** pageViewConds validates filter condition rows for storage.

/** pageViewRange validates the shared period object.

  if(!PAGE_VIEW_PERIOD_IDS.includes(id)) return null;

/** defaultPageViewState returns baseline page-view fields before server merge.

function defaultPageViewState(){

    recentSort:{k:'',dir:-1},
    flows:{q:'', state:'all', source:'', folder:'', view:'table', compact:false, page:1000},
    logs:{tab:'traffic', conds:[], page:100, pblogSort:{k:'ts',dir:-1}},
    conversions:{conds:[], page:50},
    report:{conds:[]},
    networks:{offersSort:{k:'',dir:-1}},
    domains:{page:50},
  };

const DASH_PANEL_IDS_PURE=new Set(['country','device','os','browser','domain','org','custom']);
/** pageViewDashPanels validates dashboard panel ids for storage.
 * @param {*} list candidate id list, or null for all panels visible
 * @returns {string[]|null|undefined} normalized list, null for all, undefined when invalid
 */
function pageViewDashPanels(list){
  if(list==null) return null;
  if(!Array.isArray(list)) return undefined;
  const seen=new Set(), out=[];
  for(const id of list){
    const s=pageViewTrimShort(id, PAGE_VIEW_COL_ID_MAX);
    if(!DASH_PANEL_IDS_PURE.has(s)||seen.has(s)) continue;
    seen.add(s); out.push(s);
  }

/** pageViewAutomationOrder validates automation card order ids for storage.
 * @param {*} list candidate id list
 * @param {string[]|null} def fallback when nothing valid remains
 * @returns {string[]|null} normalized order
 */
function pageViewAutomationOrder(list, def){

  const seen=new Set(), out=[];
  for(const id of list){
    const s=pageViewTrimShort(id, PAGE_VIEW_SORT_K_MAX);

  };

    if(panels!==undefined) dash.panels=panels;
  }

ddress — {origin}.','key.docs.b.denied':'A key cannot manage keys (<code>/api/api-keys</code>), change the password (<code>POST /api/password</code>), sign in (<code>POST /api/login</code>) or sign out (<code>POST /api/logout</code>). Those addresses answer only a browser session.','key.docs.b.campaigns':'<code>GET /api/groups</code> returns the campaign list. <code>PUT /api/groups</code> saves the whole array. <code>PUT /api/groups/{id}</code> saves one campaign. <code>DELETE /api/groups/{id}</code> deletes a campaign. Responses are gzip-compressed when <code>Accept-Encoding: gzip</code>.','key.docs.b.catalogs':'A catalog has one address for the list and the same address with <code>/{id}</code> for one record. List: <code>GET</code> and <code>POST</code>. Record: <code>GET</code>, <code>PUT</code>, <code>DELETE</code>.','key.docs.b.catalogs2':'Offers — <code>/api/offers</code>. Networks — <code>/api/affiliate-networks</code>. Landings — <code>/api/landings</code>. Sources — <code>/api/traffic-sources</code>.','key.docs.b.domains':'Domains: <code>GET</code> and <code>POST /api/domains</code>, <code>GET</code>, <code>PUT</code> and <code>DELETE /api/domains/{id}</code>. Host check — <code>POST /api/domains/{id}/check</code>.','key.docs.b.clicks':'<code>GET /api/logs</code> accepts <code>from</code>, <code>to</code>, <code>limit</code> (default 100, at most 1000), <code>offset</code> and a repeatable filter <code>f=field:op:value</code>. Operators: <code>eq</code>, <code>ne</code>, <code>in</code>, <code>nin</code>. Several values are several <code>f</code> parameters with the same field and operator.','key.docs.b.conv':'<code>GET /api/postbacks</code> accepts the same period, <code>limit</code>, <code>offset</code> and <code>f</code> filters.','key.docs.b.fields':'<code>GET /api/log-fields</code> returns the field catalog and wave readiness. <code>GET /api/log-values?table=events|conversions&amp;field=&amp;from=&amp;to=</code> returns dimension values. A field without a dimension answers 400.','key.docs.b.stats':'<code>GET /api/stats/summary</code> and <code>GET /api/stats/timeseries</code> accept <code>from</code> and <code>to</code>. A series has <code>step</code> in seconds, at least 3600. <code>GET /api/stats/breakdown?dim=</code> and <code>GET /api/report</code> accept the same <code>f</code> filters. The old dimension name <code>group</code> is read as <code>campaign</code>.','key.docs.b.export':'<code>GET /api/logs/export</code> downloads a CSV for the period with the same filters as the click log.','key.docs.b.keys':'Listing, creating, rotating, editing and revoking keys (<code>GET</code> and <code>POST /api/api-keys</code>, <code>POST /api/api-keys/{id}/rotate</code>, <code>PUT /api/api-keys/{id}</code>, <code>DELETE /api/api-keys/{id}</code>) is available only through a browser session. <code>DELETE</code> revokes a key; <code>DELETE …?hard=1</code> removes the record of an already revoked key. The <code>Api-Key</code> header does not open these addresses. Create and edit body: <code>{"name":"cabinet","scopes":["admin","engine"]}</code>. On create and rotate the <code>key</code> field is returned once.','key.docs.b.engine':'The engine <code>?api=</code> mode accepts JSON in base64 (standard or URL-safe) in the <code>api</code> parameter. The <code>key_api</code> field is a key with the Engine scope or the <code>KUZTDS_API_KEY</code> value. A wrong key answers 403. Request fields: <code>key_api</code>, <code>id</code> (campaign), <code>ip</code>, <code>referer</code>, <code>useragent</code>, <code>se</code>, <code>lang</code>, <code>uniq</code> (<code>yes</code> means unique), <code>key</code>, <code>domain</code>, <code>page</code>, <code>cf_country</code>, <code>pars</code> (array of strings). The request goes to the tracker domain of the engine, not to the admin address.','fld.device_model':'Device model','cond.model.hint':'Exact model, case-insensitive: SM-S918B from an Android User-Agent. iOS and Chrome with a red ечают только сессии браузера.','key.docs.b.campaigns':'<code>GET /api/groups</code> возвращает список кампаний. <code>PUT /api/groups</code> сохраняет массив целиком. <code>PUT /api/groups/{id}</code> сохраняет одну кампанию. <code>DELETE /api/groups/{id}</code> удаляет кампанию. Ответы сжимаются gzip при <code>Accept-Encoding: gzip</code>.','key.docs.b.catalogs':'У каталога один адрес на список и тот же адрес с <code>/{id}</code> на одну запись. Список: <code>GET</code> и <code>POST</code>. Запись: <code>GET</code>, <code>PUT</code>, <code>DELETE</code>.','key.docs.b.catalogs2':'Офферы — <code>/api/offers</code>. Сети — <code>/api/affiliate-networks</code>. Лендинги — <code>/api/landings</code>. Источники — <code>/api/traffic-sources</code>.','key.docs.b.domains':'Домены: <code>GET</code> и <code>POST /api/domains</code>, <code>GET</code>, <code>PUT</code> и <code>DELETE /api/domains/{id}</code>. Проверка хоста — <code>POST /api/domains/{id}/check</code>.','key.docs.b.clicks':'<code>GET /api/logs</code> принимает <code>from</code>, <code>to</code>, <code>limit</code> (по умолчанию 100, не больше 1000), <code>offset</code> и повторяемый фильтр <code>f=field:op:value</code>. Операторы: <code>eq</code>, <code>ne</code>, <code>in</code>, <code>nin</code>. Несколько значений — несколько параметров <code>f</code> с одним и тем же полем и оператором.','key.docs.b.conv':'<code>GET /api/postbacks</code> принимает тот же период, <code>limit</code>, <code>offset</code> и фильтры <code>f</code>.','key.docs.b.fields':'<code>GET /api/log-fields</code> отдаёт каталог полей и готовность волн. <code>GET /api/log-values?table=events|conversions&amp;field=&amp;from=&amp;to=</code> отдаёт значения измерения. Поле без измерения отвечает 400.','key.docs.b.stats':'<code>GET /api/stats/summary</code> и <code>GET /api/stats/timeseries</code> принимают <code>from</code> и <code>to</code>. У ряда <code>step</code> в секундах, не меньше 3600. <code>GET /api/stats/breakdown?dim=</code> и <code  (<code>POST /api/login</code>) і вихід (<code>POST /api/logout</code>). Ці адреси відповідають лише сесії браузера.','key.docs.b.campaigns':'<code>GET /api/groups</code> повертає список кампаній. <code>PUT /api/groups</code> зберігає масив цілком. <code>PUT /api/groups/{id}</code> зберігає одну кампанію. <code>DELETE /api/groups/{id}</code> видаляє кампанію. Відповіді стискаються gzip за <code>Accept-Encoding: gzip</code>.','key.docs.b.catalogs':'У каталогу одна адреса на список і та сама адреса з <code>/{id}</code> на один запис. Список: <code>GET</code> і <code>POST</code>. Запис: <code>GET</code>, <code>PUT</code>, <code>DELETE</code>.','key.docs.b.catalogs2':'Офери — <code>/api/offers</code>. Мережі — <code>/api/affiliate-networks</code>. Лендінги — <code>/api/landings</code>. Джерела — <code>/api/traffic-sources</code>.','key.docs.b.domains':'Домени: <code>GET</code> і <code>POST /api/domains</code>, <code>GET</code>, <code>PUT</code> і <code>DELETE /api/domains/{id}</code>. Перевірка хоста — <code>POST /api/domains/{id}/check</code>.','key.docs.b.clicks':'<code>GET /api/logs</code> приймає <code>from</code>, <code>to</code>, <code>limit</code> (типово 100, не більше 1000), <code>offset</code> і повторюваний фільтр <code>f=field:op:value</code>. Оператори: <code>eq</code>, <code>ne</code>, <code>in</code>, <code>nin</code>. Кілька значень — кілька параметрів <code>f</code> з тим самим полем і оператором.','key.docs.b.conv':'<code>GET /api/postbacks</code> приймає той самий період, <code>limit</code>, <code>offset</code> і фільтри <code>f</code>.','key.docs.b.fields':'<code>GET /api/log-fields</code> віддає каталог полів і готовність хвиль. <code>GET /api/log-values?table=events|conversions&amp;field=&amp;from=&amp;to=</code> віддає значення виміру. Поле без виміру відповідає 400.','key.docs.b.stats':'<code>GET /api/stats/summary</code> і <code>GET /api/stats/timeseries</code> приймають <code>from</code> і <code>to</code>. У ряду <code>step</code> у секундах, не менше 3600. <code>GET /api/stats/breakdown?dim=</code> і <code>GET /api/report</code> приймають ті самі фільтри <code>f</code>. Стару назву виміру <code>group</code> сервер читає як <code>campaign</code>.','key.docs.b.export':'<code>GET /api/logs/export</code> вивантажує CSV за період з тими самими фільтрами, що й журнал кліків.','key.docs.b.keys':'Список, створення, перевипуск, правка і відкликання ключів (<code>GET</code> і <code>POST /api/api-keys</code>, <code>POST /api/api-keys/{id}/rotate</code>, <code>PUT /api/api-keys/{id}</code>, <code>DELETE /api/api-keys/{id}</code>) доступні лише через сесію браузера. <code>DELETE</code> відкликає ключ; <code>DELETE …?hard=1</code> видаляє запис уже відкликаного ключа. Заголовок <code>Api-Key</code> ці адреси не відкриває. Тіло створення і правки: <code>{"name":"кабінет","scopes":["admin","engine"]}</code>. У відповіді створення і перевипуску поле <code>key</code> приходить один раз.','key.docs.b.engine':'Режим <code>?api=</code> рушія приймає JSON у base64 (звичайний або URL-safe) у параметрі <code>api</code>. Поле <code>key_api</code> — ключ зі scope «Рушій» або значення <code>KUZTDS_API_KEY</code>. Невірний ключ відповідає 403. Поля запиту: <code>key_api</code>, <code>id</code> (кампанія), <code>ip</code>, <code>referer</code>, <code>useragent</code>, <code>se</code>, <code>lang</code>, <code>uniq</code> (<code>yes</code> — унікальний), <code>key</code>, <code>domain</code>, <code>page</code>, <code>cf_country</code>, <code>pars</code> (масив рядків). Запит іде на трекерний домен рушія, а не на адресу адмінки.','fld.device_model':'Модель пристрою','cond.model.hint':'Точний збіг без урахування регістру: SM-S918B з User-Agent Android. В iOS і Chrome зі скороченим User-Agent моделі немає: «лише» їх відсікає.','cond.sid.hint':'Sub ID 1–12, як у журналі. Один рядок на номер; повтор номера лишає останній рядок.','cond.sid.ph':'значення','sid.empty':'і порожній','sid.add':'Додати Sub ID','chip.empty':'порожньо','sticky.lab function condChips(s,hit){

/** saveFlows writes campaigns. Ids and aliases are checked first; a bad one throws before any request.
 * Few unchanged-id edits go one by one: DELETE, then PUT in list order. call throws on 404; a missing delete counts as done.
 * A changed id, a reordered list, or more than 20 changes sends the whole array.
 * A point save that fails midway keeps what already landed and throws the error.
 * @return {Promise<void>}
 */
async function saveFlows(){
  await flushIPDraft();
  const ids=GROUPS.map(g=>(g.id||'').trim());
  if(ids.some(x=>!x))throw new Error('Every flow needs an ID');
  const dup=ids.find((x,i)=>ids.indexOf(x)!==i);
  if(dup)throw new Error('Duplicate flow ID: '+dup);
  // The ID is the first path segment of the link, so it cannot hold what ends one.
  const bad=ids.find(x=>/[\s\/?#]/.test(x));
  if(bad)throw new Error('Flow ID "'+bad+'" must not contain spaces, /, ? or #');
  const badA=GROUPS.flatMap(g=>g.aliases||[]).find(x=>/[\s\/?#]/.test(x));
  if(badA)throw new Error('Alias "'+badA+'" must not contain spaces, /, ? or #');
  let point=!ORDER_DIRTY&&DIRTY.size+DELETED.size<=20;
  if(point){
    for(const g of DIRTY){
      const prev=SNAP.get(g);
      if(prev&&prev.id!==g.id){point=false;break}
    }
  }
  if(!point){
    await call('PUT','/api/groups',GROUPS);
    snapshotGroups();
    return;
  }
  for(const id of [...DELETED]){
    try{await call('DELETE','/api/groups/'+encodeURIComponent(id))}
    catch(e){if(!e||e.status!==404) throw e}
    DELETED.delete(id);
  }
  for(const g of GROUPS){
    if(!DIRTY.has(g)) continue;
    await call('PUT','/api/groups/'+encodeURIComponent(g.id),g);
    DIRTY.delete(g);
    SNAP.set(g,{id:g.id,json:JSON.stringify(g)});
  }
  snapshotGroups();
}

function fillFlowFilters(){

/** campaignFolders returns the unique non-empty trimmed folder names of GROUPS, sorted with localeCompare.
 * @returns {string[]} */
function campaignFolders(){
  const seen=new Set(), names=[];
  for(const g of (Array.isArray(GROUPS)?GROUPS:[])){
    const name=String(g&&g.folder||'').trim();
    if(!name||seen.has(name)) continue;
    seen.add(name); names.push(name);
  }
  names.sort((a,b)=>a.localeCompare(b));
  return names;
}
const NO_GROUP='\u0000none';
const CAT_Q={offers:'',landings:'',networks:'',sources:'',domains:''};

/** groupLabels returns unique non-empty trimmed group names from catalog rows, sorted with localeCompare.
 * @param {Array} rows catalog records with optional group
 * @returns {string[]} */
function groupLabels(rows){
  const seen=new Set(), names=[];
  for(const r of (Array.isArray(rows)?rows:[])){
    const name=String(r&&r.group||'').trim();
    if(!name||seen.has(name)) continue;
    seen.add(name); names.push(name);
  }
  names.sort((a,b)=>a.localeCompare(b));

}

 * @returns {boolean} */
function matchesGroup(row, pick){

/** textMatch is case-insensitive substring search across fields.
 * @param {string} q query
 * @param {Array} fields values to search
 * @returns {boolean} */
function textMatch(q, fields){
  const t=String(q||'').trim().toLowerCase();
  if(!t) return true;
  return (fields||[]).some(x=>String(x??'').toLowerCase().includes(t));
}
/** fillGroupSelect rebuilds group filter options when markup changed; hides the select when no labels exist.
 * @param {HTMLSelectElement|null} sel group filter
 * @param {Array} rows catalog rows
 * @param {string} pick current selection
 * @returns {string} active pick, cleared when missing from the list */
function fillGroupSelect(sel, rows, pick){
  if(!sel) return pick||'';
  const names=groupLabels(rows);
  const list=Array.isArray(rows)?rows:[];
  const both=names.length>0&&list.some(r=>!String(r&&r.group||'').trim());
  const values=new Set(['',...names]);
  if(both) values.add(NO_GROUP);
  let p=pick||'';
  if(!values.has(p)) p='';
  const apply=(el,html)=>{
    const probe=document.createElement('select');
    probe.innerHTML=html;
    if(el.innerHTML!==probe.innerHTML) el.innerHTML=html;
  };
  apply(sel, opt('',tr('off.allgroups'),p)+names.map(n=>opt(n,n,p)).join('')+(both?opt(NO_GROUP,tr('flows.nofolder'),p):''));
  sel.hidden=names.length===0;

}

function campaignRows(){

    const text=!t||[g.id,g.name,g.folder,...(g.aliases||[]),...(g.streams||[]).map(s=>s.name)].some(x=>String(x||'').toLowerCase().includes(t));

    else if(FLOW_SOURCE&&g.source_id!==FLOW_SOURCE) return false;
    const folder=String(g.folder||'').trim();

    else if(FLOW_FOLDER&&folder!==FLOW_FOLDER) return false;

/** FLOW_USD_COLS are the campaign columns that are always USD; FLOW_SPEND_COLS are in the currency of the spend. */
const FLOW_USD_COLS=new Set(['revenue','uepc','epc']);
const FLOW_SPEND_COLS=new Set(['cost','cpc']);
/**
 * exportFlows downloads the campaigns table. The HTML file looks like the screen. In CSV the amounts are plain numbers
 * and the currency is written in the column title: revenue columns are always in $, spend columns in the currency of the spend,
 * profit in $ while all spend is in USD. An amount that cannot carry one currency stays text and its title has none.
 * @param {boolean} asHTML true for the HTML file, false for CSV
 */
function exportFlows(asHTML){
  const cols=loadCols('flows').filter(c=>c.on);
  const list=campaignRows();
  const by={};
  for(const g of list) addBy(by, campaignMetrics(g.id).costBy);
  const cc=costCode(by);
  const mode=asHTML?false:{cost:!cc.multi, profit:!spendBasis(by).mixed};
  const mark=c=>{
    if(!mode) return '';
    if(FLOW_USD_COLS.has(c.id)||(c.id==='profit'&&mode.profit)) return ', '+curSign('USD');
    if(FLOW_SPEND_COLS.has(c.id)&&mode.cost) return ', '+curSign(cc.code);
    return '';
  };
  const headers=cols.map(c=>tr(c.label)+mark(c));
  const rows=list.map(g=>cols.map(c=>plainCell(flowMetricCell(g,c.id,null,mode))));
  const name=tr('flows.title')+(asHTML?'.html':'.csv');
  if(asHTML) downloadHTML(tr('flows.title'), headers, rows);
  else download(name, csvTable(headers, rows), 'text/csv');
}

    +hs('profit',bit(tr('col.profit'),profitOf(acc.rev, acc.cost, ready),spend.mixed?'':moneyCellCls('profit',{ready, profit:accProfit})))
    +hs('roi',bit(tr('col.roi'),sumRoi,roiCls(sumRoi)))

    <span class="hint">${fmt(from)}–${fmt(to)} ${tr('of')} ${fmt(rows.length)}</span>`;

  q('#fnext',page).onclick=()=>{if(FLOW_PAGE_I<pages-1){FLOW_PAGE_I++; paintFlowCards()}};

// Wires: the trunk from the entry down to the default, a branch into every
// stream, a ribbon from each stream to its destination. Widths follow the
// traffic of the period; with a simulation on screen its path is drawn on top.
function drawWires(){
  const cv=q('#canvas'), svg=q('#wires'); if(!cv||!svg||!CUR)return;
  const R=cv.getBoundingClientRect();
  const box=(el)=>{const r=el.getBoundingClientRect();return {l:r.left-R.left,r:r.right-R.left,y:(r.top+r.bottom)/2-R.top,b:r.bottom-R.top}};
  const g=CUR, total=perfOf(g,null).hits;
  const w=(n)=>total&&n?Math.max(2,Math.min(14,2+12*n/total)):2;
  const entry=q('#entry',cv), fbn=q('#fbnode',cv), fbd=q('#fbdest',cv); if(!entry||!fbn)return;
  const E=box(entry), X=E.l+22, parts=[], top=[];
  const line=(d,width,cls,extra)=>`<path d="${d}" fill="none" stroke="var(${cls})" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${extra||''}/>`;
  const arrow=(x,y,cls)=>`<path d="M${x-7},${y-5} L${x},${y} L${x-7},${y+5}" fill="none" stroke="var(${cls})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const elbow=(y,toX)=>`M${X},${y-14} Q${X},${y} ${X+14},${y} L${toX},${y}`;
  const step=SIM&&SIM.path&&SIM.path[0];
  const winner=step?(step.selected==='-'?'fb':step.streams.findIndex(x=>x.on&&x.match)):null;
  const kind=(n)=>n?'--wire':'--wire-idle';

  let rem=total, prevY=E.b, reached=true; // reached: the simulated visitor is still on the trunk
  const rows=qa('.srow',cv).map(row=>({i:+row.dataset.s,n:box(q('.node',row)),d:box(q('.dest',row))})).sort((a,b)=>a.n.y-b.n.y);
  rows.forEach(({i,n,d})=>{
    const s=g.streams[i], hits=s.status?perfOf(g,s.name).hits:0, dashed=s.status?'':'stroke-dasharray="2 7"';
    parts.push(line(`M${X},${prevY} L${X},${n.y}`,w(rem),kind(rem)));
    if(step&&reached)top.push(line(`M${X},${prevY} L${X},${n.y-14}`,3,'--wire-ok'));
    // side: the destination sits beside the node (wide layout), not under it
    const side=d.l>n.r;
    parts.push(line(elbow(n.y,n.l),w(hits),kind(hits),dashed));
    if(side)parts.push(line(`M${n.r},${n.y} L${d.l-4},${n.y}`,w(hits),kind(hits),dashed),arrow(d.l-2,n.y,kind(hits)));
    if(step&&reached&&winner===i){
      top.push(line(elbow(n.y,n.l),3,'--wire-ok'));
      if(side)top.push(line(`M${n.r},${n.y} L${d.l-4},${n.y}`,3,'--wire-ok'),arrow(d.l-2,n.y,'--wire-ok'));
      reached=false;
    }
    if(step&&reached)top.push(line(`M${X},${n.y-14} L${X},${n.y}`,3,'--wire-ok'));
    rem=Math.max(0,rem-hits); prevY=n.y;
  });
  const F=box(fbn), D=box(fbd), fb=perfOf(g,'-').hits;
  const fside=D.l>F.r;
  parts.push(line(`M${X},${prevY} L${X},${F.y-14}`,w(rem),kind(rem)),line(elbow(F.y,F.l),w(fb),kind(fb)));
  if(fside)parts.push(line(`M${F.r},${F.y} L${D.l-4},${F.y}`,w(fb),kind(fb)),arrow(D.l-2,F.y,kind(fb)));
  if(step&&reached){
    top.push(line(`M${X},${prevY} L${X},${F.y-14}`,3,'--wire-ok'),line(elbow(F.y,F.l),3,'--wire-ok'));
    if(fside)top.push(line(`M${F.r},${F.y} L${D.l-4},${F.y}`,3,'--wire-ok'),arrow(D.l-2,F.y,'--wire-ok'));
  }
  svg.innerHTML=parts.join('')+top.join('');
}
/**
 * bindSort wires column headers or a stream grip.
 * With onChange, data-sort buttons update state: the active column flips, a numeric th starts descending, a text th starts ascending, then onChange runs and the page views are sent at once.
 * Without onChange, the canvas grip drags a stream row and commits the order on release.
 * @param {Element} root table root, or the flow canvas
 * @param {object} state sort state {k, dir}, or the campaign group
 * @param {function} [onChange] repaint after a column click
 * @returns {void}
 */
function bindSort(root, state, onChange){
  if(typeof onChange==='function'){
    if(!root||!state) return;
    qa('[data-sort]', root).forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const k=b.dataset.sort;
      if(state.k===k) state.dir=-(state.dir||1);
      else {
        state.k=k;
        const th=b.closest('th');
        if(th&&th.dataset.sortDate) state.dir=-1;
        else if(th&&th.classList.contains('num')) state.dir=-1;
        else state.dir=1;
      }
      onChange();
      flushPageViews();
    });
    return;
  }
  const cv=root, g=state;
  cv.addEventListener('pointerdown',e=>{
    const grip=e.target.closest('[data-grip]'); if(!grip||e.button)return;
    const row=grip.closest('.srow'), rows=qa('.srow',cv), from=rows.indexOf(row);
    e.preventDefault(); closeMenu();
    const rects=rows.map(r=>r.getBoundingClientRect());
    const gap=rows.length>1?rects[1].top-rects[0].bottom:22, size=rects[from].height+gap, y0=e.clientY;
    let to=from, raf=0;
    rows.forEach(r=>{if(r!==row)r.classList.add('moving')}); row.classList.add('dragging');
    const loop=()=>{drawWires();raf=requestAnimationFrame(loop)}; raf=requestAnimationFrame(loop);
    const move=ev=>{
      const dy=ev.clientY-y0, mid=rects[from].top+rects[from].height/2+dy;
      row.style.transform=`translateY(${dy}px)`; to=from;
      rows.forEach((r,i)=>{
        if(i===from)return;
        const c=rects[i].top+rects[i].height/2; let s=0;
        if(i>from&&mid>c){s=-size;to=Math.max(to,i)} else if(i<from&&mid<c){s=size;to=Math.min(to,i)}
        r.style.transform=s?`translateY(${s}px)`:'';
      });
    };
    const up=()=>{
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
      cancelAnimationFrame(raf);
      if(to!==from)moveStream(g,from,to);
      renderFlow();
    };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });
}
function moveStream(g,from,to){
  const a=g.streams; if(to<0||to>=a.length||to===from)return;
  const [m]=a.splice(from,1); a.splice(to,0,m); SIM=null; markDirty(g);
}

// ensureLandings loads the landing catalog once and keeps it for the stream editor and the canvas.
// refresh forces a new read. It returns the list. A failed read is an empty list.
async function ensureLandings(refresh){
  if(LANDINGS&&!refresh) return LANDINGS;
  const list=await get('/api/landings',[]);
  LANDINGS=Array.isArray(list)?list:[];
  return LANDINGS;
}
// ensureCatalogs loads offers, networks, landings and sources once.
// A null left by a save or a group clear loads that list again.
// It returns nothing. A failed read becomes an empty list.
async function ensureCatalogs(){
  const jobs=[];
  if(!OFFERS) jobs.push(get('/api/offers',[]).then(v=>{if(!OFFERS) OFFERS=Array.isArray(v)?v:[]}));
  if(!NETS) jobs.push(get('/api/affiliate-networks',[]).then(v=>{if(!NETS) NETS=Array.isArray(v)?v:[]}));
  if(!LANDINGS) jobs.push(ensureLandings());
  if(!SOURCES) jobs.push(get('/api/traffic-sources',[]).then(v=>{if(!SOURCES) SOURCES=Array.isArray(v)?v:[]}));
  if(jobs.length) await Promise.all(jobs);
}
// nameOf returns the catalog name for id, or id when the row has no name.
// list is an array of {id, name}. id is the stored identifier. It returns a string.
function nameOf(list, id){
  if(id==null||id==='') return '';
  const s=String(id);
  const hit=(list||[]).find(x=>x&&String(x.id)===s);
  return hit&&hit.name?String(hit.name):s;
}

/** applyIPList reads the IP editor into the draft and stores only flag and file on the rules.

 * @param {Element} d drawer

function applyIPList(r,d,prev){

/** loadIPFile reads a .dat list once and repaints only while the field is still empty on the same stream.
 * f is the stored ip_list. It returns nothing. A failed read does not cache and does not clear the file.
 * @param {object} f stored ip_list
 * @returns {void}
 */
function loadIPFile(f){
  const file=String((f&&f.file)||'');
  if(!file||!IP_DAT.test(file)||IP_DRAFT) return;
  if(Object.prototype.hasOwnProperty.call(IP_LOADED,file)) return;
  if(IP_PENDING&&IP_REQ===file) return;
  IP_PENDING=true; IP_REQ=file;
  const g=CUR, idx=EDIT;
  get('/api/lists/'+encodeURIComponent(file),null).then(j=>{
    if(IP_REQ!==file) return;
    IP_PENDING=false; IP_REQ='';
    if(!j||typeof j.content!=='string') return;
    IP_LOADED[file]=ipEntries(j.content);
    if(CUR!==g||EDIT!==idx||IP_DRAFT) return;
    const ta=q('#f_iplist_text'), tags=q('#f_iplist_t');
    const cur=ta?ipEntries(ta.value):(tags?tagValues(tags):null);
    if(!cur||cur.length) return;
    paintStream();
  }).catch(()=>{if(IP_REQ===file){IP_PENDING=false;IP_REQ=''}});
}
/** ipListName is the content-addressed file name: ip-, 12 hex of SHA-1, .dat.
 * content is the list text, including the final newline. It returns the name.
 * It rejects when the digest is unavailable.
 * @param {string} content list text
 * @returns {Promise<string>}
 */
async function ipListName(content){
  const buf=await crypto.subtle.digest('SHA-1', new TextEncoder().encode(content));
  const hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return 'ip-'+hex.slice(0,12)+'.dat';
}
/** flushIPDraft writes a changed IP list before campaigns are saved.
 * A new body gets a new file; the open stream only changes ip_list.file. The same name skips PUT.
 * An empty draft writes no file and clears the name. A failed PUT throws and campaigns stay unsaved.
 * @returns {Promise<void>}
 */
async function flushIPDraft(){
  const d=IP_DRAFT;
  if(!d) return;
  const lines=Array.isArray(d.lines)?d.lines:[];
  const idx=EDIT>=0?EDIT:IP_IDX;
  const s=CUR&&Array.isArray(CUR.streams)?CUR.streams[idx]:null;
  if(!lines.length){
    if(s){s.rules=s.rules||{}; s.rules.ip_list={flag:0,file:''}}
    IP_DRAFT=null;
    if(CUR) markDirty(CUR);
    return;
  }
  if(!s) return;
  const content=lines.join('\n')+'\n';
  const name=await ipListName(content);
  if(name!==String(d.file||'')) await call('PUT','/api/lists/'+encodeURIComponent(name),{content});
  s.rules=s.rules||{};
  s.rules.ip_list={flag:+d.flag||2,file:name};
  IP_LOADED[name]=lines.slice();
  IP_DRAFT=null;
  if(CUR) markDirty(CUR);
}
