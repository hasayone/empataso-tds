  *{box-sizing:border-box}
  html{scrollbar-gutter:stable;background:var(--bg)}
  body{margin:0;font:14px/1.5 var(--font);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;min-height:100vh}

  ::selection{background:var(--accent-soft)}
  [hidden]{display:none!important}
  code,.mono{font-family:var(--mono);font-size:12.5px}
  code{background:var(--surface-2);border:1px solid var(--border);padding:1px 5px;border-radius:5px}

  pre.mono code{display:block;white-space:pre-wrap}

  h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}

const flagSVG=(inner)=>`<svg class="flag" viewBox="0 0 18 12" width="18" height="12" aria-hidden="true">${inner}</svg>`;
const flagBands=(dir,colors,weights)=>{
  const w=weights||colors.map(()=>1), sum=w.reduce((a,b)=>a+b,0);
  let acc=0;
  return colors.map((c,i)=>{
    const size=(dir==='v'?18:12)*w[i]/sum, pos=acc; acc+=size;
    return dir==='v'
      ? `<rect x="${pos}" y="0" width="${size+0.35}" height="12" fill="${c}"/>`
      : `<rect x="0" y="${pos}" width="18" height="${size+0.35}" fill="${c}"/>`;
  }).join('');
};
const flag=(cc)=>{

  if(cc==='es'||cc==='lv') return flagSVG(flagBands('h', cc==='es'?['#c60b1e','#f1bf00','#c60b1e']:['#9e3039','#fff','#9e3039'], [1,2,1]));
  if(cc==='th') return flagSVG(flagBands('h',['#a51931','#fff','#2d2a4a','#fff','#a51931'], [1,1,2,1,1]));
  if(cc==='pt') return flagSVG('<rect width="7" height="12" fill="#006600"/><rect x="7" width="11" height="12" fill="#ff0000"/>');
  if(cc==='fr') return flagSVG(flagBands('v',['#002395','#fff','#ed2939']));
  if(cc==='cz') return flagSVG('<rect width="18" height="6" fill="#fff"/><rect y="6" width="18" height="6" fill="#d7141a"/><path d="M0 0 L8 6 L0 12 Z" fill="#11457e"/>');
  if(cc==='cl') return flagSVG('<rect width="18" height="6" fill="#fff"/><rect y="6" width="18" height="6" fill="#d52b1e"/><rect width="6" height="6" fill="#0039a6"/>');
  if(cc==='gr'){
    let s='';
    for(let i=0;i<9;i++) s+=`<rect y="${(12/9)*i}" width="18" height="${12/9+0.25}" fill="${i%2?'#fff':'#0d5eaf'}"/>`;
    return flagSVG(s+'<rect width="7" height="6.7" fill="#0d5eaf"/>');
  }
  if(cc==='il') return flagSVG('<rect width="18" height="12" fill="#fff"/><rect height="2" width="18" fill="#0038b8"/><rect y="10" height="2" width="18" fill="#0038b8"/>');

  const [kind,...cols]=spec.split('|');

  return v.toFixed(d)+' '+suf;
}

function ago(iso){
  const t=new Date(iso).getTime(); if(!t||t<0)return tr('never');
  const s=Math.round((Date.now()-t)/1000), a=Math.abs(s);
  if(a<5)return tr('just now');
  const u=a<60?[a,tr('s')]:a<3600?[Math.round(a/60),tr('min')]:a<86400?[Math.round(a/3600),tr('h')]:[Math.round(a/86400),tr('d')];

}

function tr(k){
  const lang=uiLang();
  if(typeof I18N!=='undefined'&&I18N[lang]&&I18N[lang][k]) return I18N[lang][k];
  if(typeof PHRASE!=='undefined'&&PHRASE[lang]&&PHRASE[lang][k]) return PHRASE[lang][k];
  if(PHRASE_EXTRA[lang]&&PHRASE_EXTRA[lang][k]) return PHRASE_EXTRA[lang][k];
  if(typeof I18N!=='undefined'&&I18N.en&&I18N.en[k]) return I18N.en[k];
  return k;
}
/** applyLangPrefs stores the interface language without repainting the shell.
 * @param {string} lang ru, en or uk
 * @returns {void}
 */
function applyLangPrefs(lang){
  if(lang!=='ru'&&lang!=='uk'&&lang!=='en') lang='en';
  try{localStorage.setItem(LANG_KEY, lang)}catch(e){}
  document.documentElement.lang=lang;
}
function applyLang(lang){
  applyLangPrefs(lang);
  paintChrome(); themeChanged(); if(typeof syncSaveBar==='function') syncSaveBar(); render();
}
/** applyTzPrefs stores the statistics timezone without rendering pages.
 * @param {string} tz IANA time zone id
 * @returns {void}
 */
function applyTzPrefs(tz){
  if(!tz) return;
  try{localStorage.setItem(TZ_KEY, tz)}catch(e){}
  syncHours();
}
function applyTz(tz){
  applyTzPrefs(tz);
  PERF=null; render();
}
/**
 * applyMePrefs copies server prefs into localStorage when the session is fresh
 * or the browser has no saved lang/tz yet.
 * @param {object|null} me GET /api/me payload
 * @param {boolean} fresh true right after login
 * @returns {void}
 */
function applyMePrefs(me, fresh){
  if(!me) return;
  let haveLang=false, haveTz=false;
  try{haveLang=!!localStorage.getItem(LANG_KEY)}catch(e){}
  try{haveTz=!!localStorage.getItem(TZ_KEY)}catch(e){}
  const pl=me.prefs&&me.prefs.lang;
  if((fresh||!haveLang)&&(pl==='ru'||pl==='en'||pl==='uk')) applyLangPrefs(pl);
  const pz=me.prefs&&me.prefs.tz;
  if((fresh||!haveTz)&&pz&&String(pz).trim()) applyTzPrefs(String(pz).trim());
}
function wallLabel(iso, withTime){
  const d=new Date(iso); if(!+d) return '';
  const o=withTime
    ?{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}
    :{year:'numeric',month:'2-digit',day:'2-digit'};
  try{o.timeZone=uiTz()}catch(e){}
  return d.toLocaleString(uiLocale(), o);
}
function periodLabel(){
  const id=RANGE.id||'today';
  if((id==='dates'||id==='times')&&RANGE.from&&RANGE.to){
    const a=wallLabel(RANGE.from, id==='times'), b=wallLabel(RANGE.to, id==='times');
    if(a&&b) return a+' – '+b;
  }
  return tr('period.'+id);
}
function syncHours(){
  let span=null;
  if((RANGE.id==='dates'||RANGE.id==='times')&&RANGE.from&&RANGE.to) span={from:new Date(RANGE.from),to:new Date(RANGE.to)};
  if(!span||!(+span.to>+span.from)) span=periodSpan(RANGE.id==='dates'||RANGE.id==='times'?'today':(RANGE.id||'today'), new Date(), uiTz());
  HOURS=Math.max(1, Math.round((+span.to-+span.from)/3600000));
}
function rangeBounds(){
  if((RANGE.id==='dates'||RANGE.id==='times')&&RANGE.from&&RANGE.to){
    const from=new Date(RANGE.from), to=new Date(RANGE.to);
    if(+to>+from) return {from,to};
  }
  return periodSpan(RANGE.id==='dates'||RANGE.id==='times'?'today':(RANGE.id||'today'), new Date(), uiTz());
}
function rangeQS(){const s=rangeBounds(); return `from=${encodeURIComponent(s.from.toISOString())}&to=${encodeURIComponent(s.to.toISOString())}`}
function applyRange(id, extra){
  RANGE_HOLD=null;
  const box=q('#range-fields'); if(box) box.hidden=true;
  RANGE={id, from:extra&&extra.from||RANGE.from, to:extra&&extra.to||RANGE.to};
  try{localStorage.setItem(RANGE_KEY, JSON.stringify(RANGE))}catch(e){}
  syncHours(); paintChrome(); PERF=null; render();
}
let RANGE_HOLD=null;
function placeRange(){
  const box=q('#range-fields'), b=q('#period');
  if(!box||!b||box.hidden) return;
  const r=b.getBoundingClientRect(), maxW=innerWidth-16;
  box.style.maxWidth=maxW+'px';
  const w=Math.min(280,maxW);
  box.style.top=(r.bottom+6)+'px';
  box.style.left=Math.max(8, Math.min(r.right-w, innerWidth-w-8))+'px';
  const h1=q('#view h1');
  if(h1){
    const hb=h1.getBoundingClientRect(), bb=box.getBoundingClientRect();
    if(bb.top<hb.bottom&&bb.bottom>hb.top&&bb.left<hb.right&&bb.right>hb.left)
      box.style.top=(hb.bottom+6)+'px';
  }
}
function closeRange(){
  const box=q('#range-fields'); if(!box||box.hidden) return;
  box.hidden=true;
  if(RANGE_HOLD){ RANGE.id=RANGE_HOLD; RANGE_HOLD=null; }
}
function openCustom(id){
  const box=q('#range-fields'); if(!box) return;
  if(box.hidden) RANGE_HOLD=RANGE.id;
  RANGE.id=id;
  box.hidden=false;
  const typ=id==='times'?'datetime-local':'date';
  q('#range-a').type=typ; q('#range-b').type=typ;
  placeRange();
}
function paintChrome(){
  document.title=BRAND.name||'TDS';
  document.documentElement.lang=uiLang();
  paintNav();
  const b=q('#period'); if(b){const lab=periodLabel(); const pt=q('#period-text'); if(pt) pt.textContent=lab; b.title=lab;}
  const nb=q('#navburger');
  if(nb&&!nb.dataset.wired){
    nb.dataset.wired='1';
    nb.innerHTML=icon('menu');
    nb.title=tr('nav.menu');
    nb.onclick=e=>{
      e.stopPropagation();
      const st=navState();
      const items=[];
      let dropped=false;
      for(const id of st.order){
        if(st.hidden[id]||!pageAllowed(ME,id)) continue;
        if(REPORT_IDS.includes(id)){
          if(!dropped){
            items.push({cap:tr('nav.reports')});
            REPORT_IDS.filter(r=>!st.hidden[r]&&pageAllowed(ME,r)).forEach(r=>items.push({label:tr('nav.'+r), title:tr('nav.'+r), sub:true, on:()=>go(r)}));
            dropped=true;
          }
          continue;
        }
        items.push({label:tr('nav.'+id), title:tr('nav.'+id), on:()=>go(id)});
      }
      const more=navHidden(st).filter(id=>pageAllowed(ME,id)); if(more.length){items.push('-'); items.push({cap:tr('nav.more')}); more.forEach(id=>items.push({label:tr('nav.'+id), title:tr('nav.'+id), sub:true, on:()=>go(id)}))}
      menu(nb, items);
    };
  }
  if(nb) nb.title=tr('nav.menu');
}

/* ---------- API ---------- */
async function call(method,path,body){
  const o={method,credentials:'same-origin',headers:{}};
  if(method!=='GET'){o.headers['X-CSRF-Token']=CSRF;if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}}
  const r=await fetch(path,o);
  let j=null; try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=='/api/login'&&path!=='/api/me'){loginView();throw new Error('session expired')}
  if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;throw e}
  return j;
}
// callRaw sends a body that is not JSON, with the same session and CSRF header as call.
// method is the HTTP verb. path is the request path. body is sent as-is (bytes or text).
// contentType is the Content-Type header; an empty value omits the header.
// It returns the parsed JSON body, or null when the response is not JSON.
// A 401 opens the login screen and throws. Any other failed status throws Error with status.
async function callRaw(method,path,body,contentType){
  const o={method,credentials:'same-origin',headers:{}};
  if(method!=='GET'&&method!=='HEAD'){
    o.headers['X-CSRF-Token']=CSRF;
    if(contentType) o.headers['Content-Type']=contentType;
    if(body!==undefined) o.body=body;
  }
  const r=await fetch(path,o);
  let j=null; try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=='/api/login'&&path!=='/api/me'){loginView();throw new Error('session expired')}
  if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;throw e}
  return j;
}
// get: a read that degrades to a default instead of failing the page.
const get=(path,def)=>call('GET',path).catch(()=>def);

/* ---------- theme: light / dark, remembered per browser ---------- */
const THEME_KEY='kuztds-theme';
const ACCENT_KEY='kuztds-accent';
const ACCENTS=['violet','blue','green','graphite'];
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
/** currentAccent reads the chosen accent from the document, then from storage.
 * @return {string} an id from ACCENTS; violet when the stored value is missing or unknown. */
function currentAccent(){
  let id=document.documentElement.getAttribute('data-accent')||'';
  if(!id){try{id=localStorage.getItem(ACCENT_KEY)||''}catch(e){id=''}}
  return ACCENTS.includes(id)?id:'violet';
}
/** applyAccent remembers the accent and paints it. Violet is the default and drops the attribute.
 * @param {string} id accent id; anything outside ACCENTS becomes violet.
 * @return {void} */
function applyAccent(id){
  if(!ACCENTS.includes(id)) id='violet';
  try{localStorage.setItem(ACCENT_KEY,id)}catch(e){}
  if(id==='violet') document.documentElement.removeAttribute('data-accent');
  else document.documentElement.setAttribute('data-accent',id);
  themeChanged();
}
/** paintSwatches marks the swatch that matches the saved accent.
 * @return {void} */
function paintSwatches(){
  const cur=currentAccent();
  qa('[data-accent-pick]').forEach(b=>b.classList.toggle('on', b.dataset.accentPick===cur));
}
function toggleTheme(){
  const t=isDark()?'light':'dark';
  try{localStorage.setItem(THEME_KEY,t)}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  themeChanged();
}
function themeChanged(){
  qa('[data-theme-btn]').forEach(b=>{b.innerHTML=icon(isDark()?'sun':'moon');b.title=isDark()?tr('Light theme'):tr('Dark theme')});
  if(q('#chart'))drawChart(q('#chart'),CH.pts);
  drawWires();
  CODE_EDITORS.forEach(e=>e.setTheme());
}

/** bindFilePick accepts a dropped file on a file control and fires its change handler.
 * @param {Element|null} wrap the .filepick element that contains the file input.
 * @return {void} */
function bindFilePick(wrap){
  if(!wrap) return;
  const input=q('input[type=file]',wrap);
  if(!input) return;
  wrap.addEventListener('dragover',e=>{e.preventDefault(); wrap.classList.add('drag')});
  wrap.addEventListener('dragleave',e=>{if(e.relatedTarget&&wrap.contains(e.relatedTarget))return; wrap.classList.remove('drag')});
  wrap.addEventListener('drop',e=>{
    e.preventDefault();
    wrap.classList.remove('drag');
    const files=e.dataTransfer&&e.dataTransfer.files;
    if(!files||!files.length) return;
    try{
      const dt=new DataTransfer();
      const n=input.multiple?files.length:1;
      for(let i=0;i<n;i++) dt.items.add(files[i]);
      input.files=dt.files;
    }catch(err){return}
    input.dispatchEvent(new Event('change'));
  });
}
/** cropExport cuts the crop rectangle out of the source and encodes a logo.
 * @param {HTMLImageElement} img loaded source image.
 * @param {{x:number,y:number,w:number,h:number}} rect crop rectangle in canvas pixels.
 * @param {number} scale canvas pixels per source pixel.
 * @return {string|null} a png or jpeg data URL, or null when the result is still too large. */
function cropExport(img,rect,scale){
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  let sx=rect.x/scale, sy=rect.y/scale, sw=rect.w/scale, sh=rect.h/scale;
  if(sx<0){sw+=sx; sx=0}
  if(sy<0){sh+=sy; sy=0}
  if(sx+sw>iw) sw=iw-sx;
  if(sy+sh>ih) sh=ih-sy;
  if(!(sw>0)||!(sh>0)) return null;
  const k=Math.min(1,256/Math.max(sw,sh));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw*k));
  c.height=Math.max(1,Math.round(sh*k));
  const g=c.getContext('2d');
  if(!g) return null;
  g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  let url=c.toDataURL('image/png');
  if(url.length>270000){
    g.globalCompositeOperation='destination-over'; g.fillStyle='#ffffff'; g.fillRect(0,0,c.width,c.height);
    url=c.toDataURL('image/jpeg',.85);
  }
  if(url.length>270000){toast(tr('company.logo.big'),true); return null}
  return url;
}
/** cropRender clamps the crop rectangle inside the canvas and places the frame and handles.
 * @param {{cw:number,ch:number,x:number,y:number,w:number,h:number,square:boolean,box:Element,stage:Element}} state crop geometry in canvas pixels.
 * @return {void} */
function cropRender(state){
  const cw=state.cw, ch=state.ch, min=Math.min(16,cw,ch);
  let x=state.x, y=state.y, w=state.w, h=state.h;
  if(state.square){
    let s=Math.max(Math.min(w,h),min);
    s=Math.min(s,cw,ch);
    w=s; h=s;
  }else{
    w=Math.min(Math.max(w,min),cw);
    h=Math.min(Math.max(h,min),ch);
  }
  if(x<0) x=0;
  if(y<0) y=0;
  if(x+w>cw) x=Math.max(0,cw-w);
  if(y+h>ch) y=Math.max(0,ch-h);
  state.x=x; state.y=y; state.w=w; state.h=h;
  const view=state.stage.getBoundingClientRect();
  const kx=view.width>0?view.width/cw:1, ky=view.height>0?view.height/ch:1;
  const box=state.box;
  box.style.left=(x*kx)+'px';
  box.style.top=(y*ky)+'px';
  box.style.width=(w*kx)+'px';
  box.style.height=(h*ky)+'px';
}
/** cropImage opens a crop dialog for a logo data URL.
 * @param {string} dataURL image data URL from the file reader.
 * @param {boolean} keepAsIs when true the frame and the crop action stay hidden.
 * @return {Promise<string|null>} cropped data URL, the original, or null if cancelled. */
function cropImage(dataURL,keepAsIs){
  return new Promise(res=>{
    const sc=$('<div class="scrim" style="z-index:74"></div>');
    const body=keepAsIs
      ?`<p>${esc(tr('crop.svg'))}</p><img alt="" draggable="false" src="${esc(dataURL)}" style="max-width:100%;max-height:300px;display:block">`
      :`<div class="crop-stage"><canvas></canvas><div class="crop-box"><span class="crop-h h-nw" data-h="nw"></span><span class="crop-h h-ne" data-h="ne"></span><span class="crop-h h-sw" data-h="sw"></span><span class="crop-h h-se" data-h="se"></span></div></div><div class="vseg" style="margin-top:10px"><button type="button" data-ratio="free" class="on">${esc(tr('crop.free'))}</button><button type="button" data-ratio="1">${esc(tr('crop.square'))}</button></div>`;
    const apply=keepAsIs?'':`<button type="button" class="primary" data-apply>${esc(tr('crop.apply'))}</button>`;
    const m=$(`<div class="modal" role="dialog" style="width:min(560px,92vw)"><h3>${esc(tr('crop.title'))}</h3>${body}<div class="row"><div class="spacer"></div><button type="button" data-no>${tr('Cancel')}</button><button type="button" data-fit>${esc(tr('crop.fit'))}</button>${apply}</div></div>`);
    let dead=false, ro=null;
    const done=v=>{if(dead)return; dead=true; if(ro) ro.disconnect(); window.removeEventListener('hashchange',onHash); sc.remove(); m.remove(); document.removeEventListener('keydown',key,true); res(v)};
    const onHash=()=>done(null);
    const key=e=>{if(e.key==='Escape'){e.stopImmediatePropagation(); done(null)}};
    sc.onclick=()=>done(null);
    q('[data-no]',m).onclick=()=>done(null);
    q('[data-fit]',m).onclick=()=>done(dataURL);
    document.addEventListener('keydown',key,true);
    window.addEventListener('hashchange',onHash);
    document.body.append(sc,m);
    const first=q('[data-apply]',m)||q('[data-no]',m); if(first) first.focus();
    if(keepAsIs) return;
    const img=new Image();
    img.onload=()=>{
      if(dead) return;
      const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
      if(!iw||!ih){done(null); return}
      const fit=Math.min(480/iw,300/ih), cw=Math.max(1,Math.round(iw*fit)), ch=Math.max(1,Math.round(ih*fit));
      const cvs=q('canvas',m), stage=q('.crop-stage',m), ctx=cvs.getContext('2d');
      if(!ctx){done(null); return}
      cvs.width=cw; cvs.height=ch;
      ctx.drawImage(img,0,0,cw,ch);
      const inset=Math.min(14,Math.max(0,Math.floor((Math.min(cw,ch)-16)/2)));
      const st={scale:fit,cw,ch,x:inset,y:inset,w:cw-inset*2,h:ch-inset*2,square:false,box:q('.crop-box',m),stage};
      cropRender(st);
      ro=('ResizeObserver' in window)?new ResizeObserver(()=>cropRender(st)):null; if(ro) ro.observe(stage);
      let drag=null;
      const pt=e=>{const r=stage.getBoundingClientRect(); return {x:(e.clientX-r.left)*(cw/(r.width||1)), y:(e.clientY-r.top)*(ch/(r.height||1))}};
      stage.addEventListener('pointerdown',e=>{
        const h=e.target.closest('[data-h]');
        const mode=h?h.dataset.h:(e.target.closest('.crop-box')?'move':'');
        if(!mode) return;
        e.preventDefault();
        try{stage.setPointerCapture(e.pointerId)}catch(err){}
        const p=pt(e);
        drag={mode,px:p.x,py:p.y,x:st.x,y:st.y,w:st.w,h:st.h};
      });
      stage.addEventListener('pointermove',e=>{
        if(!drag) return;
        const p=pt(e), dx=p.x-drag.px, dy=p.y-drag.py;
        if(drag.mode==='move'){st.x=drag.x+dx; st.y=drag.y+dy}
        else{
          let L=drag.x, T=drag.y, R=drag.x+drag.w, B=drag.y+drag.h;
          if(drag.mode[0]==='n') T+=dy; else B+=dy;
          if(drag.mode[1]==='w') L+=dx; else R+=dx;
          if(st.square){const s=Math.max(Math.abs(R-L),Math.abs(B-T)); if(drag.mode[1]==='w') L=R-s; else R=L+s; if(drag.mode[0]==='n') T=B-s; else B=T+s}
          st.x=Math.min(L,R); st.y=Math.min(T,B); st.w=Math.abs(R-L); st.h=Math.abs(B-T);
        }
        cropRender(st);
      });
      const stop=()=>{drag=null};
      stage.addEventListener('pointerup',stop);
      stage.addEventListener('pointercancel',stop);
      qa('[data-ratio]',m).forEach(b=>b.onclick=()=>{
        st.square=b.dataset.ratio==='1';
        qa('[data-ratio]',m).forEach(x=>x.classList.toggle('on',x===b));
        if(st.square){const s=Math.min(st.w,st.h); st.w=s; st.h=s}
        cropRender(st);
      });
      q('[data-apply]',m).onclick=()=>done(cropExport(img,{x:st.x,y:st.y,w:st.w,h:st.h},st.scale));
    };
    img.onerror=()=>{if(!dead) done(null)};
    img.src=dataURL;
  });
}

function formModal(title, html, onSave, okLabel){
  closeForm();

  const m=$(`<div class="modal" role="dialog" style="width:min(640px,92vw);max-height:min(86vh,760px);overflow:auto"><h3>${esc(title)}</h3>${html}

  const key=(e)=>{
    if(!FORM||!m.contains(e.target)) return;
    if(e.key==='Escape'){e.stopPropagation();e.preventDefault();closeForm()}
    if(e.key==='Enter'&&!(e.target&&(e.target.tagName==='TEXTAREA'||e.target.hasAttribute('data-chip')))){e.stopPropagation();e.preventDefault();q('[data-yes]',m).click()}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.stopPropagation();e.preventDefault();q('[data-yes]',m).click()}
  };
  sc.onclick=closeForm;
  q('[data-no]',m).onclick=closeForm;
  q('[data-yes]',m).onclick=async()=>{
    const btn=q('[data-yes]',m);
    if(btn.disabled) return;

    try{const res=await onSave(m); closeForm(); if(res!=='stay') render()}
    catch(e){btn.disabled=false; toast(e.message,true)}

  document.addEventListener('keydown', key, true);

  document.body.append(sc,m);
  const first=q('input,select,textarea',m); if(first) first.focus();
  return m;
}

// menu: a popover anchored to an element. items: {label,icon,danger,on} | '-' | {cap} | {html}
let MENU=null;
function closeMenu(){if(MENU){MENU.remove();MENU=null} const line=q('#pagehover'); if(line) line.textContent=''}
function menu(anchor,items,cls){
  closeMenu();
  const m=$(`<div class="menu ${cls||''}"></div>`);
  items.forEach(it=>{
    if(it==='-'){m.appendChild($('<div class="sep"></div>'));return}
    if(it.cap){m.appendChild($(`<div class="cap">${esc(it.cap)}</div>`));return}
    if(it.node){m.appendChild(it.node);return}
    const b=$(`<button class="${it.danger?'danger':''}${it.sub?' sub':''}" ${it.disabled?'disabled':''}${typeof it.title==='string'&&it.title?' title="'+esc(it.title)+'"':''}>${it.icon?icon(it.icon):''}<span>${esc(it.label)}</span></button>`);
    b.onclick=(e)=>{e.stopPropagation();closeMenu();it.on&&it.on()};
    m.appendChild(b);
  });
  m.onclick=e=>e.stopPropagation();
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect(), w=m.offsetWidth, h=m.offsetHeight;
  // Below the anchor when the menu fits, above the anchor when that fits, otherwise clamped to the viewport.
  const end=cls&&String(cls).includes('end');
  const left=end?Math.max(8,r.right-w):Math.min(r.left,innerWidth-w-8);
  const top=r.bottom+6+h+8<=innerHeight?r.bottom+6:(r.top-6-h>=8?r.top-6-h:innerHeight-h-8);
  m.style.left=Math.max(8,left)+'px'; m.style.top=Math.max(8,top)+'px';
  MENU=m;
  return m;
}

function syncSaveBar(){
  let bar=q('#savebar');
  if(!anyDirty()){if(bar)bar.remove();return}
  const what=[flowsDirty()?capFirst(tr('flows')):'',cronDirty()?capFirst(tr('automation')):''].filter(Boolean).join(' '+tr('and')+' ');
  if(!bar){
    bar=$(`<div class="savebar" id="savebar"><span class="dot warn"></span><span id="dirty"></span>
      <button class="discard" id="discard"></button><button class="primary" id="saveall"></button></div>`);
    document.body.appendChild(bar);
    q('#saveall',bar).onclick=saveAll;
    q('#discard',bar).onclick=async()=>{
      if(!await ask(tr('Discard changes?'),tr('Everything changed since the last save will be lost.'),tr('Discard'),true))return;

      if(cronDirty())CRON=JSON.parse(CRON_SAVED);
      closeDrawer(); syncSaveBar(); render();
    };
  }
  q('#discard',bar).textContent=tr('Discard');
  q('#saveall',bar).innerHTML=tr('Save')+'<kbd>⌘S</kbd>';
  q('#dirty',bar).textContent=tr('Unsaved changes in ')+what;
}

function navState(){
  const known=NAV.map(x=>x[0]);
  let order=known.slice(), hidden={};
  try{
    const s=JSON.parse(localStorage.getItem(NAV_KEY)||'');
    if(s&&Array.isArray(s.order)){
      const allow=new Set(known);
      order=s.order.filter(id=>allow.has(id));
      known.forEach(id=>{if(!order.includes(id)) order.push(id)});
      if(s.hidden&&typeof s.hidden==='object') hidden=s.hidden;
    }
  }catch(e){}
  return {order,hidden};
}

function paintFlags(root){
  if(!root) return;
  const skip=new Set(['INPUT','TEXTAREA','CODE','SCRIPT','STYLE','OPTION','SELECT']);
  const list=[];
  const walk=n=>{
    if(!n) return;
    if(n.nodeType===3){ if(/[\uD83C][\uDDE6-\uDDFF]/.test(n.nodeValue||'')) list.push(n); return }
    if(n.nodeType!==1||skip.has(n.tagName)) return;
    for(const c of n.childNodes) walk(c);
  };
  walk(root);
  for(const n of list){
    const s=n.nodeValue, frag=document.createDocumentFragment();
    let i=0, plain='';
    while(i<s.length){
      const a=s.codePointAt(i), b=s.codePointAt(i+2);
      if(a>=0x1F1E6&&a<=0x1F1FF&&b>=0x1F1E6&&b<=0x1F1FF){
        if(plain){frag.append(document.createTextNode(plain)); plain=''}
        const code=String.fromCharCode(a-0x1F1E6+65, b-0x1F1E6+65).toLowerCase();
        const hold=document.createElement('span');
        hold.className='flag';
        hold.innerHTML=flag(code);
        while(hold.firstChild) frag.append(hold.firstChild);
        i+=4;
      }else{plain+=s[i]; i++}
    }
    if(plain) frag.append(document.createTextNode(plain));
    n.replaceWith(frag);
  }
}

let FACTS={ready:false,clicks:[],status:[]}, SPEND=[];
async function loadMoney(qs){
  const rq=qs||rangeQS();
  const [f,s]=await Promise.all([get('/api/stats/facts?'+rq,{ready:false,clicks:[],status:[]}), get('/api/spend',[])]);

/**
 * Share of the spend record window that falls inside the selected period.
 * @param {object} e spend record with from and to
 * @returns {number} share, 0..1
 */
function spendShare(e){
  const b=rangeBounds();
  return overlapShare(+new Date(e.from), +new Date(e.to), +b.from, +b.to);
}
function foldCost(pred){
  const by={};
  for(const e of SPEND){
    const share=spendShare(e);
    if(share<=0) continue;
    let cents=0;
    if(pred){
      let hit=false;
      for(const bucket of e.buckets||[]) if(pred(bucket,e)){ hit=true; cents+=(bucket.cents||0)*share }
      if(!hit) continue;
    } else cents=(e.cents||0)*share;
    const cur=e.currency||'USD';
    by[cur]=(by[cur]||0)+cents;
  }
  return by;
}
function sumClicks(rows){return rows.reduce((a,r)=>({hits:a.hits+(r.hits||0),uniq:a.uniq+(r.uniq||0)}),{hits:0,uniq:0})}
function foldStatus(rows){
  const o={leads:0,sales:0,rej:0,rev:0};
  for(const r of rows){
    if(r.status==='lead'){o.leads+=r.n||0; o.rev+=+r.profit||0}
    else if(r.status==='sale'){o.sales+=r.n||0; o.rev+=+r.profit||0}
    else if(r.status==='rejected') o.rej+=r.n||0;
  }
  return o;
}
function packMetrics(clicks, statuses, costBy){
  const m=foldStatus(statuses);
  const cc=costCode(costBy);
  const costAmt=cc.multi?0:cc.amount;
  return {hits:clicks.hits,uniq:clicks.uniq,leads:m.leads,sales:m.sales,rej:m.rej,conv:m.leads+m.sales,rev:m.rev,costBy,costAmt,profit:m.rev-costAmt,multi:cc.multi};
}
function offerMetrics(id){
  if(!FACTS.ready) return null;
  return packMetrics(sumClicks(FACTS.clicks.filter(r=>r.offer_id===id)), FACTS.status.filter(r=>r.offer_id===id&&!r.group_id), foldCost(b=>b.offer_id===id&&!b.unallocated));
}
function networkMetrics(id){
  if(!FACTS.ready) return null;
  return packMetrics(sumClicks(FACTS.clicks.filter(r=>r.network_id===id)), FACTS.status.filter(r=>r.network_id===id&&!r.group_id), foldCost(b=>b.network_id===id&&!b.unallocated));
}
/**
 * factsIndex groups click and status rows by campaign for the current FACTS object.
 * @returns {{clicks:Map,status:Map}} maps of group_id to rows, stored on FACTS.__idx until FACTS is replaced
 */
function factsIndex(){
  if(FACTS.__idx) return FACTS.__idx;
  const clicks=new Map(), status=new Map();
  const put=(map,row)=>{
    const id=row&&row.group_id;
    if(id==null||id==='') return;
    let list=map.get(id);
    if(!list){list=[]; map.set(id,list)}
    list.push(row);
  };
  for(const r of FACTS.clicks) put(clicks,r);
  for(const r of FACTS.status) put(status,r);
  FACTS.__idx={clicks,status};
  return FACTS.__idx;
}
/**
 * campaignMetrics sums clicks, conversions and spend for one campaign.
 * @param {string} id campaign id
 * @returns {object} packed metrics plus ready
 */
function campaignMetrics(id){
  const idx=factsIndex();
  const clicks=sumClicks(idx.clicks.get(id)||[]);
  const status=FACTS.ready?(idx.status.get(id)||[]).filter(r=>!r.offer_id):[];
  const m=packMetrics(clicks, status, campaignCostOnly(id));
  m.ready=!!FACTS.ready;
  return m;
}
function campaignCostOnly(id){
  const by={};
  for(const e of SPEND){ const share=spendShare(e); if(share<=0||e.group_id!==id) continue; by[e.currency]=(by[e.currency]||0)+(e.cents||0)*share }
  return by;
}
function cellRatio(n,d){return (+d?((n/d)*100).toFixed(2):'0.00')+'%'}
function cellNum(n){return (Number(n)||0).toFixed(4)}
function moneyMap(by, digits){const keys=Object.keys(by||{}); if(!keys.length) return moneyText(0,'',digits==null?4:digits); return keys.map(k=>moneyText((by[k]||0)/100, k, digits==null?4:digits)).join(' · ')}
function campaignMoney(by){return moneyMap(by,4)}
function costCode(by){
  const keys=Object.keys(by||{});
  const nz=keys.filter(k=>(by[k]||0)>0);
  if(nz.length===1) return {code:nz[0], amount:(by[nz[0]]||0)/100, multi:false};
  if(!nz.length&&keys.length===1) return {code:keys[0], amount:0, multi:false};
  return {code:'', amount:0, multi:nz.length>1};
}
function costCodesList(by){
  const keys=Object.keys(by||{}).filter(k=>(by[k]||0)>0);
  if(!keys.length) return moneyText(0, costCode(by).code, 4);
  return keys.map(k=>String(k).toUpperCase()).join(' · ');
}
function metricROI(rev, costBy, ready){
  if(!ready) return '0.00%';
  const by=costBy||{};
  const nonzero=Object.keys(by).filter(k=>(by[k]||0)>0);
  const revN=+rev||0;
  if(!nonzero.length) return revN>0?'100%':'0.00%';
  if(nonzero.length===1){
    const cost=(by[nonzero[0]]||0)/100;
    if(cost<=0) return revN>0?'100%':'0.00%';
    return roiPct(revN, cost).toFixed(2)+'%';
  }
  return nonzero.map(k=>String(k).toUpperCase()).join(' · ');
}
function entityROI(m){
  if(!m) return '0.00%';
  const nz=Object.keys(m.costBy||{}).filter(k=>(m.costBy[k]||0)>0);
  const revN=+m.rev||0;
  if(!nz.length&&revN>0){
    const by=periodSpendBy();
    const cc=costCode(by);
    if(cc.multi||cc.amount>0) return costCodesList(by);
  }
  return metricROI(m.rev, m.costBy, true);
}
function cpcCell(m){
  const by=m&&m.costBy;
  const cc=costCode(by);
  if(cc.multi) return costCodesList(by);
  if(!cc.code&&Object.keys(by||{}).length) return bareMoney(0, 4);
  if(!m||!m.hits) return moneyText(0, cc.code, 4);
  return moneyText(cc.amount/m.hits, cc.code, 4);
}
function moneyOf(n, by, ready, digits){
  const d=digits==null?2:digits;
  const cc=costCode(by);
  const unlabeled=!cc.code&&Object.keys(by||{}).length>0;
  if(!ready){
    if(cc.multi&&d===4) return costCodesList(by);
    if(unlabeled) return bareMoney(0, d);
    return moneyText(0, cc.code, d);
  }
  if(cc.multi&&d===4) return costCodesList(by);
  if(unlabeled) return bareMoney(n, d);
  return moneyText(n, cc.code, d);
}
function profitOf(rev, costBy, ready){
  const cc=costCode(costBy);
  const unlabeled=!cc.code&&Object.keys(costBy||{}).length>0;
  if(!ready){
    if(unlabeled) return bareMoney(0, 2);
    return moneyText(0, cc.code, 2);
  }
  if(cc.multi) return bareMoney(rev||0, 2)+' · '+moneyMap(costBy, 4);
  if(unlabeled) return bareMoney(rev||0, 2);
  return moneyText((rev||0)-cc.amount, cc.code, 2);
}
function periodSpendRev(){
  if(!FACTS.ready) return 0;
  return FACTS.status.filter(r=>r.group_id&&!r.offer_id&&(r.status==='lead'||r.status==='sale')).reduce((a,r)=>a+(+r.profit||0),0);
}
function periodSpendBy(){
  const by={};
  for(const e of SPEND||[]){ const share=spendShare(e); if(share<=0) continue; by[e.currency]=(by[e.currency]||0)+(e.cents||0)*share }
  return by;
}
function periodROI(){return metricROI(periodSpendRev(), periodSpendBy(), FACTS.ready)}
function dashSpend(){return moneyMap(periodSpendBy(),4)}
function dashROI(){return metricROI(periodSpendRev(), periodSpendBy(), FACTS.ready)}
function profitCls(m){if(!m||m.multi) return ''; return m.profit>0?'ok':m.profit<0?'bad':''}
function offerCells(m, id){
  if(!m) m={hits:0,uniq:0,leads:0,sales:0,rej:0,rev:0,costBy:{}};
  const td=(html,cls)=>`<td class="num${cls?' '+cls:''}">${html}</td>`;
  if(id==='clicks') return td(fmt(m.hits));
  if(id==='uniq') return td(fmt(m.uniq));
  if(id==='leads') return td(fmt(m.leads));
  if(id==='sales') return td(fmt(m.sales));
  if(id==='rej') return td(fmt(m.rej));
  if(id==='cr') return td(cellRatio(m.leads+m.sales,m.hits));
  if(id==='uepc') return td(moneyOf(m.uniq?m.rev/m.uniq:0, m.costBy, !!m.uniq, 4));
  if(id==='epc') return td(moneyOf(m.hits?m.rev/m.hits:0, m.costBy, !!m.hits, 4));
  if(id==='cpc') return td(cpcCell(m));
  if(id==='revenue') return td(moneyOf(m.rev, m.costBy, true));
  if(id==='cost') return td(moneyMap(m.costBy,4));
  if(id==='profit') return td(profitOf(m.rev, m.costBy, true), profitCls(m));
  if(id==='roi') return td(entityROI(m));
  if(id==='crok') return td(cellRatio(m.sales,m.hits));
  if(id==='crrej') return td(cellRatio(m.rej,m.hits));
  return '<td></td>';
}

/**
 * metricSortValue is the number a metric column sorts by, using the same fields as the cells.
 * @param {object|null} m packed metrics, or null when facts are not ready
 * @param {string} k column id
 * @returns {number} sort key; a missing metric is 0
 */
function metricSortValue(m, k){
  const hits=m?+m.hits||0:0, uniq=m?+m.uniq||0:0, leads=m?+m.leads||0:0, sales=m?+m.sales||0:0, rej=m?+m.rej||0:0, rev=m?+m.rev||0:0;
  const cc=costCode(m&&m.costBy);
  const cost=cc.multi?0:+cc.amount||0;
  const div=(n,d)=>d>0?n/d:0;
  if(k==='clicks'||k==='hits') return hits;
  if(k==='uniq') return uniq;
  if(k==='leads') return leads;
  if(k==='sales') return sales;
  if(k==='rej') return rej;
  if(k==='conv') return m&&m.conv!=null?+m.conv||0:leads+sales;
  if(k==='revenue') return rev;
  if(k==='cost') return cost;
  if(k==='profit') return rev-cost;
  if(k==='cr') return div(leads+sales, hits);
  if(k==='crok') return div(sales, hits);
  if(k==='crrej') return div(rej, hits);
  if(k==='epc') return div(rev, hits);
  if(k==='uepc') return div(rev, uniq);
  if(k==='cpc') return div(cost, hits);
  if(k==='roi') return roiPct(rev, cost);
  return 0;
}
/**
 * networkSortValue is the key one network column sorts by.
 * @param {object} n network
 * @param {string} k column id
 * @param {object|null} m metrics already computed for this network
 * @returns {number|string} raw id (sorted numerically, then by its text), the name, or a metric number
 */
function networkSortValue(n, k, m){
  if(k==='id') return n&&n.id!=null?n.id:'';
  if(k==='name') return (n&&n.name)||'';
  if(k==='group') return (n&&n.group)||'';
  return metricSortValue(m, k);
}
/**
 * sortableHead renders visible columns as sort buttons.
 * @param {string} kind column catalog, used when cols is omitted
 * @param {{k:string,dir:number}} state active column and direction; dir below 0 is descending
 * @param {Array<{id:string,label:string,on:boolean}>} cols columns to show
 * @param {Set<string>|string[]} textIds columns that are not numeric
 * @returns {string} joined th markup
 */
function sortableHead(kind, state, cols, textIds){
  const text=textIds instanceof Set?textIds:new Set(textIds||[]);
  const list=(Array.isArray(cols)?cols:loadCols(kind)).filter(c=>c&&c.on);
  const st=state||{k:'',dir:-1};
  return list.map(c=>{
    const num=!text.has(c.id);
    const arrow=st.k===c.id?(st.dir<0?' ↓':' ↑'):'';
    return `<th${num?' class="num"':''}><button type="button" class="link" data-sort="${c.id}">${tr(c.label)}${arrow}</button></th>`;
  }).join('');
}
/**
 * applySort returns a sorted copy. Text columns use localeCompare; other columns use +v||0, and equal numbers keep the string order of the raw values.
 * @param {Array} rows source rows
 * @param {{k:string,dir:number}} state column id and direction
 * @param {function} valueOf (row, columnId) => sort value
 * @param {Set<string>|string[]} textIds columns compared as text
 * @returns {Array} sorted copy; the input array is left unchanged
 */
function applySort(rows, state, valueOf, textIds){
  const list=Array.isArray(rows)?rows.slice():[];
  const k=state&&state.k;
  if(!k||typeof valueOf!=='function') return list;
  const text=textIds instanceof Set?textIds:new Set(textIds||[]);
  const dir=(state.dir||1)<0?-1:1;
  const asText=text.has(k);
  list.sort((a,b)=>{
    const va=valueOf(a,k), vb=valueOf(b,k);
    const sa=String(va==null?'':va), sb=String(vb==null?'':vb);
    if(asText) return sa.localeCompare(sb)*dir;
    const na=+va||0, nb=+vb||0;
    if(na!==nb) return (na-nb)*dir;
    return sa.localeCompare(sb)*dir;
  });
  return list;
}

function chartAmt(n, code, digits){return moneyText(n, code, digits==null?4:digits)}
function openSpend(){
  const by={}, rows=[];
  for(const e of SPEND||[]){
    const share=spendShare(e);
    if(share<=0) continue;
    rows.push(e);
    by[e.currency]=(by[e.currency]||0)+(e.cents||0)*share;
  }
  const cc=costCode(by);
  return {rows, by, keys:Object.keys(by), code:cc.code, cost:cc.amount, multi:cc.multi};
}
function annotateChart(raw){
  const ready=!!FACTS.ready;
  const spend=openSpend();
  const cc=costCode(spend.by);
  const moneyAxis=!!cc.code||!spend.keys.length;
  const cur=cc.code||'';
  const step=raw.length>1?(+new Date(raw[1].ts)-+new Date(raw[0].ts)):(HOURS>48?86400000:3600000);
  const rows=raw.map((p,i)=>{
    const start=new Date(p.ts);
    const end=raw[i+1]?new Date(raw[i+1].ts):new Date(+start+(step>0?step:3600000));
    let cents=0;
    if(moneyAxis){
      for(const e of spend.rows){
        if(cur&&e.currency!==cur) continue;
        const from=new Date(e.from), to=new Date(e.to);
        cents+=(e.cents||0)*overlapShare(+from,+to,+start,+end);
      }
    }
    const cost=moneyAxis?cents/100:null;
    const costBy=moneyAxis?(cents>0?{[cur||'USD']:cents}:{}):null;
    const revenue=ready?(+p.revenue||0):null;
    const conv=ready?+p.conv||0:null;
    const profit=moneyAxis&&ready&&revenue!=null&&cost!=null?revenue-cost:null;
    const cr=ready?ratioPct(conv,+p.total||0):null;
    const roi=moneyAxis&&ready&&cost>0?roiPct(revenue,cost):null;
    return {ts:p.ts,total:+p.total||0,unique:+p.unique||0,bots:+p.bots||0,conv,revenue,cost,profit,cr,roi,costBy};
  });
  return {rows, cur, ready, spend, moneyAxis};
}

// loadBreakdown fills one breakdown card. dim is the field name.
// boxId, when set, is the element id of the custom card. It returns nothing.
// A failed classic card is removed. A failed custom card stays so another field can be chosen.
async function loadBreakdown(dim, boxId){
  const sel=boxId?'#'+boxId:'#bd-'+dim;
  if(!q(sel)) return;
  const qs=new URLSearchParams(rangeQS());
  qs.set('dim', dim==='group'?'campaign':dim);
  qs.set('limit','6');
  condsQS(DASH.conds).forEach((v,k)=>qs.append(k,v));
  const kv=await call('GET','/api/stats/breakdown?'+qs.toString()).catch(()=>null);
  const box=q(sel); if(!box)return;
  if(kv===null){
    if(boxId){box.innerHTML='<span class="muted">'+tr('no data')+'</span>'; return}
    const c=box.closest('[data-bd]'); if(c) c.remove(); return;
  }
  const rows=kv.filter(x=>x.key&&x.key!=='-');
  if(!rows.length){box.innerHTML='<span class="muted">'+tr('no data')+'</span>';return}
  const max=Math.max(...rows.map(x=>x.count));
  box.innerHTML=rows.map(x=>{
    const key=String(x.key||'');
    const label=dim==='device'?deviceLabel(key):key;
    return `<div><span class="k" title="${esc(key)}">${dim==='country'?`<span class="flag">${flag(key)}</span>`:''}${esc(label)}</span><span class="tr"><i style="width:${Math.max(2,Math.round(x.count/max*100))}%"></i></span><span class="n">${fmt(x.count)}</span></div>`;
  }).join('');
}
// Performance rows folded into config order: flow → its streams, the fallback
// ("-": no stream matched) last, then flows that exist only in the data.
function perfTree(groups){
  const nodes=new Map(), order=[];
  groups.forEach(g=>{const n={id:g.id,name:g.name||'',known:true,order:(g.streams||[]).map(s=>s.name),streams:new Map()};nodes.set('id:'+g.id,n);order.push(n)});
  const byName=(r)=>order.find(n=>n.known&&n.name===r.group)||null;
  (DASH_PERF||PERF||[]).forEach(r=>{
    let n=r.group_id?nodes.get('id:'+r.group_id):byName(r);
    if(!n){const k=r.group_id?'id:'+r.group_id:'nm:'+r.group;n=nodes.get(k);
      if(!n){n={id:r.group_id||r.group||'(unknown)',name:r.group_id?r.group:'',known:false,order:[],streams:new Map()};nodes.set(k,n);order.push(n)}}
    n.streams.set(r.stream,add(n.streams.get(r.stream)||Object.assign(zero(),{stream:r.stream}),r));
  });
  return order.map(n=>{const rows=[...n.streams.values()];return {...n,rows,tot:rows.reduce(add,zero())}}).filter(n=>n.rows.length);
}
function perfSorted(groups){
  const tree=perfTree(groups), {k,d}=PSORT;
  const cmp=perfCmp(k,d);
  if(k!=='name')tree.sort((a,b)=>cmp(a.tot,b.tot));
  tree.forEach(n=>{
    if(k==='name'){const idx=s=>s.stream==='-'?1e9:(n.order.indexOf(s.stream)+1||1e8);n.rows.sort((a,b)=>idx(a)-idx(b))}
    else n.rows.sort(cmp);
  });
  return tree;
}
function renderPerf(groups){

// Counts on the left axis. Percents (CR, ROI) on their own 0..100 scale, drawn
// without labels while any count line is visible, labelled with % when only
// percent lines are on. Money on the right only with one currency. A point's ROI

function cssVar(k){return getComputedStyle(document.documentElement).getPropertyValue(k).trim()}
/**
 * Paints the dashboard chart. Counts take the left axis; percents take it only when no count series is visible. Money takes the right axis. Percent series are a stroke with no fill. An isolated point is drawn as a dot.
 * @param {HTMLCanvasElement} cv canvas; nothing is drawn when it is missing
 * @param {object[]} pts points for the period; a null field is a gap
 * @param {number|null} hover index of the point under the pointer
 * @returns {void}
 */
function drawChart(cv,pts,hover){
  if(!cv)return; pts=pts||[];
  const cur=CH.cur||'', ready=!!CH.ready, money=!!CH.moneyAxis;
  const c={grid:cssVar('--border'),text:cssVar('--muted'),ring:cssVar('--surface')};
  CH_SERIES.forEach(s=>{c[s.color]=cssVar('--chart-'+s.color)});
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||600, H=260;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  if(!pts.length){CH={pts:[],x:[],cur,ready,moneyAxis:money};g.fillStyle=c.text;g.font='13px system-ui,sans-serif';g.fillText(tr('No data for the period'),12,24);return}
  const hideM=hiddenCols(ME);
  const vis=CH_SERIES.filter(s=>!CH_HIDE.has(s.id)&&!hideM.has(s.id)&&(s.axis!=='m'||money)&&pts.some(p=>p[s.id]!=null&&!Number.isNaN(+p[s.id])));
  const N=vis.filter(s=>s.axis==='n'), M=vis.filter(s=>s.axis==='m'), P=vis.filter(s=>s.axis==='p');
  const range=list=>{let lo=Infinity,hi=-Infinity; pts.forEach(p=>list.forEach(s=>{const v=p[s.id]; if(v==null||Number.isNaN(+v)) return; lo=Math.min(lo,+v); hi=Math.max(hi,+v)})); return lo===Infinity?{lo:0,hi:0}:{lo,hi}};
  const sN=N.length?axisScale(0,range(N).hi,true):null;
  const sM=M.length?(r=>axisScale(r.lo,r.hi,false))(range(M)):null;
  const sP=P.length?(r=>axisScale(Math.min(0,r.lo), P.some(s=>s.id==='roi')?Math.max(100,r.hi):r.hi, false))(range(P)):null;
  const sL=sN||sP;
  g.font='11px system-ui,sans-serif';
  const lab=v=>sN?fmt(v):(v+'%');
  const rightLab=v=>moneyText(v,cur,tickDecimals(sM.step));
  const maxWidth=ts=>ts.reduce((m,t)=>Math.max(m,Math.ceil(g.measureText(String(t)).width)),0);
  const L=sL?maxWidth(sL.ticks.map(lab))+16:12;
  const R=sM?maxWidth(sM.ticks.map(rightLab))+16:12;
  const T=14,B=26,w=W-L-R,h=H-T-B;
  const x=i=>L+(pts.length<2?w/2:i/(pts.length-1)*w);
  const yOf=sc=>v=>T+h-((+v||0)-sc.lo)/(sc.hi-sc.lo)*h;
  const scaleOf=s=>s.axis==='n'?sN:s.axis==='m'?sM:sP;
  CH={pts,x:pts.map((_,i)=>x(i)),cur,ready,moneyAxis:money};
  const gridScale=sL||sM;
  g.strokeStyle=c.grid;g.lineWidth=1;g.fillStyle=c.text;g.font='11px system-ui,sans-serif';
  if(gridScale){
    gridScale.ticks.forEach(v=>{const yy=yOf(gridScale)(v);g.beginPath();g.moveTo(L,yy);g.lineTo(L+w,yy);g.stroke()});
    if(sL){g.textAlign='right'; sL.ticks.forEach(v=>g.fillText(lab(v),L-8,yOf(sL)(v)+4))}
    if(sM){g.textAlign='left'; sM.ticks.forEach(v=>g.fillText(rightLab(v),L+w+6,yOf(sM)(v)+4))}
  }
  const gap=pts.length>1?(+new Date(pts[1].ts)-+new Date(pts[0].ts)):0;
  const daily=gap>=20*3600000||(!gap&&HOURS>48);
  const gapH=Math.max(1,Math.round((gap||3600000)/3600000));
  const withTZ=o=>{try{o.timeZone=uiTz()}catch(e){} return o};
  const dateText=d=>d.toLocaleDateString(uiLocale(),withTZ({month:'short',day:'numeric'}));
  const timeText=d=>d.toLocaleTimeString(uiLocale(),withTZ({hour:'2-digit',minute:'2-digit'}));
  const localHM=d=>{let hp; try{hp=zonedParts(d,uiTz())}catch(e){hp=null} return {h:hp?hp.h:d.getHours(), min:hp?hp.min:d.getMinutes()}};
  const sample=new Date(pts[0].ts);
  const labelPx=Math.max(g.measureText(dateText(sample)).width, g.measureText(timeText(sample)).width)+10;
  const tickText=d=>{
    if(daily) return dateText(d);
    const hm=localHM(d);
    if(hm.h===0&&hm.min===0) return d.toLocaleDateString(uiLocale(),withTZ({day:'numeric',month:'short'}));
    return timeText(d);
  };
  let idxs;
  if(daily){
    const step=tickEvery(pts.length,w,labelPx,[1,2,7,14,30]);
    idxs=pts.map((_,i)=>i).filter(i=>i%step===0);
  }else{
    const step=tickEvery(pts.length,w,labelPx,[1,2,3,4,6,12,24]);
    const mod=step*gapH;
    idxs=[];
    pts.forEach((p,i)=>{const hm=localHM(new Date(p.ts)); if(hm.h%mod===0&&hm.min===0) idxs.push(i)});
    if(!idxs.length) idxs=pts.map((_,i)=>i).filter(i=>i%step===0);
  }
  g.fillStyle=c.text; g.font='11px system-ui,sans-serif'; g.textAlign='left';
  let lastRight=-Infinity;
  idxs.forEach(i=>{
    const text=tickText(new Date(pts[i].ts));
    const tw=g.measureText(text).width;
    const lx=Math.max(2,Math.min(W-2-tw, x(i)-tw/2));
    if(lx>lastRight+4){g.fillText(text,lx,H-8); lastRight=lx+tw}

    pts.forEach((p,i)=>{
      const v=p[key];
      if(v==null||Number.isNaN(+v)){pen=false;return}
      const X=x(i), Y=yOf(+v);
      if(!pen){g.moveTo(X,Y);pen=true} else g.lineTo(X,Y);

    const nb=j=>j<0||j>=pts.length?null:pts[j][key];
    pts.forEach((p,i)=>{
      const v=p[key];

    });
  };
  const fillUnder=(key,yOf,color,baseY)=>{
    const grd=g.createLinearGradient(0,T,0,T+h);grd.addColorStop(0,color+'40');grd.addColorStop(1,color+'05');
    g.beginPath();
    let started=false, firstI=0, lastI=0;
    pts.forEach((p,i)=>{
      const v=p[key];
      if(v==null||Number.isNaN(+v)) return;
      if(!started){g.moveTo(x(i),yOf(+v));firstI=i;started=true}else g.lineTo(x(i),yOf(+v));

  };
  vis.forEach(s=>{
    const y=yOf(scaleOf(s));
    if(s.axis==='n'||s.axis==='m') fillUnder(s.id,y,c[s.color],y(0));
    stroke(s.id,y,c[s.color],s.dash);

    const X=x(hover);g.strokeStyle=c.grid;g.lineWidth=1;g.setLineDash([]);g.beginPath();g.moveTo(X,T);g.lineTo(X,T+h);g.stroke();
    vis.forEach(s=>{

      const Y=yOf(scaleOf(s))(+pts[hover][s.id]);
      g.beginPath();g.arc(X,Y,4,0,7);g.fillStyle=c[s.color];g.fill();g.strokeStyle=c.ring;g.lineWidth=2;g.stroke();
    });
  }
}

/* ==================================================================
   FLOWS — a flow (a group in the config) is an ordered list of streams.
   A stream is a rule: WHEN (conditions) → THEN (destination). The engine
   tries them top to bottom and the first match wins; what matches nothing
   gets the flow's default.

   The flow page draws exactly that: visitors enter at the top and fall
   down a trunk; each stream is a branch off it to a destination, and the
   trunk ends in the default. Line widths follow the traffic of the
   selected period, so the picture is also the report. Streams are
   reordered by dragging; a stream can also send visitors on to another
   flow.
   ================================================================== */

// ---- pure: begin ----
// Stored values ↔ what a person reads and edits. Nothing here touches the
// page: web_logic_test.go runs this block under node.
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK=[1,2,3,4,5,6,0];   // shown Monday first; the config is indexed by weekday
const DIST={random:'at random',rotator:'in turn per visitor',evenly:'evenly in turn'};

// A typed or pasted list: commas, new lines and "|" all separate values.
// Repeats are dropped — in any letter case unless cs (case-sensitive) is set.
function splitList(s,cs){return uniq(String(s==null?'':s).split(/[,|\n]/).map(x=>x.trim()).filter(Boolean),cs)}
function uniq(a,cs){const seen=new Set();return a.filter(x=>{const k=cs?String(x):String(x).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
const sameList=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);

// A /pattern/flags made of nothing but plain alternatives — /amazon|ovh/i —
// reads as a list of words. Anything more (anchors, classes, groups, repeats,
// an empty alternative) is a real expression and gives null.
function altWords(raw){
  const m=/^\/([\s\S]*)\/([a-z]*)$/.exec(String(raw==null?'':raw).trim());
  if(!m||!m[1])return null;
  const p=m[1], words=[]; let w='';
  for(let i=0;i<p.length;i++){
    const ch=p[i];
    if(ch==='\\'){const nx=p[i+1];if(nx===undefined||/[A-Za-z0-9]/.test(nx))return null;w+=nx;i++;continue}
    if(ch==='|'){if(!w.trim())return null;words.push(w);w='';continue}
    if('.+*?()[]{}^$'.includes(ch))return null;
    w+=ch;
  }
  if(!w.trim())return null;
  words.push(w);
  return {words,flags:m[2]};
}
const reEsc=(s)=>String(s).replace(/[\\.+*?()[\]{}^$|]/g,'\\$&');
const altRegex=(words,flags)=>'/'+words.map(reEsc).join('|')+'/'+(flags||'');

// How a stored list condition is shown: plain words, words that are stored as
// an expression (the alternation above), or an expression edited as text.
// Only raw makes it an expression — that is what the router reads.
function listForm(f,rxOK){
  f=f||{};
  const raw=String(f.raw||'').trim();
  if(rxOK&&raw.startsWith('/')){
    const a=altWords(raw);
    return a?{form:'alt',words:a.words,flags:a.flags,raw}:{form:'regex',words:[],flags:'',raw};
  }
  const vals=(f.values||[]).map(v=>String(v).trim()).filter(Boolean);
  return {form:'words',words:vals.length?uniq(vals):splitList(raw),flags:'',raw:''};
}
// An expression as typed → as stored: trimmed, slashes added when missing.
const rxText=(s)=>{s=String(s==null?'':s).trim();return !s||s.startsWith('/')?s:'/'+s+'/'};
// Why the engine could not use an expression, or '' — it compiles RE2, and a
// pattern it cannot compile never matches, so "is" would turn everyone away.
// JS accepts lookarounds and back-references; RE2 does not.
function rxProblem(s){
  const m=/^\/([\s\S]*)\/([a-z]*)$/.exec(rxText(s));
  if(!m||!m[1])return 'write it between slashes: /pattern/';
  try{new RegExp(m[1])}catch(e){return 'not a valid expression'}
  if(/\(\?<?[=!]|\\[1-9]/.test(m[1]))return 'lookarounds and back-references are not supported';
  return '';
}
// What a list condition stores, read back from the editor. Words stored as an
// expression stay one, with the same flags; untouched, they keep their text.
function listValue(flag,form,words,rx,orig,flags){
  const off={flag:0,values:[],raw:''};
  if(form==='regex'){
    const s=rxText(rx);
    return s?{flag,values:[s],raw:s}:off;
  }
  words=(words||[]).filter(w=>String(w).trim());
  if(!words.length)return off;
  if(form==='alt'){
    const o=altWords(orig), raw=o&&o.flags===(flags||'')&&sameList(o.words,words)?orig:altRegex(words,flags);
    return {flag,values:[raw],raw};
  }
  // "/…/" typed as the only value is an expression, as it always was.
  if(words.length===1&&/^\/.+\/[a-z]*$/.test(words[0]))return {flag,values:[words[0]],raw:words[0]};
  const raw=words.join(',');
  return {flag,values:words.slice(),raw:raw.startsWith('/')?'':raw};
}
// The words a list condition reads with, [positive, negative]. m is how the
// router compares: 'is' exact or code lists, 'has' substrings, 'dom' exact
// domains — an expression always searches.
function condOps(m,form){
  if(form==='regex')return ['matches','does not match'];
  if(m==='has'||(m==='dom'&&form==='alt'))return ['contains','does not contain'];
  return ['is','is not'];
}

// Output variants live in one string separated by "|||"; the engine trims
// each and picks one per visit. A single output is kept exactly as typed.
function splitVariants(out){
  const s=String(out==null?'':out);
  return s.includes('|||')?s.split('|||').map(x=>x.trim()).filter(Boolean):(s.trim()?[s]:[]);
}
function joinVariants(vs){
  const k=(vs||[]).filter(v=>String(v).trim());
  return k.length>1?k.map(v=>String(v).trim()).join('|||'):(k[0]||'');
}
// Page rewrites for "Proxy a page": one "find|||replace" per line. The engine
// skips lines without the separator; so does this.
function rewriteRows(s){
  return String(s||'').split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.includes('|||'))
    .map(l=>{const i=l.indexOf('|||');return {find:l.slice(0,i),repl:l.slice(i+3)}});
}
function joinRewrite(rows){return (rows||[]).filter(r=>r.find!=='').map(r=>r.find+'|||'+r.repl).join('\n')}

// 3600 → "hour", 7200 → "2 h": a period as it reads on the canvas. 0 is a day,
// as the limit editor says.
function humanSeconds(n){

/**
 * Smallest step from {1, 2, 2.5, 5}×10^k such that span/step is at most n.
 * @param {number} span range width
 * @param {number} n maximum number of steps
 * @returns {number} the step, or 1 when span is not positive or n is below 1
 */
function niceStep(span, n){
  span=+span||0; n=+n||0;
  if(span<=0||n<1) return 1;
  const raw=span/n;
  let exp=Math.floor(Math.log10(raw));
  let pow=Math.pow(10, exp);
  let mant=raw/pow;
  if(!(mant<10)){ mant/=10; exp++; pow*=10 }
  const bases=[1,2,2.5,5,10];
  let m=10;
  for(let i=0;i<bases.length;i++){ if(mant<=bases[i]+1e-10){ m=bases[i]; break } }
  return +(m*pow).toPrecision(3);
}

/**
 * How many fraction digits print step exactly, at most 6.
 * @param {number} step axis step
 * @returns {number} decimal places (2.5 → 1, 10 → 0, 0.025 → 3)
 */
function tickDecimals(step){
  const x=Math.abs(+step)||0;
  if(!isFinite(x)||x===0) return 0;
  for(let d=0;d<6;d++){ if(+x.toFixed(d)===x) return d }
  return 6;
}

/**
 * Snaps a data range to a zero-based axis with a nice step and tick values.
 * @param {number} min data minimum; a missing value counts as 0
 * @param {number} max data maximum; a missing value counts as 0
 * @param {boolean} int counts use a whole step: below 1 becomes 1, a fractional step (2.5) becomes 5×10^k
 * @returns {{lo:number,hi:number,step:number,ticks:number[]}} snapped range; lo and hi rounded to the step's decimals
 */
function axisScale(min, max, int){
  let lo=Math.min(0,+min||0), hi=Math.max(0,+max||0);
  if(lo===hi) hi=lo+1;
  let step=niceStep(hi-lo, 6);
  if(int&&step<1) step=1;
  if(int&&String(step).indexOf('.')>=0){
    const k=Math.pow(10, Math.floor(Math.log10(step)));
    step=5*k;
  }
  lo=Math.floor(lo/step)*step;
  hi=Math.ceil(hi/step)*step;
  const dec=tickDecimals(step);
  const ticks=[];
  const n=Math.round((hi-lo)/step);
  for(let i=0;i<=n;i++){
    let v=+(lo+i*step).toFixed(dec);
    if(Object.is(v,-0)) v=0;
    ticks.push(v);
  }
  lo=+lo.toFixed(dec); if(Object.is(lo,-0)) lo=0;
  hi=+hi.toFixed(dec); if(Object.is(hi,-0)) hi=0;
  return {lo:lo, hi:hi, step:step, ticks:ticks};
}

/**
 * How many data points one axis label covers so the labels fit the width.
 * @param {number} count number of points
 * @param {number} width plot width in pixels
 * @param {number} labelPx width of one label in pixels
 * @param {number[]} steps candidate strides, tried in order
 * @returns {number} the first stride that fits, or the smallest integer stride that fits when none do; 1 when count is below 1
 */
function tickEvery(count, width, labelPx, steps){
  if(count<1) return 1;
  for(let i=0;i<steps.length;i++){
    const s=steps[i];
    if(Math.ceil(count/s)*labelPx<=width) return s;
  }
  return Math.max(1, Math.ceil(count*labelPx/width));
}

/**
 * Return on spend, in percent. No spend with revenue is 100; nothing is 0.
 * @param {number} rev revenue
 * @param {number} cost spend in the same units
 * @returns {number} the percent
 */
function roiPct(rev, cost){
  rev=+rev||0; cost=+cost||0;
  return cost>0 ? (rev-cost)/cost*100 : (rev>0 ? 100 : 0);
}

/**
 * Numerator as a percent of the denominator. A non-positive denominator has no base.
 * @param {number} n numerator
 * @param {number} d denominator
 * @returns {number|null} the percent, or null when d is not positive
 */
function ratioPct(n, d){
  n=+n||0; d=+d||0;
  return d>0 ? n/d*100 : null;
}

/**
 * Share of the half-open window [from, to) that lies inside [start, end).
 * @param {number} from window start, milliseconds
 * @param {number} to window end, milliseconds
 * @param {number} start covered range start, milliseconds
 * @param {number} end covered range end, milliseconds
 * @returns {number} share in [0, 1]; a zero-length window is 1 when its instant sits inside [start, end), otherwise 0
 */
function overlapShare(from, to, start, end){
  from=+from; to=+to; start=+start; end=+end;
  if(to<=from) return from>=start&&from<end ? 1 : 0;
  const ov=Math.min(to,end)-Math.max(from,start);
  return ov>0 ? ov/(to-from) : 0;
}

/**
 * perfCmp orders two metric rows for the performance table.
 * @param {string} k sort field; cr is conv/hits when hits is positive, otherwise 0
 * @param {number} d direction, negative is descending
 * @returns {function} comparator; equal keys break by hits descending
 */
function perfCmp(k, d){
  const val=r=>k==='cr'?(r.hits?r.conv/r.hits:0):(r[k]||0);
  return (a,b)=>{
    const p=(val(a)-val(b))*d;
    if(p) return p;
    return (b.hits||0)-(a.hits||0);
  };
}
/**
 * perfTop keeps the first n campaigns and the first n streams of each.
 * Membership is the order of the tree the caller already sorted.
 * @param {Array} tree nodes with a rows array
 * @param {number} n limit for both levels
 * @returns {{tree:Array, hiddenGroups:number}} copies; each node gains hidden
 */
function perfTop(tree, n){
  const list=tree||[];
  const cut=list.slice(0,n);
  return {tree:cut.map(node=>({...node, rows:(node.rows||[]).slice(0,n), hidden:(node.rows||[]).slice(n)})), hiddenGroups:Math.max(0,list.length-n)};
}
/**
 * deviceKey maps a stored device type to an i18n key.
 * @param {*} v raw device value from logs or filters
 * @returns {string} dev.phone, dev.computer, dev.tablet, or '' when unknown
 */
function deviceKey(v){
  const s=String(v||'').trim().toLowerCase();
  if(s==='phone') return 'dev.phone';
  if(s==='computer') return 'dev.computer';
  if(s==='tablet') return 'dev.tablet';
  return '';
}
/**
 * dedupeConds keeps the first filter row for each field.
 * @param {Array<{f:string,op:string,v:Array}>} list condition rows
 * @returns {Array<{f:string,op:string,v:Array}>} copy with one row per field; rows without f are skipped
 */
function dedupeConds(list){
  const out=[], seen=new Set();
  (Array.isArray(list)?list:[]).forEach(c=>{
    if(!c||!c.f) return;
    const f=String(c.f);
    if(seen.has(f)) return;
    seen.add(f);
    out.push({f, op:c.op||'eq', v:Array.isArray(c.v)?c.v.slice():[]});
  });
  return out;
}
/**
 * codeMode maps a file path extension to an Ace editor mode id.
 * @param {string} path file name or relative path
 * @returns {'php'|'html'|'css'|'javascript'|'json'|'text'} mode without the ace/mode/ prefix
 */
function codeMode(path){
  const base=String(path||'').replace(/\\/g,'/');
  const dot=base.lastIndexOf('.');
  if(dot<0) return 'text';
  const ext=base.slice(dot+1).toLowerCase();
  if(ext==='php'||ext==='phtml') return 'php';
  if(ext==='html'||ext==='htm') return 'html';
  if(ext==='css'||ext==='less'||ext==='scss'||ext==='sass') return 'css';
  if(ext==='js'||ext==='mjs'||ext==='jsx'||ext==='ts'||ext==='tsx'||ext==='vue') return 'javascript';
  if(ext==='json'||ext==='webmanifest'||ext==='map') return 'json';
  return 'text';
}
const PAGE_SECTION={
  dashboard:'dashboard',flows:'flows',offers:'offers',landings:'landings',logs:'logs',conversions:'conversions',
  report:'report',keywords:'keywords',lists:'lists',tools:'tools',networks:'networks',sources:'sources',domains:'domains',

};
const NAV_HOME_ORDER=['dashboard','flows','offers','landings','logs','conversions','report','keywords','lists','tools','networks','sources','domains','automation','integrations'];
/**
 * accessPages returns panel section ids from GET /api/me.
 * @param {object|null} me session payload from /api/me
 * @returns {string[]} allowed page ids, or [] when missing
 */
function accessPages(me){
  if(!me||!Array.isArray(me.pages)) return [];
  return me.pages.slice();
}
/**
 * sectionAllowed reports whether me.pages includes a panel section id.
 * @param {object|null} me session payload
 * @param {string} sec section id (settings, users, api_keys, …)
 * @returns {boolean} true for administrators without access or when sec is in pages
 */
function sectionAllowed(me, sec){
  if(!sec) return false;
  if(!me||!me.access) return true;
  return accessPages(me).includes(sec);
}
/**
 * pageAllowed reports whether me may open a SPA route id.
 * @param {object|null} me session payload
 * @param {string} page route id (dashboard, settings, integrations, …)
 * @returns {boolean} settings is always allowed; others need a matching section
 */
function pageAllowed(me, page){
  if(page==='settings') return true;
  const sec=PAGE_SECTION[page]||page;
  if(!me||!me.access) return true;
  return accessPages(me).includes(sec);
}
/**
 * homePage picks the first allowed item from NAV_HOME_ORDER, else settings.
 * @param {object|null} me session payload
 * @returns {string} route id for the default hash
 */
function homePage(me){
  for(const id of NAV_HOME_ORDER){ if(pageAllowed(me, id)) return id; }
  return 'settings';
}
/**
 * grantLabel reads a group or folder label from a catalog or campaign row.
 * @param {object|null} row entity row
 * @returns {string} trimmed label or ''
 */
function grantLabel(row){
  return String(row&&(row.group||row.folder||'')).trim();
}
/**
 * grantHasList reports whether id or label matches grant lists.
 * @param {object} grant security.Grant-like object with ids and labels arrays
 * @param {string} id entity id
 * @param {string} label group or folder label
 * @returns {boolean}
 */
function grantHasList(grant, id, label){
  const ids=grant&&Array.isArray(grant.ids)?grant.ids:[];
  const labels=grant&&Array.isArray(grant.labels)?grant.labels:[];
  if(id&&ids.includes(id)) return true;
  if(label&&labels.includes(label)) return true;
  return false;
}
/**
 * canEdit reports whether me may change the record row in resource res.
 * @param {object|null} me session payload
 * @param {string} res grants map key (campaigns, offers, …)
 * @param {object|null} row entity with id, group/folder, created_by
 * @returns {boolean}
 */
function canEdit(me, res, row){
  if(!me||!me.access) return true;
  const grant=me.access.grants&&me.access.grants[res];
  if(!grant||grant.mode==='read') return false;
  if(grant.mode==='full') return true;
  const id=row&&row.id!=null?String(row.id):'';
  const label=grantLabel(row);
  if(grant.mode==='selected') return grantHasList(grant, id, label);
  if(grant.mode==='created'){
    if(me.uid&&row&&row.created_by===me.uid) return true;
    return grantHasList(grant, id, label);
  }
  return false;
}
/**
 * canCreate reports whether me may add records in resource res.
 * @param {object|null} me session payload
 * @param {string} res grants map key
 * @returns {boolean}
 */
function canCreate(me, res){
  if(!me||!me.access) return true;
  const grant=me.access.grants&&me.access.grants[res];
  if(!grant) return false;
  if(grant.mode==='full'||grant.mode==='created') return true;
  return false;
}
/**
 * hiddenCols builds the set of column ids hidden for me by access.hidden metrics.
 * @param {object|null} me session payload
 * @returns {Set<string>} column ids to omit from tables and charts
 */
function hiddenCols(me){
  const out=new Set();
  if(!me||!me.access||!Array.isArray(me.access.hidden)) return out;
  const add=a=>a.forEach(x=>out.add(x));
  me.access.hidden.forEach(m=>{
    if(m==='profit') add(['revenue','profit','roi','epc','uepc','epv','payout']);
    if(m==='cost') add(['cost','spend','cpc','cpa','cpm','roi','profit']);
  });
  return out;
}
/**
 * userIsEnv reports whether u is the environment administrator row.
 * @param {object|null} u user row from GET /api/users
 * @returns {boolean}
 */
function userIsEnv(u){
  return !!u&&u.source==='env';
}

function configured(r,c){
  r=r||{};
  switch(c.kind){
    case 'list':{const f=r[c.k]||{};return (f.flag||0)!==0&&((f.values||[]).length>0||!!f.raw)}
    case 'device':return !!(r.computer||r.phone||r.tablet);
    case 'ops':return Object.keys(r.operators||{}).length>0;
    case 'tri':return (r[c.k]||0)!==0;
    case 'iplist':{const f=r.ip_list||{};return (f.flag||0)!==0&&!!f.file}
    case 'schedule':return !!(r.schedule&&r.schedule.enabled);
    case 'limit':return !!(r.limit&&r.limit.enabled);
  }
  return false;
}
// One chip per configured condition — a stream reads as a sentence:
// "country ru, us", "organization contains amazon, google +5".
function condChips(s,hit){
  const r=s.rules||{}, out=[];
  const chip=(c,head,v,full,warn,html)=>out.push(`<span class="chip ${hit===c.k?'hit':warn?'warn':''}" title="${esc(tr(c.l)+' '+full+(warn?' — '+tr(warn)+'; '+tr('the engine cannot use it and this condition never matches'):''))}">${warn?icon('alert'):''}${head?`<span class="k">${esc(head)}</span>`:''}<span class="v">${html||''}${esc(v)}</span></span>`);
  const few=(ws,show)=>ws.slice(0,3).map(show||(w=>w)).join(', ')+(ws.length>3?' +'+(ws.length-3):'');
  COND.forEach(c=>{
    if(!configured(r,c))return;
    const lc=tr(c.l).toLowerCase();
    switch(c.kind){
      case 'list':{
        const f=r[c.k], L=listForm(f,c.rx), [yes,no]=condOps(c.m,L.form), neg=f.flag===1;
        const head=lc+(neg?' '+(no==='is not'?'not':no):(yes==='is'?'':' '+yes));
        if(L.form==='regex'){chip(c,head,L.raw,(neg?no:yes)+' '+L.raw,rxProblem(L.raw));break}
        chip(c,head,few(L.words,w=>c.k==='country'?countryLabel(w, uiLang()):w),(neg?no:yes)+' '+L.words.join(', '),false,c.k==='country'?L.words.slice(0,3).map(flag).join(''):'');
        break}
      case 'device':{const ok=['computer','phone','tablet'].filter(d=>!r[d]);chip(c,lc,ok.join(', ')||'none','is '+(ok.join(', ')||'none'));break}
      case 'ops':{const o=r.operators,v=Object.keys(o).map(k=>(o[k]===2?'':'not ')+k);chip(c,lc,few(v),v.join(', '));break}
      case 'tri':{const v=c.opts[r[c.k]]||'?';chip(c,c.k==='unique'?'':lc,v,v);break}
      case 'iplist':{const f=r.ip_list,n=String(f.file).replace(/\.dat$/,''),h=f.flag===1?'not in list':'in list';chip(c,h,n,h+' '+n);break}
      case 'schedule':{const d=dayList(r.schedule.days);chip(c,'days',d,d);break}
      case 'limit':{const l=r.limit,v=fmt(l.count)+' per '+(l.type===2?humanSeconds(l.seconds):'day');chip(c,'limit',v,v);break}
    }
  });
  return out.length?out.join(''):`<span class="chip any">${tr('any visitor')}</span>`;
}
const variantsOf=(out)=>splitVariants(out).length;
// An output on the canvas: one text, or its variants one per line.
function outHTML(red,out,rows){
  if(red==='landing'){
    const names=outLabel('landing',rows);
    return names?`<div class="out" title="${esc(names)}">${esc(names)}</div>`:'';
  }
  if(NOOUT.has(red))return '';
  const vs=splitVariants(out);
  if(!vs.length)return '<div class="out"><span class="subtle">empty</span></div>';
  if(vs.length===1)return `<div class="out" title="${esc(vs[0])}">${macroHTML(esc(firstLine(vs[0])))}</div>`;
  const cut=vs.length>3?2:3;
  return `<div class="vl">${vs.slice(0,cut).map((v,i)=>`<div title="${esc(v)}"><i>${i+1}</i><span>${macroHTML(esc(firstLine(v)))}</span></div>`).join('')}${vs.length>cut?`<div><i></i><span>+ ${vs.length-cut} more</span></div>`:''}</div>`;
}

async function ensureGroups(refresh){

    const gs=await call('GET','/api/groups');
    if(refresh&&flowsDirty()) return GROUPS;
    GROUPS=Array.isArray(gs)?gs:[]; SAVED=JSON.stringify(GROUPS);

  return GROUPS;
}

  const dup=ids.find((x,i)=>ids.indexOf(x)!==i);
  if(dup)throw new Error('Duplicate flow ID: '+dup);
  // The ID is the first path segment of the link, so it cannot hold what ends one.
  const bad=ids.find(x=>/[\s\/?#]/.test(x));
  if(bad)throw new Error('Flow ID "'+bad+'" must not contain spaces, /, ? or #');
  const badA=GROUPS.flatMap(g=>g.aliases||[]).find(x=>/[\s\/?#]/.test(x));
  if(badA)throw new Error('Alias "'+badA+'" must not contain spaces, /, ? or #');
  await call('PUT','/api/groups',GROUPS);
  SAVED=JSON.stringify(GROUPS);
}

/** campaignFolders returns the unique non-empty trimmed folder names of GROUPS, sorted with localeCompare.
 * @returns {string[]} */
function campaignFolders(){
  const seen=new Set(), names=[];
  for(const g of (Array.isArray(GROUPS)?GROUPS:[])){
    const name=String(g&&g.folder||'').trim();
    if(!name||seen.has(name)) continue;
    seen.add(name); names.push(name);
  }
  names.sort((a,b)=>a.localeCompare(b));

}
const NO_GROUP='\u0000none';
const CAT_Q={offers:'',landings:'',networks:'',sources:'',domains:''};
const CAT_GROUP={offers:'',landings:'',networks:'',sources:'',domains:''};

/** groupLabels returns unique non-empty trimmed group names from catalog rows, sorted with localeCompare.
 * @param {Array} rows catalog records with optional group
 * @returns {string[]} */
function groupLabels(rows){
  const seen=new Set(), names=[];
  for(const r of (Array.isArray(rows)?rows:[])){
    const name=String(r&&r.group||'').trim();
    if(!name||seen.has(name)) continue;
    seen.add(name); names.push(name);
  }

}
/** matchesGroup tests a row against the group filter pick.
 * @param {object} row catalog row
 * @param {string} pick filter value; empty is all, NO_GROUP is unlabeled only
 * @returns {boolean} */
function matchesGroup(row, pick){
  const g=String(row&&row.group||'').trim();

/** textMatch is case-insensitive substring search across fields.
 * @param {string} q query
 * @param {Array} fields values to search
 * @returns {boolean} */
function textMatch(q, fields){
  const t=String(q||'').trim().toLowerCase();
  if(!t) return true;
  return (fields||[]).some(x=>String(x??'').toLowerCase().includes(t));
}
/** fillGroupSelect rebuilds group filter options when markup changed; hides the select when no labels exist.
 * @param {HTMLSelectElement|null} sel group filter
 * @param {Array} rows catalog rows
 * @param {string} pick current selection
 * @returns {string} active pick, cleared when missing from the list */
function fillGroupSelect(sel, rows, pick){
  if(!sel) return pick||'';
  const names=groupLabels(rows);
  const list=Array.isArray(rows)?rows:[];
  const both=names.length>0&&list.some(r=>!String(r&&r.group||'').trim());
  const values=new Set(['',...names]);
  if(both) values.add(NO_GROUP);
  let p=pick||'';
  if(!values.has(p)) p='';
  const apply=(el,html)=>{
    const probe=document.createElement('select');
    probe.innerHTML=html;
    if(el.innerHTML!==probe.innerHTML) el.innerHTML=html;
  };
  apply(sel, opt('',tr('off.allgroups'),p)+names.map(n=>opt(n,n,p)).join('')+(both?opt(NO_GROUP,tr('flows.nofolder'),p):''));
  sel.hidden=names.length===0;
  if(sel.value!==p) sel.value=p;
  return p;
}

function campaignRows(){
  const t=FQ.trim().toLowerCase();
  let rows=GROUPS.filter(g=>{
    const text=!t||[g.id,g.name,g.folder,...(g.aliases||[]),...(g.streams||[]).map(s=>s.name)].some(x=>String(x||'').toLowerCase().includes(t));
    if(!text) return false;
    if(FLOW_SOURCE==='-'){ if(g.source_id) return false }
    else if(FLOW_SOURCE&&g.source_id!==FLOW_SOURCE) return false;
    const folder=String(g.folder||'').trim();
    if(FLOW_FOLDER==='-'){ if(folder) return false }
    else if(FLOW_FOLDER&&folder!==FLOW_FOLDER) return false;
    if(FLOW_STATE==='on') return !!g.status;
    if(FLOW_STATE==='off') return !g.status;
    if(FLOW_STATE==='hits') return perfOf(g,null).hits>0;
    return true;
  });
  const allow=new Set(rows.map(g=>g.id));
  [...FLOW_PICK].forEach(id=>{if(!allow.has(id)) FLOW_PICK.delete(id)});
  if(FLOW_SORT.k){
    const cms=new Map();
    rows.forEach(g=>cms.set(g.id, campaignMetrics(g.id)));
    if(FLOW_SORT.k==='name'){
      const dir=(FLOW_SORT.dir||1)<0?-1:1;
      rows=rows.slice().sort((a,b)=>{
        const ma=leadingMark(campaignLabel(a)), mb=leadingMark(campaignLabel(b));
        if(ma!==mb) return (ma?1:0)-(mb?1:0);
        return campaignLabel(a).localeCompare(campaignLabel(b))*dir;
      });
    }else{
      rows=applySort(rows, FLOW_SORT, (g,k)=>flowSortValue(g,k,cms.get(g.id)), ['name','url','folder']);
    }
  }
  return rows;
}
const FLOW_METRIC=new Set(['hits','uniq','conv','sales','cost','revenue','profit','roi','uepc','leads','rej','cr','crok','crrej','epc','cpc']);
/** flowBands returns the ids of the visible metric columns that get the band background: every other metric column in display order, starting with the first.
 * @param {Array<{id:string}>} cols visible columns in display order
 * @returns {Set<string>} */
function flowBands(cols){
  const out=new Set(); let k=0;
  for(const c of cols||[]){ if(!FLOW_METRIC.has(c.id)) continue; if(k%2===0) out.add(c.id); k++ }
  return out;
}
function flowMetricCell(g,id,bands){

  if(id==='streams') return `<td class="num">${st.length}</td>`;
  if(id==='folder') return `<td class="ell">${esc(g.folder||'')}</td>`;
  if(id==='hits') return `<td class="num${band}">${fmt(cm.hits)}</td>`;
  if(id==='uniq') return `<td class="num${band}">${fmt(cm.uniq)}</td>`;
  if(id==='conv') return `<td class="num${band}">${fmt(cm.ready?cm.conv:0)}</td>`;
  if(id==='sales') return `<td class="num${band}">${fmt(cm.ready?cm.sales:0)}</td>`;
  if(id==='cost') return `<td class="num${band}">${campaignMoney(cm.costBy)}</td>`;
  if(id==='revenue') return `<td class="num${band}">${moneyOf(cm.rev, cm.costBy, cm.ready)}</td>`;
  if(id==='profit') return `<td class="num${band} ${profitCls(cm)}">${profitOf(cm.rev, cm.costBy, cm.ready)}</td>`;
  if(id==='roi') return `<td class="num${band}">${metricROI(cm.rev, cm.costBy, cm.ready)}</td>`;
  if(id==='uepc') return `<td class="num${band}">${moneyOf(cm.uniq?cm.rev/cm.uniq:0, cm.costBy, cm.ready&&!!cm.uniq, 4)}</td>`;
  if(id==='leads') return `<td class="num${band}">${fmt(cm.ready?cm.leads:0)}</td>`;
  if(id==='rej') return `<td class="num${band}">${fmt(cm.ready?cm.rej:0)}</td>`;
  if(id==='cr') return `<td class="num${band}">${cellRatio(cm.ready?cm.conv:0, cm.hits)}</td>`;
  if(id==='crok') return `<td class="num${band}">${cellRatio(cm.ready?cm.sales:0, cm.hits)}</td>`;
  if(id==='crrej') return `<td class="num${band}">${cellRatio(cm.ready?cm.rej:0, cm.hits)}</td>`;
  if(id==='epc') return `<td class="num${band}">${moneyOf(cm.hits?cm.rev/cm.hits:0, cm.costBy, cm.ready&&!!cm.hits, 4)}</td>`;
  if(id==='cpc') return `<td class="num${band}">${cpcCell(cm)}</td>`;
  return '<td></td>';

function syncFlowWidths(){

  const table=sum.closest('table'), headTable=head.closest('table');

  hs.forEach((th,i)=>{if(ss[i]) ss[i].style.width=Math.round(th.getBoundingClientRect().width)+'px'});
  const tw=q('#fgrid .tw'), box=q('#flowsum .tw');
  if(tw&&box){
    box.scrollLeft=tw.scrollLeft;

function paintFlowSum(rows){
  const box=q('#flowsum'), page=q('#flowpage'); if(!box||!page) return;
  const pages=Math.max(1,Math.ceil(rows.length/FLOW_PAGE)||1);
  if(FLOW_PAGE_I>=pages) FLOW_PAGE_I=pages-1;
  const basis=FLOW_PICK.size?rows.filter(g=>FLOW_PICK.has(g.id)):rows;
  const cms=basis.map(g=>campaignMetrics(g.id));
  const ready=cms.length?cms.every(m=>m.ready):!!(typeof FACTS!=='undefined'&&FACTS.ready);
  const acc=cms.reduce((a,m)=>{a.hits+=m.hits;a.uniq+=m.uniq;a.conv+=m.conv;a.sales+=m.sales;a.rev+=m.rev;for(const [k,v] of Object.entries(m.costBy||{}))a.cost[k]=(a.cost[k]||0)+v;return a},{hits:0,uniq:0,conv:0,sales:0,rev:0,cost:{}});
  const cc=costCode(acc.cost);
  const accProfit=cc.multi?0:(acc.rev-cc.amount);
  const bit=(label,val,cls)=>`<span class="sumi"><span class="hint">${label}</span><b class="${cls||''}">${val}</b></span>`;
  box.className='flowsum';
  box.innerHTML=bit(tr('col.clicks'),fmt(acc.hits))
    +bit(tr('col.uniq'),fmt(acc.uniq))
    +bit(tr('col.conv'),fmt(ready?acc.conv:0))
    +bit(tr('col.sales'),fmt(ready?acc.sales:0))
    +bit(tr('col.cost'),campaignMoney(acc.cost))
    +bit(tr('col.revenue'),moneyOf(acc.rev, acc.cost, ready))
    +bit(tr('col.profit'),profitOf(acc.rev, acc.cost, ready),cc.multi?'':(accProfit>0?'ok':accProfit<0?'bad':''))
    +bit(tr('col.roi'),metricROI(acc.rev, acc.cost, ready))
    +bit(tr('col.epc'),moneyOf(acc.hits?acc.rev/acc.hits:0, acc.cost, ready&&!!acc.hits, 4));
  const from=rows.length?FLOW_PAGE_I*FLOW_PAGE+1:0;
  const to=Math.min(rows.length,(FLOW_PAGE_I+1)*FLOW_PAGE);
  page.innerHTML=`<button type="button" class="icon sm" id="fprev" title="${tr('Newer')}" aria-label="${tr('Newer')}" ${FLOW_PAGE_I<=0?'disabled':''}>${icon('back')}</button>
    <button type="button" class="icon sm" id="fnext" title="${tr('Older')}" aria-label="${tr('Older')}" ${FLOW_PAGE_I>=pages-1?'disabled':''}>${icon('arrow')}</button>
    ${flowPageSize()}
    <span class="hint">${FLOW_PICK.size}/${fmt(rows.length)}</span>
    <span class="hint">${fmt(from)}–${fmt(to)} ${tr('of')} ${fmt(rows.length)}</span>`;
  q('#fprev',page).onclick=()=>{if(FLOW_PAGE_I>0){FLOW_PAGE_I--; paintFlowCards()}};
  q('#fnext',page).onclick=()=>{if(FLOW_PAGE_I<pages-1){FLOW_PAGE_I++; paintFlowCards()}};
  q('#fpage',page).onchange=e=>{
    const box=q('#fpage-n',page);
    if(e.target.value==='custom'){box.hidden=false; box.focus(); return}
    box.hidden=true;
    FLOW_PAGE=+e.target.value; FLOW_PAGE_I=0;
    try{localStorage.setItem(FLOW_PAGE_KEY,String(FLOW_PAGE))}catch(err){}
    box.value=FLOW_PAGE; paintFlowCards();
  };
  q('#fpage-n',page).onchange=e=>{
    let n=+e.target.value; if(!(n>=1)) n=1000; if(n>5000) n=5000;
    FLOW_PAGE=n; FLOW_PAGE_I=0; e.target.value=n;
    try{localStorage.setItem(FLOW_PAGE_KEY,String(n))}catch(err){}
    paintFlowCards();
  };
}
function paintFlowCards(){

        if(edit){
          items.push({label:tr('col.spend'),icon:'conversions',on:()=>spendDialog(g.id)},
            {label:g.status?tr('Turn off'):tr('Turn on'),icon:'play',on:()=>{g.status=!g.status;markDirty();paintFlowCards()}},
            {label:tr('Duplicate'),icon:'dup',on:()=>duplicateFlow(g)},'-',
            {label:tr('Delete'),icon:'trash',danger:true,on:()=>deleteFlow(g)});
        }

  };
  if(FLOW_VIEW==='table'){

    bind(grid);

      <div class="mini">${lines||'<div class="ln">'+tr('flows.nostreams')+'</div>'}${st.length>4?`<div class="ln">+ ${st.length-4} ${tr('flows.more')}</div>`:''}</div>
      <div class="row wrap">${links.map(l=>`<span class="pill acc">${icon('arrow')}${esc(l)}</span>`).join('')}<div class="spacer"></div><span class="hint">${st.length} ${tr('flows.streams')}</span></div>
    </div>`}).join('');
  grid.innerHTML=cards+(!filtered&&canCreate(ME,'campaigns')?`<button class="card fcard new" id="newflow2">${icon('plus')} ${tr('flows.new')}</button>`:'')+(filtered&&!cards?`<div class="state">${miss}</div>`:'');
