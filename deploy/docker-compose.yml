# Local development infrastructure: ClickHouse + Redis.
# Run:  docker compose -f deploy/docker-compose.yml up -d
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    ports:
      - "${EMTDS_CH_HTTP_PUBLISH:-${KUZTDS_CH_HTTP_PUBLISH:-127.0.0.1:8123:8123}}"   # HTTP
      - "${EMTDS_CH_NATIVE_PUBLISH:-${KUZTDS_CH_NATIVE_PUBLISH:-127.0.0.1:9000:9000}}"   # native
    environment:
      CLICKHOUSE_DB: kuztds
      CLICKHOUSE_USER: kuztds
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-devpassword}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch_data:/var/lib/clickhouse
      - ../migrations/clickhouse:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${EMTDS_REDIS_PUBLISH:-${KUZTDS_REDIS_PUBLISH:-127.0.0.1:6379:6379}}"

volumes:
  ch_data:
