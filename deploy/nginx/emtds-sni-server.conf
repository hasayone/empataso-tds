# EmTDS: one engine vhost per domain with an issued certificate, chosen by name (SNI).
# apply-edge.sh writes one copy per directory of __STATE_DIR__/tls/domains into conf.d/emtds-sni.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    ssl_certificate __STATE_DIR__/tls/domains/__DOMAIN__/fullchain.pem;
    ssl_certificate_key __STATE_DIR__/tls/domains/__DOMAIN__/privkey.pem;

    include /etc/nginx/emtds/engine-site.conf;
}
