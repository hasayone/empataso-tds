# EmTDS: admin.<domain> vhost — admin panel only via Cloudflare.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^admin\.;
    ssl_certificate __STATE_DIR__/tls/ip.crt;
    ssl_certificate_key __STATE_DIR__/tls/ip.key;
    keepalive_timeout 300s;
    client_max_body_size 64m;

    include /etc/nginx/emtds/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    # $emtds_from_cf и upstream emtds_engine — в emtds-engine.conf, upstream emtds_admin — в emtds.conf (http-контекст conf.d).
    if ($emtds_from_cf = 0) {
        return 444;
    }

    # Partner postbacks use this host without a port. The admin process has no such route.
    location = /postback {
        proxy_pass http://emtds_engine;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $emtds_cf_ip;
        proxy_set_header CF-IPCountry $emtds_cf_country;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://emtds_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_read_timeout 100s;
    }
}
