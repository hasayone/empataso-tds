# EmTDS: bare public IP serves admin and sends /postback to the engine; other hostnames use the panel Apache backend.

# Pooled connections to the admin; emtds-admin-host.conf uses it too.
upstream emtds_admin {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __PUBLIC_IP__;
    ssl_certificate __STATE_DIR__/tls/ip.crt;
    ssl_certificate_key __STATE_DIR__/tls/ip.key;
    keepalive_timeout 300s;
    client_max_body_size 64m;

    # Partner postbacks may call the bare IP. The admin process has no such route.
    # Upstream emtds_engine and the $emtds_cf_* maps live in emtds-engine.conf (http context of conf.d).
    location = /postback {
        include /etc/nginx/emtds/cloudflare-realip.conf;
        real_ip_header CF-Connecting-IP;
        proxy_pass http://emtds_engine;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $emtds_cf_ip;
        proxy_set_header CF-IPCountry $emtds_cf_country;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://emtds_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
    }
}
