# KuzTDS: default 443 vhost — all domains to the tracking engine.
geo $realip_remote_addr $kuztds_from_cf {
    default 0;
    include /etc/nginx/kuztds/cloudflare-geo.conf;
}

map $kuztds_from_cf $kuztds_cf_ip {
    1       $http_cf_connecting_ip;
    default "";
}

map $kuztds_from_cf $kuztds_cf_country {
    1       $http_cf_ipcountry;
    default "";
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/kuztds/tls/ip.crt;
    ssl_certificate_key /etc/kuztds/tls/ip.key;
    keepalive_timeout 300s;
    client_max_body_size 16m;

    include /etc/nginx/kuztds/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://__ENGINE_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $kuztds_cf_ip;
        proxy_set_header CF-IPCountry $kuztds_cf_country;
        proxy_read_timeout 60s;
    }
}
