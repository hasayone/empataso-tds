# EmTDS: default 443 vhost — all domains to the tracking engine.
geo $realip_remote_addr $emtds_from_cf {
    default 0;
    include /etc/nginx/emtds/cloudflare-geo.conf;
}

map $emtds_from_cf $emtds_cf_ip {
    1       $http_cf_connecting_ip;
    default "";
}

map $emtds_from_cf $emtds_cf_country {
    1       $http_cf_ipcountry;
    default "";
}

# Pooled connections to the engine; emtds-admin-host.conf uses it for /postback.
# The engine's idle timeout (120s) outlasts nginx's 60s upstream keepalive.
upstream emtds_engine {
    server __ENGINE_UPSTREAM__;
    keepalive 32;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate __STATE_DIR__/tls/ip.crt;
    ssl_certificate_key __STATE_DIR__/tls/ip.key;
    keepalive_timeout 300s;
    client_max_body_size 16m;

    include /etc/nginx/emtds/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://emtds_engine;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $emtds_cf_ip;
        proxy_set_header CF-IPCountry $emtds_cf_country;
        proxy_read_timeout 60s;
    }
}
