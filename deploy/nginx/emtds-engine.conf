# EmTDS: default 443 vhost — all domains to the tracking engine.
geo $realip_remote_addr $emtds_from_cf {
    default 0;
    include /etc/nginx/emtds/cloudflare-geo.conf;
}

map $emtds_from_cf $emtds_cf_ip {
    1       $http_cf_connecting_ip;
    default "";
}

map $emtds_from_cf $emtds_cf_country {
    1       $http_cf_ipcountry;
    default "";
}

# Pooled connections to the engine; emtds-admin-host.conf uses it for /postback.
# The engine's idle timeout (120s) outlasts nginx's 60s upstream keepalive.
upstream emtds_engine {
    server __ENGINE_UPSTREAM__;
    keepalive 32;
}

# A name without its own certificate in emtds-sni.conf gets the self-signed IP certificate:
# Cloudflare in Full mode accepts it, a browser does not.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate __STATE_DIR__/tls/ip.crt;
    ssl_certificate_key __STATE_DIR__/tls/ip.key;

    include /etc/nginx/emtds/engine-site.conf;
}
