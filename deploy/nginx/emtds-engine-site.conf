# EmTDS: body of every engine vhost on 443. emtds-engine.conf (default_server, self-signed IP
# certificate) and each server of emtds-sni.conf (issued certificate by name) include it.
# Upstreams emtds_engine and emtds_admin and the $emtds_cf_* maps live in conf.d (http context).
keepalive_timeout 300s;
client_max_body_size 16m;

include /etc/nginx/emtds/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;

location ^~ /internal/ {
    return 404;
}

# HTTP-01 ownership check of a certificate order; the admin process answers only its own tokens.
location ^~ /.well-known/acme-challenge/ {
    proxy_pass http://emtds_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 10s;
}

location / {
    proxy_pass http://emtds_engine;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $emtds_cf_ip;
    proxy_set_header CF-IPCountry $emtds_cf_country;
    proxy_read_timeout 60s;
}
