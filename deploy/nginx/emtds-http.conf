# EmTDS: port 80 sends every request to https on the same host, except the HTTP-01 ownership
# check of a certificate order, which goes to the admin process (upstream emtds_admin in emtds.conf).
# apply-edge.sh installs it only when no other server listens on port 80; unmodified package
# welcome pages (conf.d/default.conf, sites-enabled/default) are disabled with a backup first.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://emtds_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 10s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
