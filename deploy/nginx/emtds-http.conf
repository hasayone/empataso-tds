# EmTDS: port 80 sends every request to https on the same host.
# apply-edge.sh installs it only when no other server listens on port 80; unmodified package
# welcome pages (conf.d/default.conf, sites-enabled/default) are disabled with a backup first.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}
