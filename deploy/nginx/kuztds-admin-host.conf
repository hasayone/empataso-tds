# KuzTDS: admin.<domain> vhost — admin panel only via Cloudflare.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^admin\.;
    ssl_certificate /etc/kuztds/tls/ip.crt;
    ssl_certificate_key /etc/kuztds/tls/ip.key;
    keepalive_timeout 300s;
    client_max_body_size 64m;

    include /etc/nginx/kuztds/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    # $kuztds_from_cf — geo в kuztds-engine.conf (http-контекст conf.d).
    if ($kuztds_from_cf = 0) {
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_read_timeout 100s;
    }
}
