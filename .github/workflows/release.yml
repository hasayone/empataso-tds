name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Минимальные права по умолчанию для всего workflow.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    # contents: write нужен только здесь для создания релиза.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Формат тега: v<major>.<minor>.<patch>
          printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "ERROR: tag '$TAG' does not match v<major>.<minor>.<patch>"; exit 1; }

          # Тег должен быть аннотированным
          TAG_TYPE=$(git cat-file -t "$TAG")
          [ "$TAG_TYPE" = "tag" ] \
            || { echo "ERROR: '$TAG' is not an annotated tag (type: $TAG_TYPE)"; exit 1; }

          # Коммит тега должен быть предком origin/main
          TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main \
            || { echo "ERROR: tag commit $TAG_COMMIT is not an ancestor of origin/main"; exit 1; }

      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Текст аннотации без блока SSH-подписи
          SUBJECT=$(git tag -l --format='%(contents:subject)' "$TAG")
          BODY=$(git tag -l --format='%(contents:body)' "$TAG")

          # Предыдущий semver-тег — максимум среди меньших по sort -V.
          # awk итерирует список тегов в версионном порядке и запоминает
          # последний тег до текущего.
          PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=version:refname \
            | awk -v tag="$TAG" '$0 == tag { found=1; exit } { last=$0 } END { if (found && last != "") print last }')

          if [ -n "$PREV" ]; then
            LOG=$(git log "${PREV}..${TAG}^{commit}" --pretty='- %s (%h)')
          else
            LOG=$(git log "${TAG}^{commit}" --pretty='- %s (%h)' --max-count=200)
          fi

          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            printf '%s\n' "$SUBJECT"
            if [ -n "$BODY" ]; then
              printf '\n%s\n' "$BODY"
            fi
            if [ -n "$LOG" ]; then
              printf '\n## Changes\n\n%s\n' "$LOG"
            fi
          } > "$NOTES_FILE"

      - name: Create GitHub release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
